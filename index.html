<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DICTIONARY">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest?v=4">
<link rel="icon" type="image/svg+xml" href="./icon.svg?v=4">
<link rel="apple-touch-icon" sizes="192x192" href="./dict-icon-192.png?v=4">
<title>DICTIONARY · 单词记忆助手</title>
<style>
:root{
  --primary:#2c5e4f;
  --primary-dark:#1f4a3d;
  --primary-soft:#e8f0ed;
  --primary-light:#f2f7f5;
  --bg-color:#f5f7f6;
  --card:#ffffff;
  --text-main:#1f2523;
  --text-sub:#5c6662;
  --text-muted:#9aa5a0;
  --line:#e8edeb;
  --white:#ffffff;
  --red:#d93b3b;
  --amber:#d98a1f;
  --amber-soft:#fdf3e1;
  --blue:#2f5f9e;
  --blue-soft:#e8f0fb;
  --green:#2f9e6a;
  --radius:18px;
  --shadow:0 2px 12px rgba(31,74,61,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background-color:var(--bg-color);color:var(--text-main);
  display:flex;justify-content:center;height:100vh;height:100dvh;overflow:hidden;
}
button{font-family:inherit;}
#app{
  width:100%;max-width:480px;background-color:var(--bg-color);
  position:relative;height:100%;display:flex;flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.06);padding-top:env(safe-area-inset-top);
}
.content{
  flex:1;min-height:0;overflow-y:auto;
  padding:14px 16px 110px;
  display:none;
  -webkit-overflow-scrolling:touch;
}
.content.active{display:block;}
#tab-cards{padding:12px 14px 100px;}
#tab-grammar{padding:14px 16px 100px;}
#tab-checklist{padding:14px 16px 110px;}

/* ============ 通用按钮 ============ */
.btn-primary{
  flex:1;padding:14px;background:var(--primary);color:#fff;border:none;
  border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 12px rgba(44,94,79,.22);transition:transform .1s,background .2s;
}
.btn-primary:active{transform:scale(.98);background:var(--primary-dark);}
.btn-primary:disabled{opacity:.5;box-shadow:none;}
.btn-outline{
  padding:14px 20px;background:var(--white);color:var(--primary);
  border:1px solid var(--primary);border-radius:14px;font-size:15px;cursor:pointer;
}
.btn-outline:active{background:var(--primary-light);}
.empty-hint{font-size:14px;color:#a9b5af;text-align:center;padding:40px 12px;line-height:1.7;}
.empty-state{width:100%;text-align:center;color:var(--text-muted);margin-top:100px;font-size:15px;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}

/* ============ 设置折叠 ============ */
.fold{margin-top:28px;background:var(--white);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.fold summary{font-size:14px;color:var(--text-sub);cursor:pointer;outline:none;list-style:none;font-weight:600;}
.fold summary::-webkit-details-marker{display:none;}
.stats-box{background:var(--bg-color);padding:18px;border-radius:14px;margin:14px 0;}
.stats-row{display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px;color:var(--text-sub);}
.stats-row:last-child{margin-bottom:0;}
.stats-val{font-weight:700;color:var(--primary);}
.setting-item{margin-bottom:14px;}
.setting-item label{display:block;font-size:13px;margin-bottom:8px;color:var(--text-muted);}
.setting-item input{
  width:100%;padding:14px;border:1px solid var(--line);background:var(--bg-color);
  border-radius:12px;font-size:15px;outline:none;
}
.setting-item input:focus{border-color:var(--primary);}

/* ============ 录入页：固定预览区 + 底部输入区 ============ */
#tab-input.content{padding:12px 14px calc(84px + env(safe-area-inset-bottom));}
#tab-input.content.active{display:flex;flex-direction:column;gap:10px;overflow:hidden;}
.recognize-status-bar{
  flex:none;height:46px;display:flex;align-items:center;gap:9px;padding:0 13px;
  border:1px solid #e6ede9;border-radius:14px;background:#fff;box-shadow:var(--shadow);
}
.recognize-dot{width:8px;height:8px;flex:none;border-radius:50%;background:#aab5af;}
.recognize-dot.loading{background:#d99a36;box-shadow:0 0 0 4px rgba(217,154,54,.12);animation:pulse 1s infinite;}
.recognize-dot.done{background:#35a36d;}
.recognize-dot.fail{background:#d95b56;}
#recognizeTitle{flex:none;font-size:13px;font-weight:750;color:var(--primary);}
#recognizeMessage{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text-muted);text-align:right;}
.recognition-preview{
  flex:1 1 0;min-height:0;overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;-webkit-overflow-scrolling:touch;
  border:1px solid #e1eae5;border-radius:18px;background:rgba(255,255,255,.6);
  padding:10px;box-shadow:inset 0 1px 6px rgba(31,74,61,.04);
}
.input-composer{
  flex:none;background:#fff;border:1px solid #e4ebe7;border-radius:20px;
  padding:8px 10px 7px;box-shadow:0 8px 28px rgba(31,74,61,.10);
}
.paste-box{
  display:block;width:100%;height:92px;min-height:72px;padding:9px 9px 7px;border:0;border-radius:12px;
  background:transparent;font-size:15px;line-height:1.55;resize:none;outline:none;
  font-family:inherit;color:var(--text-main);
}
.paste-box::placeholder{color:#a8b5af;}
.work-toolbar{display:flex;align-items:center;justify-content:space-around;gap:8px;border-top:1px solid #edf1ef;padding:6px 2px 0;margin-top:3px;}
.tool-icon,.modal-icon-action{width:42px;height:38px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#718079;border-radius:12px;cursor:pointer;}
.tool-icon:active,.modal-icon-action:active{background:var(--primary-soft);color:var(--primary);}
.tool-icon.tool-search{background:var(--primary);color:#fff;width:48px;}
.tool-icon.tool-search:active{background:var(--primary-dark);}

/* ============ 统一阅读样式（预览 / 卡片 / 语法弹窗） ============ */
.rd .card-header{
  display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line);
}
.rd .word-big{font-size:34px;font-weight:700;color:var(--red);letter-spacing:.5px;line-height:1.2;word-break:break-word;}
.rd .word-big.w-m{font-size:28px;}
.rd .word-big.w-s{font-size:24px;}
.rd .word-big.w-xs{font-size:21px;}
.rd .word-phonetic{font-size:20px;color:#777;margin-top:6px;}
.rd .word-syllable{font-size:19px;color:var(--primary);margin-top:4px;letter-spacing:1.5px;font-weight:500;}
.rd .card-body{font-size:20px;line-height:1.75;color:#333;}
.rd .sec{margin-bottom:20px;}
.rd .sec:last-child{margin-bottom:0;}
.rd .sec-label{
  font-size:16px;color:var(--primary);font-weight:700;letter-spacing:1.5px;
  margin-bottom:8px;display:inline-block;background:var(--primary-soft);
  padding:3px 11px;border-radius:20px;
}
.rd .sec-body{font-size:20px;line-height:1.75;color:#333;white-space:normal;word-break:break-word;}
.rd .para{display:block;margin-bottom:11px;}
.rd .para:last-child{margin-bottom:0;}
.rd .sec-body.en{font-family:Georgia,"Times New Roman",serif;color:#3a3a3a;}
.rd .sec.emph{border-left:4px solid #bcd3c9;padding-left:13px;}
.rd .sec.pit{border-left-color:#efc27a;}
.rd .sec.pit .sec-label{background:var(--amber-soft);color:var(--amber);}
.rd .sec.cmp{border-left-color:#a9c4e8;}
.rd .sec.cmp .sec-label{background:var(--blue-soft);color:var(--blue);}
.rd .sec.def .sec-label{background:#eef1f0;color:var(--text-sub);}
.rd .card-footer{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:16px;color:var(--text-muted);text-align:center;}
.hd-right{display:flex;align-items:center;gap:8px;flex:none;}
.pv-star{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:0;border-radius:50%;background:transparent;color:var(--primary);cursor:pointer;}
.pv-star:active{background:var(--primary-soft);}
.pv-star.on{color:var(--amber);cursor:default;}
.pv-star.on svg{fill:currentColor;}
.cat-chip{flex:none;font-size:13px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--primary-soft);color:var(--primary);}
mark.hl{background:linear-gradient(transparent 52%,#ffe28a 52%);color:#1f4a3d;font-weight:700;padding:0 1px;border-radius:2px;}
.pron-row{display:flex;gap:6px;margin-top:10px;}
.pron-btn{
  font-size:14px;padding:5px 14px;border-radius:20px;border:1px solid var(--primary);
  background:var(--white);color:var(--primary);cursor:pointer;
}
.pron-btn:active{background:var(--primary-soft);}

/* 预览卡片 */
.preview-card{border:1px solid #e6eeea;border-radius:16px;padding:16px;margin-bottom:12px;background:#fff;box-shadow:var(--shadow);}
.preview-card:last-child{margin-bottom:0;}
.preview-group-row{display:flex;align-items:center;gap:8px;margin-top:18px;padding-top:14px;border-top:1px dashed #dfe8e3;}
.preview-group-row label{font-size:13px;font-weight:700;color:var(--primary);white-space:nowrap;}
.preview-group-select{flex:1;min-width:0;padding:10px 10px;border:1px solid #dce6e0;border-radius:11px;background:#f9fbfa;color:var(--text-main);font:inherit;font-size:14px;outline:none;}
.preview-group-select:focus{border-color:var(--primary);}
.pv-fav{flex:none;padding:10px 16px;border:0;border-radius:11px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;cursor:pointer;}
.pv-fav:active{background:var(--primary-dark);}
.pv-saved{flex:none;padding:10px 14px;border-radius:11px;background:#e6f4ec;color:var(--green);font-size:14px;font-weight:700;}
.preview-tip{font-size:12px;color:#8c9992;margin-bottom:10px;line-height:1.6;}

/* ============ 语法目录 ============ */
.grammar-section{margin:0 0 16px;background:#fff;border-radius:17px;padding:15px 14px;box-shadow:var(--shadow);}
.grammar-section-title{font-size:16px;font-weight:750;color:var(--primary);margin-bottom:6px;}
.grammar-group-title{font-size:13px;font-weight:700;color:#64736b;margin:14px 1px 8px;}
.grammar-topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grammar-topic{display:flex;align-items:center;justify-content:space-between;gap:5px;text-align:left;border:1px solid #e8efeb;background:#f9fbfa;color:#34443d;border-radius:11px;padding:10px 9px;font-size:13px;line-height:1.35;min-height:42px;cursor:pointer;}
.grammar-topic:after{content:'›';font-size:18px;color:#9aaba2;}
.grammar-topic:active{background:var(--primary-soft);border-color:#cbdcd4;}

/* ============ 卡片目录与分组 ============ */
.group-manager{margin:0 0 16px;padding:14px 14px;border-radius:16px;}
.group-manager summary{color:var(--primary);}
.group-create-row{display:grid;grid-template-columns:78px minmax(0,1fr) 76px 54px;gap:6px;margin-top:13px;}
.group-create-row input,.group-create-row select{min-width:0;width:100%;padding:9px 7px;border:1px solid var(--line);border-radius:10px;background:#fbfcfb;color:var(--text-main);font:inherit;font-size:12px;outline:none;}
.group-create-row button{border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:12px;font-weight:650;}
.group-hint{font-size:11px;color:var(--text-muted);margin-top:8px;}
.group-manager-list{margin-top:8px;}
.group-manager-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-top:1px solid #f0f3f1;font-size:12px;color:var(--text-sub);}
.group-manager-row strong{color:var(--text-main);font-weight:650;}
.group-manager-row .group-meta{margin-left:auto;color:var(--text-muted);white-space:nowrap;}
.group-remove{border:0;background:transparent;color:#bd7774;font-size:12px;padding:4px 2px;}
.card-directory-title{font-size:17px;font-weight:750;color:var(--text-main);margin:4px 2px 12px;}
.card-category{margin:0 0 16px;}
.card-category-head{font-size:14px;color:var(--primary);font-weight:750;padding:5px 3px 8px;display:flex;justify-content:space-between;}
.card-category-head span{font-size:12px;color:var(--text-muted);font-weight:500;}
.card-group{margin:0 0 12px;}
.card-group-head{font-size:12px;color:#8a9690;padding:4px 4px 6px;}
.card-directory-item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:13px;padding:13px 13px;margin-bottom:7px;box-shadow:var(--shadow);cursor:pointer;min-height:56px;}
.card-directory-item:active{background:#f1f6f3;}
.card-directory-item.select-mode{cursor:default;}
.card-directory-item.select-mode .card-directory-main{pointer-events:none;}
.card-directory-main{flex:1;min-width:0;}
.card-directory-word{font-size:16px;font-weight:700;color:#28332e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-directory-desc{font-size:13px;color:var(--text-muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card-directory-arrow{color:#a7b2ac;font-size:21px;}
.card-count{font-size:12px;color:var(--text-muted);font-weight:500;}
.cards-bulk-toolbar{display:flex;align-items:center;justify-content:flex-end;min-height:38px;margin:-4px 0 10px;}
.bulk-entry-buttons{display:flex;gap:7px;}
.cards-bulk-toolbar>button,#bulkModeActions button{border:1px solid #d7e4dd;border-radius:10px;background:#fff;color:var(--primary);font-size:12px;font-weight:700;padding:8px 12px;}
#bulkModeActions{width:100%;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
#bulkSelectedCount{margin-right:auto;font-size:12px;color:var(--text-sub);}
#bulkModeActions button:disabled{opacity:.4;}
#bulkModeActions button.bulk-cancel{color:#8a9690;border-color:#e4e9e6;}
.bulk-classify-controls{display:flex;align-items:center;gap:6px;width:100%;}
.bulk-classify-controls select{flex:1;min-width:0;padding:8px 7px;border:1px solid #d7e4dd;border-radius:9px;background:#fff;color:var(--text-main);font-size:12px;}
.card-select{width:19px;height:19px;flex:none;accent-color:var(--primary);margin:0 2px 0 0;}
.history-section{margin:18px 0 10px;padding:12px 12px 4px;background:rgba(255,255,255,.68);border:1px solid #e4ebe7;border-radius:16px;}
.history-section>summary{padding:3px 2px 10px;color:var(--primary);font-size:14px;font-weight:750;cursor:pointer;list-style:none;}
.history-section>summary::-webkit-details-marker{display:none;}
.history-category{padding:8px 0 2px;border-top:1px solid #edf1ef;margin-top:4px;}
.history-category-title{font-size:13px;font-weight:750;color:#6c7c73;margin:0 2px 8px;}
.history-empty{padding:10px 2px 14px;color:var(--text-muted);font-size:12px;}

/* ============ 卡片详情：整张卡片左右滑动 ============ */
.card-modal{padding:0;background:rgba(15,25,20,.58);align-items:stretch;}
.card-track{
  position:relative;display:flex;align-items:stretch;gap:28px;width:100%;height:100%;
  overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;
  padding:calc(6vh + env(safe-area-inset-top)) 14px calc(6vh + env(safe-area-inset-bottom));
  scroll-padding-inline:14px;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.card-track::-webkit-scrollbar{display:none;}
.card-page{
  flex:0 0 100%;min-width:0;min-height:0;scroll-snap-align:center;scroll-snap-stop:always;
  overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;
  background:#fff;border-radius:22px;padding:22px 18px 18px;
  box-shadow:0 8px 30px rgba(0,0,0,.18);
}
.card-modal-close{
  position:absolute;top:calc(8px + env(safe-area-inset-top));right:10px;z-index:5;width:38px;height:38px;
  border:0;border-radius:50%;background:rgba(255,255,255,.9);color:#5c6662;font-size:26px;line-height:1;
  box-shadow:0 2px 10px rgba(0,0,0,.18);
}
.card-detail-group{display:flex;align-items:center;gap:8px;margin:20px 0 0;font-size:14px;color:var(--text-sub);}
.card-detail-group select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fbfcfb;padding:9px 10px;color:var(--text-main);font:inherit;font-size:13px;}

/* ============ 清单 ============ */
.check-item{
  display:flex;align-items:flex-start;gap:12px;padding:14px;
  background:var(--white);border-radius:16px;margin-bottom:10px;
  box-shadow:var(--shadow);animation:fadeIn .25s ease;
}
.check-box{
  width:24px;height:24px;border-radius:50%;border:2px solid #ccd6d1;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  margin-top:1px;cursor:pointer;transition:all .2s;
}
.check-box.done{background:var(--primary);border-color:var(--primary);color:#fff;}
.check-box svg{opacity:0;transition:opacity .2s;}
.check-box.done svg{opacity:1;}
.check-main{flex:1;min-width:0;}
.check-text{font-size:15px;line-height:1.5;color:var(--text-main);word-break:break-word;}
.check-text.done{color:#b3b3b3;text-decoration:line-through;}
.check-photo{width:58px;height:58px;object-fit:cover;border-radius:10px;display:block;border:1px solid var(--line);cursor:zoom-in;filter:blur(5px);transition:filter .18s ease;}
.check-photo:active{filter:blur(2px);}
.check-photo-grid{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px;}
.check-photo-add{height:58px;min-width:58px;padding:0 9px;border:1px dashed #c9d7cf;border-radius:10px;background:#f8fbf9;color:var(--primary);font-size:11px;font-weight:650;}
.check-photo-add:disabled{opacity:.4;}
.check-meta{font-size:11px;color:#bbb;margin-top:4px;}
.delete-btn{color:#e0605f;font-size:13px;background:none;border:none;cursor:pointer;flex-shrink:0;padding:4px 0 4px 8px;}
.add-check-row{display:flex;gap:10px;margin-bottom:14px;}
.add-check-row input{
  flex:1;min-width:0;padding:14px;border:1px solid var(--line);background:var(--white);
  border-radius:14px;font-size:15px;outline:none;
}
.add-check-row input:focus{border-color:var(--primary);}
.add-check-row button{padding:0 22px;border-radius:14px;border:none;background:var(--primary);color:#fff;font-size:15px;font-weight:600;cursor:pointer;}
.check-toolbar{display:flex;gap:10px;margin-bottom:18px;}
.check-toolbar button{flex:1;padding:12px;border-radius:14px;font-size:14px;cursor:pointer;background:var(--white);color:var(--primary);border:1px solid var(--primary);}
.check-toolbar button.ghost{color:#888;border-color:#ddd;}
.w-ai{width:100%;margin-top:12px;padding:12px;border-radius:14px;font-size:14px;cursor:pointer;background:var(--white);color:var(--primary);border:1px solid var(--primary);font-weight:600;}
.w-ai:active{background:var(--primary-light);}
.rest-card{background:#fff;border-radius:18px;padding:17px;margin:0 0 18px;box-shadow:var(--shadow);}
.rest-head{display:flex;align-items:center;justify-content:space-between;}
.rest-title{font-size:16px;font-weight:750;color:var(--primary);}
.rest-sub{font-size:12px;color:var(--text-muted);margin-top:4px;}
.rest-icon{font-size:23px;}
.rest-summary{margin-top:13px;padding:12px;background:var(--bg-color);border-radius:12px;color:var(--text-sub);font-size:14px;font-weight:650;}
.rest-action{width:100%;margin-top:11px;padding:12px;border:0;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:14px;font-weight:700;}
.rest-action.running{background:var(--amber);color:#fff;}
.rest-history{font-size:12px;color:var(--text-muted);line-height:1.8;margin-top:8px;}
.sleep-section{margin-top:15px;padding-top:14px;border-top:1px solid #edf1ef;}
.sleep-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.sleep-title{font-size:14px;font-weight:750;color:var(--primary);}
.sleep-summary{font-size:12px;color:var(--text-sub);margin-top:8px;padding:10px 11px;border-radius:11px;background:var(--bg-color);}
.sleep-actions{display:flex;gap:8px;margin-top:9px;}
.sleep-actions button{flex:1;border:1px solid var(--primary);border-radius:11px;background:#fff;color:var(--primary);padding:10px 8px;font-size:13px;font-weight:650;}
.sleep-actions button.running{background:var(--amber);border-color:var(--amber);color:#fff;}
.sleep-history{font-size:11px;color:var(--text-muted);line-height:1.8;margin-top:8px;}

/* ============ 选词查询 ============ */
.sel-bar{
  position:fixed;z-index:200;display:none;background:var(--primary-dark);
  border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);overflow:hidden;
}
.sel-bar.active{display:flex;}
.sel-bar button{background:none;border:none;color:#fff;font-size:14px;padding:10px 16px;cursor:pointer;}
.sel-bar button + button{border-left:1px solid rgba(255,255,255,.2);}

/* ============ 底部导航 ============ */
.bottom-nav{
  position:absolute;bottom:calc(10px + env(safe-area-inset-bottom));left:10px;right:10px;
  height:58px;background:rgba(255,255,255,.95);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  border-radius:20px;box-shadow:0 4px 22px rgba(31,74,61,.12);
  display:flex;justify-content:space-around;align-items:center;
  padding:6px;gap:4px;z-index:20;
}
.nav-item{
  color:#8d9993;font-size:14px;font-weight:500;flex:1;text-align:center;
  height:100%;line-height:46px;cursor:pointer;transition:all .2s;border-radius:14px;
}
.nav-item.active{color:var(--primary);background:var(--primary-soft);font-weight:750;}

/* ============ 弹窗 ============ */
.modal{
  display:none;position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.4);z-index:100;align-items:center;
  justify-content:center;padding:16px;
}
.modal.active{display:flex;}
.modal-content{
  background:#fff;width:100%;max-height:86vh;max-height:86dvh;border-radius:22px;
  padding:18px 17px 16px;display:flex;flex-direction:column;animation:scaleIn .25s ease;min-height:180px;
}
.modal-header{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:17px;color:var(--primary);margin-bottom:12px;flex-shrink:0;}
.modal-head-actions{display:flex;align-items:center;gap:5px;margin-left:auto;}
.modal-icon-action{width:36px;height:36px;color:var(--primary);}
.modal-close{border:0;background:transparent;color:#aab3ae;font-size:26px;line-height:1;padding:0 3px;}
.modal-body{flex:1;min-height:0;overflow-y:auto;font-size:16px;line-height:1.75;color:#333;margin-bottom:12px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.modal-footer{display:flex;gap:10px;flex-shrink:0;}
.modal-footer .btn-outline{flex:1;}
#infoModal .modal-content{height:90vh;height:90dvh;}
#infoModal.preview-mode .modal-header,#infoModal.preview-mode .modal-footer{display:none;}
#infoModal.preview-mode .modal-content{padding-top:14px;padding-bottom:14px;}
#infoModal.preview-mode .modal-body{margin-bottom:0;}
#infoBody.rd{font-size:20px;}
.app-toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:350;max-width:88%;padding:10px 15px;background:rgba(31,45,39,.91);color:#fff;border-radius:12px;font-size:12px;line-height:1.4;opacity:0;pointer-events:none;transition:all .22s;white-space:normal;text-align:center;}
.app-toast.show{opacity:1;transform:translate(-50%,0);}
.photo-preview-overlay{position:fixed;inset:0;z-index:1400;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(12,18,15,.92);}
.photo-preview-overlay img{display:block;max-width:96vw;max-height:86vh;object-fit:contain;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.32);}
.photo-preview-close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:18px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:30px;line-height:1;}
.app-dialog{display:none;position:absolute;inset:0;z-index:1200;align-items:center;justify-content:center;padding:18px;background:rgba(14,25,19,.48);backdrop-filter:blur(3px);}
.app-dialog.active{display:flex;}
.app-dialog-card{width:100%;max-width:360px;background:#fff;border:1px solid #e5ede8;border-radius:20px;padding:19px 18px 16px;box-shadow:0 14px 40px rgba(18,46,33,.22);animation:scaleIn .18s ease;}
.app-dialog-title{font-size:17px;font-weight:800;color:var(--primary);margin-bottom:9px;}
.app-dialog-message{font-size:14px;line-height:1.7;color:var(--text-sub);white-space:pre-line;}
.app-dialog-actions{display:flex;gap:9px;margin-top:18px;}
.app-dialog-actions button{flex:1;border-radius:12px;padding:12px 10px;font-size:14px;font-weight:700;border:1px solid var(--primary);}
.app-dialog-cancel{background:#fff;color:var(--text-sub);border-color:#e0e8e3!important;}
.app-dialog-confirm{background:var(--primary);color:#fff;}

/* 主屏幕图标安装入口 */
.install-home-card{display:flex;align-items:center;gap:10px;padding:11px;margin:3px 0 14px;border:1px solid #e6eeea;border-radius:15px;background:#fbfcfb;}
.install-app-icon{width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#2c5e4f;color:#fff;box-shadow:0 3px 9px rgba(44,94,79,.22);}
.install-app-icon span{font-size:6.5px;letter-spacing:.15px;font-weight:900;white-space:nowrap;}
.install-home-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px;}
.install-home-copy strong{font-size:13px;color:#30443a;}
.install-home-copy span{font-size:10px;color:var(--text-muted);}
.install-home-button{border:0;border-radius:10px;padding:9px 13px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;}

@media (max-width:370px){
  .group-create-row{grid-template-columns:70px minmax(0,1fr) 66px 48px;gap:4px;}
  .group-create-row input,.group-create-row select{font-size:11px;padding:8px 5px;}
  .grammar-topic-grid{grid-template-columns:1fr;}
  #recognizeMessage{font-size:10px;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= TAB 1 录入 ================= -->
  <div class="content active" id="tab-input">
    <div class="recognize-status-bar" id="recognizeStatus" role="status" aria-live="polite">
      <span class="recognize-dot" id="recognizeDot"></span><strong id="recognizeTitle">等待识别</strong>
      <span id="recognizeMessage">粘贴内容后，点击放大镜进行 AI 识别</span>
    </div>
    <div class="recognition-preview rd" id="recognitionPreview"><div class="empty-hint">AI 识别结果会显示在这里</div></div>

    <div class="input-composer" id="inputDock">
      <textarea class="paste-box" id="batchInput" placeholder="粘贴或输入英语单词、短语及学习材料…
支持多行、逗号分隔与图片识别"></textarea>
      <div class="work-toolbar" aria-label="录入工具">
        <button class="tool-icon" type="button" title="清空" aria-label="清空" onclick="clearBatch()">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>
        </button>
        <button class="tool-icon" type="button" title="相机识别" aria-label="相机识别" onclick="document.getElementById('imageInput').click()">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H8l1.5-2h5L16 6h2.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <button class="tool-icon" type="button" title="全部收藏" aria-label="全部收藏" onclick="favoriteFromToolbar()">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
        </button>
        <button class="tool-icon tool-search" type="button" title="AI 识别" aria-label="AI 识别" onclick="triggerSearch()">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 4.3 4.3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= TAB 2 语法 ================= -->
  <div class="content" id="tab-grammar">
    <div id="grammarTopics"></div>
  </div>

  <!-- ================= TAB 3 卡片 ================= -->
  <div class="content" id="tab-cards">
    <details class="fold group-manager">
      <summary>卡片分组管理</summary>
      <div class="group-create-row">
        <select id="groupCategory" aria-label="分组类别"><option>单词</option><option>语法</option><option>其它</option></select>
        <input id="groupName" type="text" placeholder="分组名称">
        <input id="groupLimit" type="number" min="0" placeholder="数量不限" aria-label="数量上限">
        <button type="button" onclick="createCardGroup()">创建</button>
      </div>
      <div class="group-hint">数量上限填 0 表示不限；同一类别可建立多个分组。</div>
      <div id="groupManagerList"></div>
    </details>
    <div class="card-directory-title">卡片目录</div>
    <div class="cards-bulk-toolbar" id="cardsBulkToolbar">
      <div class="bulk-entry-buttons" id="bulkEntryButtons">
        <button type="button" id="bulkClassifyButton" onclick="toggleBatchClassifyMode()">批量分类</button>
        <button type="button" id="bulkModeButton" onclick="toggleBatchDeleteMode()">批量删除</button>
      </div>
      <div id="bulkModeActions" style="display:none;">
        <span id="bulkSelectedCount">已选 0 张</span>
        <button type="button" onclick="selectAllCards()">全选</button>
        <div class="bulk-classify-controls" id="bulkClassifyControls" style="display:none;">
          <select id="bulkCategory" aria-label="批量目标类别" onchange="renderBulkGroupOptions()"><option>单词</option><option>语法</option><option>其它</option></select>
          <select id="bulkGroup" aria-label="批量目标分组"></select>
          <button type="button" id="bulkApplyButton" onclick="applyBatchClassification()" disabled>应用分类</button>
        </div>
        <button type="button" id="bulkDeleteButton" onclick="requestDeleteSelectedCards()" disabled>删除选中</button>
        <button type="button" class="bulk-cancel" onclick="cancelBatchMode()">取消</button>
      </div>
    </div>
    <div id="cardsContainer"></div>
  </div>

  <!-- ================= TAB 4 清单 ================= -->
  <div class="content" id="tab-checklist">
    <div class="rest-card">
      <div class="rest-head"><div><div class="rest-title">休息记录</div><div class="rest-sub" id="restStatus">今天还没有休息记录</div></div><span class="rest-icon">☕</span></div>
      <div class="rest-summary" id="restSummary">今日 0 次 · 共 0 分钟</div>
      <button class="rest-action" id="restButton" onclick="toggleBreak()">开始休息</button>
      <div class="rest-history" id="restHistory"></div>
      <button class="w-ai" onclick="analyzeWork()">AI 分析休息习惯</button>
      <div class="sleep-section">
        <div class="sleep-head"><div class="sleep-title">睡眠记录</div><span class="rest-icon">🌙</span></div>
        <div class="sleep-summary" id="sleepSummary">尚无睡眠记录</div>
        <div class="sleep-actions">
          <button type="button" id="sleepButton" onclick="toggleSleepRecording()">开始睡眠</button>
          <button type="button" onclick="analyzeSleep()">AI 分析睡眠</button>
        </div>
        <div class="sleep-history" id="sleepHistory">开始睡眠后，醒来时结束记录。</div>
      </div>
    </div>
    <div class="add-check-row">
      <input type="text" id="checkInput" placeholder="添加清单事项，如：带钥匙 / 做 20 个单词…" onkeypress="if(event.key==='Enter')addCheckItem()">
      <button onclick="addCheckItem()">添加</button>
    </div>
    <div class="check-toolbar">
      <button onclick="resetChecklist()">一键循环刷新</button>
      <button class="ghost" onclick="analyzeChecklist()">AI 分析</button>
    </div>
    <div id="checklistContainer"></div>
    <details class="fold" id="settingsFold">
      <summary>设置与统计</summary>
      <div class="stats-box">
        <div class="stats-row"><span>API 调用次数</span><span class="stats-val" id="stat-api-calls">0</span></div>
        <div class="stats-row"><span>估算 TOKEN 量</span><span class="stats-val" id="stat-tokens">0</span></div>
        <div class="stats-row"><span>卡片总数</span><span class="stats-val" id="stat-words">0</span></div>
        <div class="stats-row"><span>清单事项数</span><span class="stats-val" id="stat-checks">0</span></div>
      </div>
      <div class="setting-item">
        <label>DeepSeek API Key（仅本地存储）</label>
        <input type="password" id="apiKeyInput" placeholder="sk-...">
      </div>
      <button class="btn-primary" onclick="saveApiKey()" style="width:100%; margin-bottom:12px;">保存 API Key</button>
      <div class="install-home-card">
        <div class="install-app-icon"><span>DICT</span></div>
        <div class="install-home-copy"><strong>添加到主屏幕</strong><span>绿色 DICT 应用图标</span></div>
        <button type="button" class="install-home-button" onclick="addToHomeScreen()">添加</button>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn-outline" style="flex:1;" onclick="exportData()">导出备份</button>
        <button class="btn-outline" style="flex:1; border-color:#ddd; color:#666;" onclick="document.getElementById('importFile').click()">导入恢复</button>
      </div>
      <button class="w-ai" type="button" onclick="refreshAppPage()">一键刷新应用页面</button>
    </details>
  </div>

  <!-- 底部导航 -->
  <div class="bottom-nav">
    <div class="nav-item active" data-tab="input" onclick="switchTab('input')">录入</div>
    <div class="nav-item" data-tab="cards" onclick="switchTab('cards')">卡片</div>
    <div class="nav-item" data-tab="grammar" onclick="switchTab('grammar')">GR</div>
    <div class="nav-item" data-tab="checklist" onclick="switchTab('checklist')">清单</div>
  </div>

  <!-- 隐藏的文件输入 -->
  <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageUpload(event)">
  <input type="file" id="checklistCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleChecklistPhoto(event)" oncancel="handleChecklistPhotoCancel()">
  <input type="file" id="importFile" style="display:none;" accept=".json" onchange="importData(event)">

  <!-- 选中单词浮动工具条 -->
  <div class="sel-bar" id="selBar" onmousedown="event.preventDefault()">
    <button onclick="lookupWord()">查询</button>
    <button onclick="speak(selWord,2)">美音</button>
    <button onclick="speak(selWord,1)">英音</button>
  </div>

  <!-- 清单拍照主题弹窗：完成事项必须拍照 -->
  <div class="modal" id="photoModal" onclick="if(event.target===this)closePhotoTaskDialog()">
    <div class="modal-content" style="max-height:none;">
      <div class="modal-header"><span id="photoModalTitle">拍照记录</span></div>
      <div class="modal-body" id="photoModalBody">完成清单事项前必须拍照记录。</div>
      <div class="modal-footer">
        <button class="btn-outline" onclick="closePhotoTaskDialog()">取消</button>
        <button class="btn-primary" onclick="takeChecklistPhoto()">拍照</button>
      </div>
    </div>
  </div>

  <div class="photo-preview-overlay" id="photoPreviewModal" style="display:none;" onclick="closePhotoPreview()">
    <button type="button" class="photo-preview-close" onclick="closePhotoPreview()" aria-label="关闭">×</button>
    <img id="photoPreviewImage" alt="清单照片放大预览" onclick="event.stopPropagation()">
  </div>

  <!-- 卡片详情：整张卡片横向滑动 -->
  <div class="modal card-modal" id="cardModal" onclick="onCardModalClick(event)">
    <div class="card-track" id="cardTrack"></div>
  </div>

  <!-- 信息弹窗（预览、AI 分析、查词） -->
  <div class="modal" id="infoModal" onclick="if(event.target===this)closeInfoModal()">
    <div class="modal-content">
      <div class="modal-header" id="infoHeader">
        <span id="infoTitle">分析</span>
        <div class="modal-head-actions">
          <button class="modal-icon-action" id="infoFavorite" type="button" title="全部收藏" aria-label="全部收藏" onclick="savePendingCards('modal')" style="display:none;">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
          </button>
        </div>
      </div>
      <div class="modal-body" id="infoBody"></div>
      <div class="modal-footer">
        <button class="btn-outline" id="infoSpeak" style="display:none;" onclick="speak(this.dataset.w,2)">发音</button>
        <button class="btn-outline" id="infoAdd" style="display:none;" onclick="addLookupWord()">加入卡片</button>
      </div>
    </div>

  <div class="app-dialog" id="appDialog" role="dialog" aria-modal="true" aria-labelledby="appDialogTitle">
    <div class="app-dialog-card">
      <div class="app-dialog-title" id="appDialogTitle">确认操作</div>
      <div class="app-dialog-message" id="appDialogMessage"></div>
      <div class="app-dialog-actions">
        <button type="button" class="app-dialog-cancel" onclick="resolveAppDialog(false)">取消</button>
        <button type="button" class="app-dialog-confirm" onclick="resolveAppDialog(true)">确定</button>
      </div>
    </div>
  </div>
  <div class="app-toast" id="appToast" role="status" aria-live="polite"></div>
</div>

<script>
/* =========================================================
   基础工具
========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const escRe = s => String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const nowStr = () => new Date().toLocaleString('zh-CN',
  {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
const WEEK_MS = 7 * 24 * 60 * 60 * 1000;

function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function safeSet(key, val){
  try { localStorage.setItem(key, val); return true; }
  catch(e){ return false; }
}

/* =========================================================
   状态
========================================================= */
let words      = load('wm_words', []);
let checklist  = load('wm_checklist', []);
let stats      = load('wm_stats', {apiCalls:0, tokens:0});
let attendance = load('wm_attendance', {});
let sleepRecords = load('wm_sleep_records', []);
let workStart  = localStorage.getItem('wm_work_start') || '09:00';
let apiKey     = localStorage.getItem('wm_api_key') || '';
let batchRunning = false;
let pendingPhotoTask = null;
let cardGroups = load('wm_card_groups', []);
let previews = {inline: [], modal: []};
let batchDeleteMode = false;
let batchClassifyMode = false;
let selectedCardIds = new Set();
let appDialogAction = null;
let toastTimer = null;
let deferredInstallPrompt = null;

const CARD_CATEGORIES = ['单词','语法','其它'];
const DEFAULT_GROUPS = [
  {id:'default-word', category:'单词', name:'默认单词', limit:0, isDefault:true},
  {id:'default-grammar', category:'语法', name:'默认语法', limit:0, isDefault:true},
  {id:'default-other', category:'其它', name:'默认其它', limit:0, isDefault:true}
];

/* =========================================================
   初始化 / Tab 切换
========================================================= */
function init(){
  $('apiKeyInput').value = apiKey;
  ensureCardGroups(); cleanupPhotos(); archiveExpiredCards(); renderGrammarTopics();
  renderCards(); renderGroupManager(); renderChecklist(); renderRestUI(); renderSleepUI(); updateStatsUI();
  renderRecognitionStatus('粘贴内容后，点击放大镜进行 AI 识别');
  setInterval(() => { if ($('tab-checklist').classList.contains('active')) { renderRestUI(); renderSleepUI(); } }, 1000);
  setInterval(() => { archiveExpiredCards(); if ($('tab-cards').classList.contains('active')) renderCards(); }, 60000);
  $('batchInput').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); triggerSearch(); }
  });
  $('batchInput').addEventListener('input', () => {
    if (previews.inline.length) {
      previews.inline = [];
      $('recognitionPreview').innerHTML = '<div class="empty-hint">内容已修改，请重新点击放大镜识别</div>';
      renderRecognitionStatus('输入内容已修改，需要重新识别');
    }
  });
}

function switchTab(tabId){
  document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  const panel = $('tab-' + tabId); if (!panel) return;
  panel.classList.add('active');
  document.querySelectorAll('.nav-item').forEach(el => { if (el.dataset.tab === tabId) el.classList.add('active'); });
  if (tabId === 'cards') { archiveExpiredCards(); renderCards(); renderGroupManager(); }
  if (tabId === 'grammar') renderGrammarTopics();
  if (tabId === 'checklist') { cleanupPhotos(); renderChecklist(); renderRestUI(); renderSleepUI(); updateStatsUI(); }
}

function showToast(message){
  const el = $('appToast'); if (!el) return;
  el.textContent = message; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2300);
}
function showAppDialog(title, message, action){
  appDialogAction = typeof action === 'function' ? action : null;
  $('appDialogTitle').textContent = title || '确认操作';
  $('appDialogMessage').textContent = message || '';
  $('appDialog').classList.add('active');
}
function resolveAppDialog(confirmed){
  $('appDialog').classList.remove('active');
  const action = appDialogAction; appDialogAction = null;
  if (confirmed && action) action();
}

/* =========================================================
   通用 API 调用
========================================================= */
async function callAI(messages){
  if (!apiKey) throw new Error('请先在“设置与统计”中填写 DeepSeek API Key');
  let timeout;
  try{
    /* 不使用 AbortSignal：部分 WebView / 预览环境无法克隆 signal；超时改用 Promise.race */
    const timeoutPromise = new Promise((_, reject) => { timeout = setTimeout(() => reject(Object.assign(new Error('timeout'), {name:'AbortError'})), 90000); });
    const request = (async () => {
      const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method:'POST', headers:{'Content-Type':'application/json','Authorization':'Bearer ' + apiKey},
        body:JSON.stringify({model:'deepseek-chat', messages, temperature:0.25, max_tokens:4096})
      });
      return {response, text: await response.text()};
    })();
    const {response, text} = await Promise.race([request, timeoutPromise]);
    let data;
    try{ data = text ? JSON.parse(text) : null; }catch(e){ throw new Error(`API 返回的不是有效 JSON（HTTP ${response.status}）`); }
    if (!response.ok){ const msg = data && data.error && data.error.message; throw new Error(msg || `API 请求失败（HTTP ${response.status}）`); }
    if (!data || !Array.isArray(data.choices) || !data.choices.length){ const msg = data && data.error && data.error.message; throw new Error(msg || 'API 没有返回 choices，请检查 Key、额度或模型权限'); }
    let content = data.choices[0].message && data.choices[0].message.content;
    if (Array.isArray(content)) content = content.map(x => x.text || '').join('');
    if (typeof content !== 'string' || !content.trim()) throw new Error('AI 返回内容为空，请重新识别');
    stats.apiCalls++; stats.tokens += Math.round(JSON.stringify(messages).length / 2) + 300; saveStats();
    return content.trim();
  }catch(e){
    if (e && e.name === 'AbortError') throw new Error('AI 请求超过 90 秒仍未完成，请检查网络后重试');
    if (e instanceof TypeError) throw new Error('网络连接失败，无法访问 DeepSeek API');
    throw e;
  }finally{ clearTimeout(timeout); }
}

/* =========================================================
   图片识别：OCR 文字回填输入框
========================================================= */
let tessLoading = null;
function loadTesseract(){
  if (window.Tesseract) return Promise.resolve();
  if (tessLoading) return tessLoading;
  tessLoading = new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = resolve;
    s.onerror = () => { tessLoading = null; reject(new Error('OCR 组件加载失败，请检查网络')); };
    document.head.appendChild(s);
  });
  return tessLoading;
}
async function ocrImage(dataUrl, onProgress){
  await loadTesseract();
  const r = await Tesseract.recognize(dataUrl, 'eng', {
    logger: m => { if (m.status === 'recognizing text') onProgress(Math.round(m.progress * 100)); }
  });
  return (r && r.data && r.data.text) || '';
}
function compressImage(file, maxW = 800, quality = 0.7){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
    img.src = url;
  });
}
async function handleImageUpload(event){
  const file = event.target.files[0]; event.target.value = '';
  if (!file) return;
  if (!apiKey) { showToast('请先在清单底部的设置与统计中填写 API Key'); return; }
  if (batchRunning) { showToast('AI 正在处理，请稍候'); return; }
  batchRunning = true;
  renderRecognitionStatus('正在读取图片…', 'loading');
  try{
    const dataUrl = await compressImage(file, 1600, .85);
    const text = await ocrImage(dataUrl, p => renderRecognitionStatus(`图片文字识别中 ${p}%`, 'loading'));
    if (!text.trim()) throw new Error('未识别到文字');
    $('batchInput').value = text.trim(); previews.inline = [];
    $('recognitionPreview').innerHTML = '<div class="empty-hint">图片文字已读取，点击放大镜进行 AI 整理</div>';
    renderRecognitionStatus('图片文字已填入输入框，点击放大镜进行 AI 整理');
    $('batchInput').focus();
    showToast('图片文字已识别并填入');
  }catch(e){ renderRecognitionStatus(e.message || '图片识别失败', true); showToast(e.message || '图片识别失败'); }
  finally{ batchRunning = false; }
}

/* =========================================================
   发音
========================================================= */
let curAudio = null;
function stopSpeak(){
  if (curAudio) { try { curAudio.pause(); } catch(e){} curAudio = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}
function speak(word, type){ // type: 1 英音, 2 美音
  word = String(word || '').trim();
  if (!word) return;
  stopSpeak();
  let fell = false;
  const fallback = () => {
    if (fell) return; fell = true;
    if (!('speechSynthesis' in window)) { alert('发音失败：网络不可用且浏览器不支持语音'); return; }
    const u = new SpeechSynthesisUtterance(word);
    u.lang = type === 1 ? 'en-GB' : 'en-US'; u.rate = 0.9;
    speechSynthesis.speak(u);
  };
  const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=' + type);
  curAudio = a; a.onerror = fallback;
  const p = a.play();
  if (p && p.catch) p.catch(fallback);
}

let selWord = '';
let selTimer = null;
const hideSelBar = () => $('selBar').classList.remove('active');
function updateSelBar(){
  const sel = window.getSelection();
  if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelBar(); return; }
  const text = sel.toString().trim();
  const n = sel.anchorNode;
  const el = n && (n.nodeType === 1 ? n : n.parentElement);
  if (!el || !el.closest('#cardTrack, #infoBody, #recognitionPreview')) { hideSelBar(); return; }
  if (!/^[A-Za-z][A-Za-z\s'’-]{0,38}$/.test(text)) { hideSelBar(); return; }
  selWord = text.replace(/’/g, "'");
  const r = sel.getRangeAt(0).getBoundingClientRect();
  const bar = $('selBar');
  bar.classList.add('active');
  const bw = bar.offsetWidth, bh = bar.offsetHeight;
  const left = Math.max(8, Math.min(window.innerWidth - bw - 8, r.left + r.width / 2 - bw / 2));
  let top = r.bottom + 10;
  if (top + bh > window.innerHeight - 8) top = Math.max(8, r.top - bh - 10);
  bar.style.left = left + 'px'; bar.style.top = top + 'px';
}

/* =========================================================
   卡片内容渲染（预览 / 卡片 / 语法弹窗共用）
========================================================= */
function toText(v){
  if (v == null) return '';
  if (Array.isArray(v)) return v.map(toText).filter(Boolean).join('\n');
  if (typeof v === 'object') return Object.entries(v).map(([k, x]) => { const t = toText(x); return t ? `${k}：${t}` : ''; }).filter(Boolean).join('\n');
  return String(v).trim();
}
function plain(v){ return toText(v).replace(/\*\*/g, ''); }
function cardKeys(c){
  let k = c.keywords;
  if (typeof k === 'string') k = k.split(/[,，、;；\n]+/);
  return Array.isArray(k) ? k.map(x => String(x).trim()).filter(Boolean) : [];
}
/* 转义 → **关键词** 高亮；没有 ** 标记时退回到关键词表匹配 */
/* 按换行与句末标点（。！？ . ! ?）切句，每句一段；数字序号（1.）不单独成段 */
function splitSentences(t){
  const out = [];
  t.split(/\n+/).forEach(line => {
    line = line.trim(); if (!line) return;
    const parts = line.match(/(?:[^。！？.!?]|[.!?](?=[^\s])(?![。！？]))+(?:[。！？]+|[.!?]+(?=\s|$))?|[。！？]+/g) || [line];
    let buf = '';
    parts.forEach(p => {
      buf += p;
      if (/^\s*(?:\(?\d+|[A-Za-z])[.)、]\s*$/.test(buf)) return;
      if (buf.trim()) out.push(buf.trim());
      buf = '';
    });
    if (buf.trim()) out.push(buf.trim());
  });
  return out;
}
function rich(v, keys){
  const t = toText(v); if (!t) return '';
  const hasMarks = /\*\*[^*]+\*\*/.test(t);
  const ks = hasMarks ? [] : (keys || []).filter(k => k && String(k).length > 1).sort((a, b) => b.length - a.length);
  const re = ks.length ? new RegExp('(' + ks.map(k => escRe(esc(k))).join('|') + ')', 'gi') : null;
  return splitSentences(t).map(s => {
    let h = esc(s);
    if (hasMarks) h = h.replace(/\*\*([^*]+?)\*\*/g, '<mark class="hl">$1</mark>');
    else if (re) h = h.replace(re, '<mark class="hl">$1</mark>');
    return `<span class="para">${h.replace(/\*\*/g, '')}</span>`;
  }).join('');
}
function wordSizeClass(word){
  let w = 0;
  String(word).split('').forEach(ch => { w += /[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef]/.test(ch) ? 1.7 : 1; });
  return w <= 8 ? '' : w <= 16 ? 'w-m' : w <= 30 ? 'w-s' : 'w-xs';
}
/* 各类别内容顺序：语法 → 用法、易错点、相同/相似用法比较、例句、定义、结构 */
function cardSections(c){
  const cat = c.category || '单词';
  if (cat === '语法') return [
    ['用法', c.usage, 'emph', ''],
    ['易错点', c.pitfalls || c.notes, 'emph pit', ''],
    ['相同 / 相似用法比较', c.compare, 'emph cmp', ''],
    ['例句', c.example, '', 'en'],
    ['定义', c.definition || c.summary, 'def', ''],
    ['结构 / 公式', c.structure, 'def', 'en']
  ];
  if (cat === '其它') return [
    ['知识概要', c.summary || c.definition, '', ''],
    ['用法', c.usage, '', ''],
    ['结构', c.structure, '', 'en'],
    ['例句', c.example, '', 'en'],
    ['注意事项', c.notes || c.pitfalls, 'pit', ''],
    ['比较', c.compare, 'cmp', '']
  ];
  return [
    ['柯林斯释义', c.collins, '', 'en'],
    ['中文释义', c.cn, '', ''],
    ['例句', c.example, '', 'en'],
    ['同义词', c.syn, '', ''],
    ['反义词', c.ant, '', ''],
    ['用法', c.usage, '', ''],
    ['注意事项', c.notes, 'pit', '']
  ];
}
function renderSections(c){
  const cat = c.category || '单词';
  return cardSections(c).filter(s => toText(s[1])).map(([label, value, secCls, bodyCls]) => {
    const keys = cat === '单词' ? (label === '例句' ? [c.word] : []) : cardKeys(c);
    return `<div class="sec ${secCls}"><div class="sec-label">${esc(label)}</div><div class="sec-body ${bodyCls}">${rich(value, keys)}</div></div>`;
  }).join('');
}
function renderCardHeader(c, lead){
  const cat = c.category || '单词';
  return `<div class="card-header"><div>
    <div class="word-big ${wordSizeClass(c.word)}">${esc(c.word)}</div>
    ${c.phonetic ? `<div class="word-phonetic">${esc(toText(c.phonetic))}</div>` : ''}
    ${c.syllable ? `<div class="word-syllable">${esc(toText(c.syllable))}</div>` : ''}
    ${cat === '单词' ? `<div class="pron-row"><button class="pron-btn" type="button" data-word="${esc(c.word)}" onclick="speak(this.dataset.word,2)">美音</button><button class="pron-btn" type="button" data-word="${esc(c.word)}" onclick="speak(this.dataset.word,1)">英音</button></div>` : ''}
  </div><div class="hd-right">${lead || ''}<span class="cat-chip">${esc(cat)}</span></div></div>`;
}
function groupOptionsHtml(current, excludingId){
  return CARD_CATEGORIES.map(cat => {
    const list = cardGroups.filter(g => g.category === cat).map(g => {
      const full = g.limit > 0 && !groupHasRoom(g.id, excludingId);
      const cnt = g.limit ? `${countInGroup(g.id)}/${g.limit}` : `${countInGroup(g.id)} 张`;
      return `<option value="${esc(g.id)}" ${g.id === current ? 'selected' : ''} ${full && g.id !== current ? 'disabled' : ''}>${esc(g.name)} · ${cnt}${full ? ' · 已满' : ''}</option>`;
    }).join('');
    return list ? `<optgroup label="${cat}">${list}</optgroup>` : '';
  }).join('');
}

/* =========================================================
   分组数据
========================================================= */
function persistGroups(){ safeSet('wm_card_groups', JSON.stringify(cardGroups)); }
function inferCardCreatedAt(card){
  if (Number.isFinite(Number(card.createdAt)) && Number(card.createdAt) > 0) return Number(card.createdAt);
  const raw = String(card.time || '');
  let m = raw.match(/(20\d{2})[/.年-](\d{1,2})[/.月-](\d{1,2})(?:日)?\s*(\d{1,2}):(\d{2})/);
  if (m) return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]), Number(m[4]), Number(m[5])).getTime();
  m = raw.match(/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{2})/);
  if (m){
    const now = new Date(); let year = now.getFullYear();
    let d = new Date(year, Number(m[1])-1, Number(m[2]), Number(m[3]), Number(m[4]));
    if (d.getTime() > Date.now() + 24*60*60*1000) d = new Date(year-1, Number(m[1])-1, Number(m[2]), Number(m[3]), Number(m[4]));
    return d.getTime();
  }
  return Date.now();
}
function isArchivedCard(card){ return !!card.archived; }
function archiveExpiredCards(){
  const cutoff = Date.now() - WEEK_MS; let changed = false;
  words.forEach(card => {
    if (!Number.isFinite(Number(card.createdAt)) || Number(card.createdAt) <= 0) { card.createdAt = inferCardCreatedAt(card); changed = true; }
    if (!card.archived && Number(card.createdAt) < cutoff) { card.archived = true; card.archivedAt = Date.now(); changed = true; }
  });
  if (changed) safeSet('wm_words', JSON.stringify(words));
}
function defaultGroupId(category){
  return category === '语法' ? 'default-grammar' : category === '其它' ? 'default-other' : 'default-word';
}
function ensureCardGroups(){
  if (!Array.isArray(cardGroups)) cardGroups = [];
  DEFAULT_GROUPS.forEach(g => { if (!cardGroups.some(x => x.id === g.id)) cardGroups.unshift({...g}); });
  words.forEach(w => {
    if (!w.category || !CARD_CATEGORIES.includes(w.category)) w.category = '单词';
    if (!w.groupId || !cardGroups.some(g => g.id === w.groupId)) w.groupId = defaultGroupId(w.category);
    if (!Number.isFinite(Number(w.createdAt)) || Number(w.createdAt) <= 0) w.createdAt = inferCardCreatedAt(w);
    if (typeof w.archived !== 'boolean') w.archived = false;
  });
  persistGroups();
  safeSet('wm_words', JSON.stringify(words));
}
function getCardGroup(id){ return cardGroups.find(g => g.id === id); }
function groupsFor(category){ return cardGroups.filter(g => g.category === category); }
function countInGroup(id){ return words.filter(w => !w.archived && (w.groupId || defaultGroupId(w.category || '单词')) === id).length; }
function groupHasRoom(id, excludingId){
  const g = getCardGroup(id);
  if (!g || !g.limit || g.limit <= 0) return true;
  const count = words.filter(w => !w.archived && (w.groupId || defaultGroupId(w.category || '单词')) === id && w.id !== excludingId).length;
  return count < g.limit;
}
function createCardGroup(){
  const category = $('groupCategory').value;
  const name = $('groupName').value.trim();
  const limit = Math.max(0, Number($('groupLimit').value || 0));
  if (!name) { showToast('请填写分组名称'); return; }
  if (cardGroups.some(g => g.category === category && g.name.toLowerCase() === name.toLowerCase())) { showToast('该类别已存在同名分组'); return; }
  cardGroups.push({id:'g-' + Date.now() + '-' + Math.floor(Math.random() * 1000), category, name, limit, isDefault:false});
  persistGroups(); $('groupName').value = ''; $('groupLimit').value = ''; renderGroupManager(); renderCards(); showToast('分组已创建');
}
function removeCardGroup(id){
  const g = getCardGroup(id); if (!g || g.isDefault) return;
  const fallback = defaultGroupId(g.category);
  words.forEach(w => { if (w.groupId === id) w.groupId = fallback; });
  cardGroups = cardGroups.filter(x => x.id !== id);
  persistGroups(); safeSet('wm_words', JSON.stringify(words)); renderGroupManager(); renderCards(); showToast('分组已删除，卡片已移至默认分组');
}
function renderGroupManager(){
  const host = $('groupManagerList'); if (!host) return;
  host.innerHTML = cardGroups.map(g => `<div class="group-manager-row"><strong>${esc(g.category)} · ${esc(g.name)}</strong><span class="group-meta">${countInGroup(g.id)}${g.limit ? '/' + g.limit : ''}</span>${g.isDefault ? '<span class="group-meta">默认</span>' : `<button class="group-remove" type="button" onclick="removeCardGroup('${esc(g.id)}')">删除</button>`}</div>`).join('');
}

function parseAIJson(raw){
  const cleaned = String(raw || '').replace(/^\uFEFF/, '').replace(/```(?:json)?/gi, '').replace(/```/g, '').trim();
  if (!cleaned) throw new Error('AI 返回内容为空，请重新识别');
  const parse = s => { try { return JSON.parse(s); } catch(e){ return null; } };
  let obj = parse(cleaned);
  if (!obj) { const a = (cleaned.match(/\[[\s\S]*\]/) || [])[0], o = (cleaned.match(/\{[\s\S]*\}/) || [])[0]; obj = (a && parse(a)) || (o && parse(o)); }
  if (Array.isArray(obj)) return obj;
  if (obj && typeof obj === 'object'){
    const nested = obj.cards || obj.items || obj.results || obj.data || obj.words;
    if (Array.isArray(nested)) return nested;
    if (obj.word || obj.title || obj.topic) return [obj];
  }
  throw new Error('AI 返回格式无法解析，请再次点击搜索');
}
function normalizeCardData(data, fallback){
  const d = {...data}; d.word = toText(d.word || d.title || d.topic);
  if (!d.word) throw new Error('AI 返回了没有标题的内容，请重新识别');
  let cat = String(d.category || fallback || '单词').trim(); if (cat === '其他') cat = '其它';
  d.category = CARD_CATEGORIES.includes(cat) ? cat : (fallback || '单词');
  const g = d.groupId ? getCardGroup(d.groupId) : null;
  if (!g || g.category !== d.category) d.groupId = defaultGroupId(d.category);
  return d;
}
async function analyzeInput(){
  const input = $('batchInput').value.trim();
  if (!input) { showToast('请先粘贴或输入学习内容'); renderRecognitionStatus('没有输入内容', true); return; }
  if (batchRunning) { showToast('AI 正在处理，请勿重复点击'); return; }
  if (!apiKey) { renderRecognitionStatus('请先在清单底部设置 DeepSeek API Key', true); showToast('请先填写 API Key'); return; }
  batchRunning = true; previews.inline = [];
  $('recognitionPreview').innerHTML = '<div class="empty-hint">正在分析内容，请稍候…</div>';
  renderRecognitionStatus('正在调用 AI，整理单词、语法及其它知识点', 'loading');
  try{
    ensureCardGroups();
    const prompt = `你是一名专业英语词汇、语法与学习卡片整理助手。请从用户材料提取独立学习知识点。
规则：
1. 最多20条，去重排序；即使只有一条，也返回含一条对象的 JSON 数组。
2. 每条含 word 标题、category 类别。category 只允许“单词”“语法”“其它”：单词和短语选“单词”；语法规则、句型、时态、从句等选“语法”；其他选“其它”。
3. 单词字段：phonetic、syllable、collins（英文释义）、cn（中文释义）、example（英文例句+中文翻译）、syn、ant。
4. 语法字段（重点是实用）：usage（主要用法，分点）、pitfalls（易错点，错误→正确）、compare（相同/相似用法比较）、example（英文例句+中文翻译，每句一行）、definition（定义）、structure（结构/公式）。
5. 其它字段：summary、usage、notes、example。
6. 所有字段值必须是字符串（多条内容用换行分隔），没有内容用空字符串；关键用法、关键词、例句中的关键结构用 **双星号** 包裹，便于高亮。
7. 只返回合法 JSON 数组，不要 Markdown 或说明。
示例：[{"word":"abandon","category":"单词","phonetic":"","syllable":"","collins":"to leave behind","cn":"放弃","example":"","syn":"","ant":""}]
材料：
${input.slice(0, 9000)}`;
    const raw = await callAI([{role:'user', content:prompt}]);
    const parsed = parseAIJson(raw), items = Array.isArray(parsed) ? parsed : [parsed];
    previews.inline = items.filter(x => x && typeof x === 'object').slice(0, 20).map(x => normalizeCardData(x, '单词'));
    if (!previews.inline.length) throw new Error('没有识别到可创建的内容，请补充英文单词或学习材料');
    refreshPreview('inline');
    renderRecognitionStatus(`识别完成 · 共 ${previews.inline.length} 项，选择分组后点击收藏`, 'done');
  }catch(e){
    previews.inline = []; $('recognitionPreview').innerHTML = '<div class="empty-hint">本次没有生成预览，请检查输入后重试</div>';
    renderRecognitionStatus(e.message || 'AI 识别失败，请重试', true); showToast(e.message || 'AI 识别失败');
  }finally{ batchRunning = false; }
}
function renderRecognitionStatus(message, state){
  const dot = $('recognizeDot'), title = $('recognizeTitle'), detail = $('recognizeMessage'); if (!dot || !title || !detail) return;
  dot.className = 'recognize-dot' + (state === 'loading' ? ' loading' : state === true ? ' fail' : state === 'done' ? ' done' : '');
  title.textContent = state === 'loading' ? 'AI 识别中' : state === true ? '识别未完成' : state === 'done' ? '识别完成' : '识别状态';
  detail.textContent = message || '';
}

/* ---- 预览与收藏 ---- */
function isSaved(card){
  return words.some(w => String(w.word).toLowerCase() === String(card.word).toLowerCase() && (w.category || '单词') === card.category);
}
function renderPreviewList(ctx){
  ensureCardGroups();
  return previews[ctx].map((card, i) => {
    const saved = isSaved(card);
    const star = ctx === 'modal' ? `<button type="button" class="pv-star ${saved ? 'on' : ''}" ${saved ? 'disabled' : ''} title="${saved ? '已收藏' : '收藏'}" aria-label="收藏" onclick="savePreviewCard('modal',${i})"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg></button>` : '';
    return `<div class="preview-card rd">
      ${renderCardHeader(card, star)}
      <div class="card-body">${renderSections(card) || '<div class="sec-body" style="color:#9aa5a0">AI 未返回详细内容</div>'}</div>
      <div class="preview-group-row">
        <label for="pg-${ctx}-${i}">收藏到</label>
        <select class="preview-group-select" id="pg-${ctx}-${i}" ${saved ? 'disabled' : ''} onchange="setPreviewGroup('${ctx}',${i},this.value)">${groupOptionsHtml(card.groupId)}</select>
        ${saved ? '<span class="pv-saved">✓ 已收藏</span>' : `<button type="button" class="pv-fav" onclick="savePreviewCard('${ctx}',${i})">收藏</button>`}
      </div>
    </div>`;
  }).join('');
}
function refreshPreview(ctx){
  const host = ctx === 'modal' ? $('infoBody') : $('recognitionPreview');
  const top = host.scrollTop;
  host.innerHTML = renderPreviewList(ctx);
  host.scrollTop = top;
  if (ctx === 'modal'){
    const fav = $('infoFavorite');
    const all = previews.modal.every(isSaved);
    fav.disabled = all; fav.style.opacity = all ? '.4' : '1';
  }
}
function showGeneratedPreview(title, cards){
  previews.modal = cards;
  $('infoTitle').textContent = title; $('infoModal').classList.add('preview-mode'); /* 预览隐藏头部与底部，整块空间留给内容 */
  $('infoBody').classList.add('rd');
  $('infoFavorite').style.display = 'none';
  $('infoSpeak').style.display = 'none'; $('infoAdd').style.display = 'none';
  $('infoModal').classList.add('active');
  refreshPreview('modal'); $('infoBody').scrollTop = 0;
}
function setPreviewGroup(ctx, i, gid){
  const card = previews[ctx][i], g = getCardGroup(gid); if (!card || !g) return;
  card.groupId = gid; card.category = g.category;
  refreshPreview(ctx);
}
function saveWord(data){
  data = normalizeCardData(data, data.category || '单词');
  if (isSaved(data)) return 'dup';
  const g = getCardGroup(data.groupId);
  if (!g || g.category !== data.category) return 'bad';
  if (!groupHasRoom(data.groupId)) return 'full';
  data.id = Date.now() + Math.floor(Math.random() * 100000);
  data.time = nowStr();
  data.createdAt = Date.now();
  data.archived = false;
  words.push(data);
  safeSet('wm_words', JSON.stringify(words));
  return 'ok';
}
function afterSave(ctx){
  renderCards(); renderGroupManager(); updateStatsUI(); refreshPreview(ctx);
  if (ctx === 'inline'){
    const n = previews.inline.filter(isSaved).length;
    renderRecognitionStatus(`已收藏 ${n} / ${previews.inline.length} 项`, 'done');
  }
}
function savePreviewCard(ctx, i){
  const card = previews[ctx][i]; if (!card) return;
  const r = saveWord({...card});
  showToast({ok:'已收藏', dup:'该卡片已存在', full:'该分组已满，请更换分组', bad:'分组无效，请重新选择'}[r]);
  afterSave(ctx);
}
function savePendingCards(ctx){
  const list = previews[ctx] || [];
  if (!list.length) { showToast('没有待收藏的识别结果'); return; }
  const c = {ok:0, dup:0, full:0, bad:0};
  list.forEach(card => { if (!isSaved(card)) c[saveWord({...card})]++; });
  afterSave(ctx);
  const parts = [];
  if (c.ok) parts.push(`已收藏 ${c.ok} 张`);
  if (c.full) parts.push(`${c.full} 张因分组已满未保存`);
  if (c.bad) parts.push(`${c.bad} 张分组无效`);
  showToast(parts.length ? parts.join('，') : '所有内容都已收藏');
}

async function generateGrammarTopic(topic){
  if (batchRunning) { showToast('AI 正在处理，请稍候'); return; }
  if (!apiKey) { showToast('请先在清单底部的设置与统计中填写 API Key'); return; }
  batchRunning = true;
  $('infoModal').classList.remove('preview-mode'); $('infoTitle').style.display = ''; $('infoTitle').textContent = topic;
  $('infoBody').classList.add('rd');
  $('infoBody').innerHTML = '<div style="text-align:center;padding:26px;color:#87958d;font-size:16px;">AI 正在整理语法知识…</div>';
  $('infoFavorite').style.display = 'none'; $('infoSpeak').style.display = 'none'; $('infoAdd').style.display = 'none';
  $('infoModal').classList.add('active');
  try{
    const prompt = `请用中文为英语学习者讲解英语语法知识点“${topic}”。内容务必准确、实用、结构清楚，按重要性依次给出：
1. usage（主要用法）：分点列出，每点先写规则再给简短说明。
2. pitfalls（易错点）：分点列出，写出“错误 → 正确”及原因。
3. compare（相同 / 相似用法比较）：与易混淆的用法逐项对比，格式如“A vs B：区别……”。
4. example（例句）：至少 4 个英文例句，每句附中文翻译，每句占一行。
5. definition（定义）：一两句话概括。
6. structure（结构 / 公式）：给出核心结构或公式。
7. keywords：关键词数组形式的字符串，用逗号分隔。
所有字段的值必须是字符串（多条内容用换行分隔），不要使用嵌套对象或数组。正文中的关键用法、关键词、关键结构用 **双星号** 包裹以便高亮。
以 JSON 对象输出，字段为 word（标题，使用“${topic}”）、category（固定为“语法”）、usage、pitfalls、compare、example、definition、structure、keywords。只输出 JSON，不要 Markdown 代码围栏。`;
    const raw = await callAI([{role:'user', content:prompt}]);
    let parsed;
    try{ parsed = parseAIJson(raw)[0]; }
    catch(err){ parsed = {usage: raw}; }   // 解析失败时保留原文，保证内容可见
    const card = normalizeCardData({...parsed, word: toText(parsed.word) || topic, category:'语法'}, '语法');
    showGeneratedPreview(`语法预览 · ${topic}`, [card]);
  }catch(e){
    $('infoTitle').textContent = `${topic} · 生成失败`;
    $('infoBody').innerHTML = `<div style="color:#c45b56;font-size:16px;">${esc(e.message || 'AI 生成失败')}</div>`;
    $('infoFavorite').style.display = 'none';
  }finally{ batchRunning = false; }
}

function cardDirectoryEntry(w){
  const id = Number(w.id), checked = selectedCardIds.has(id) ? 'checked' : '';
  const selecting = batchDeleteMode || batchClassifyMode;
  const check = selecting ? `<input class="card-select" type="checkbox" ${checked} aria-label="选择 ${esc(w.word)}" onclick="event.stopPropagation()" onchange="toggleCardSelection(${id},this.checked)">` : '';
  const arrow = selecting ? '' : '<div class="card-directory-arrow">›</div>';
  const desc = plain(w.cn || w.summary || w.definition || w.usage || w.collins || w.example).replace(/\n/g, ' ') || '点击查看卡片内容';
  return `<div class="card-directory-item ${selecting ? 'select-mode' : ''}" role="button" tabindex="0" onclick="handleCardDirectoryClick(${id})" onkeydown="if(event.key==='Enter')handleCardDirectoryClick(${id})">${check}<div class="card-directory-main"><div class="card-directory-word">${esc(w.word)}</div><div class="card-directory-desc">${esc(desc)}</div></div>${arrow}</div>`;
}
function renderCards(){
  const container = $('cardsContainer'); if (!container) return;
  ensureCardGroups(); archiveExpiredCards();
  selectedCardIds = new Set([...selectedCardIds].filter(id => words.some(w => Number(w.id) === Number(id))));
  const active = words.filter(w => !w.archived);
  const history = words.filter(w => w.archived);
  const activeHtml = CARD_CATEGORIES.map(category => {
    const categoryCards = active.filter(w => (w.category || '单词') === category);
    if (!categoryCards.length) return '';
    const groupHtml = groupsFor(category).map(group => {
      const entries = categoryCards.filter(w => (w.groupId || defaultGroupId(category)) === group.id).slice().reverse();
      if (!entries.length) return '';
      return `<div class="card-group"><div class="card-group-head">${esc(group.name)} <span class="card-count">${entries.length}${group.limit ? '/' + group.limit : ''}</span></div>${entries.map(cardDirectoryEntry).join('')}</div>`;
    }).join('');
    return `<section class="card-category"><div class="card-category-head">${category}<span>${categoryCards.length} 张</span></div>${groupHtml}</section>`;
  }).join('');
  const historyHtml = `<details class="history-section"><summary>历史卡片 · ${history.length} 张（保存超过 7 天）</summary>${history.length ? CARD_CATEGORIES.map(category => {
    const entries = history.filter(w => (w.category || '单词') === category).slice().reverse();
    return entries.length ? `<section class="history-category"><div class="history-category-title">${category} · ${entries.length} 张</div>${entries.map(cardDirectoryEntry).join('')}</section>` : '';
  }).join('') : '<div class="history-empty">暂无历史卡片。卡片保存满 7 天后会自动归档。</div>'}</details>`;
  container.innerHTML = (activeHtml || '<div class="empty-state" style="margin-top:32px;">暂无进行中的卡片</div>') + historyHtml;
  updateBulkDeleteUI();
}
function handleCardDirectoryClick(id){ if (batchDeleteMode || batchClassifyMode) toggleCardSelection(id, !selectedCardIds.has(Number(id))); else openCardDetail(id); }
function cancelBatchMode(){ batchDeleteMode = false; batchClassifyMode = false; selectedCardIds.clear(); renderCards(); }
function toggleBatchDeleteMode(force){
  batchDeleteMode = typeof force === 'boolean' ? force : !batchDeleteMode;
  batchClassifyMode = false; selectedCardIds.clear(); renderCards();
}
function toggleBatchClassifyMode(force){
  batchClassifyMode = typeof force === 'boolean' ? force : !batchClassifyMode;
  batchDeleteMode = false; selectedCardIds.clear();
  if (batchClassifyMode) renderBulkGroupOptions();
  renderCards();
}
function toggleCardSelection(id, checked){ id = Number(id); if (checked) selectedCardIds.add(id); else selectedCardIds.delete(id); updateBulkDeleteUI(); }
function selectAllCards(){ selectedCardIds = new Set(words.map(w => Number(w.id))); renderCards(); }
function renderBulkGroupOptions(){

  }).join('');
  select.innerHTML = opts || '<option value="">暂无可用分组</option>';
}
function updateBulkDeleteUI(){
  const actions = $('bulkModeActions'), entries = $('bulkEntryButtons'), count = $('bulkSelectedCount');
  const del = $('bulkDeleteButton'), classify = $('bulkClassifyControls'), apply = $('bulkApplyButton');
  if (!actions) return;
  const selecting = batchDeleteMode || batchClassifyMode;
  actions.style.display = selecting ? 'flex' : 'none';
  if (entries) entries.style.display = selecting ? 'none' : 'flex';
  if (count) count.textContent = `已选 ${selectedCardIds.size} 张`;
  if (del) { del.style.display = batchDeleteMode ? '' : 'none'; del.disabled = selectedCardIds.size === 0; }
  if (classify) classify.style.display = batchClassifyMode ? 'flex' : 'none';
  if (apply) apply.disabled = !selectedCardIds.size || !$('bulkGroup') || !$('bulkGroup').value;
}
function applyBatchClassification(){
  if (!selectedCardIds.size) { showToast('请先选择卡片'); return; }
  const groupId = $('bulkGroup').value, group = getCardGroup(groupId);
  if (!group) { showToast('请选择有效分组'); return; }
  const selected = words.filter(w => selectedCardIds.has(Number(w.id)));
  const movingActive = selected.filter(w => !w.archived);
  const currentCount = countInGroup(groupId);
  const available = group.limit > 0 ? Math.max(0, group.limit - currentCount + movingActive.filter(w => w.groupId === groupId).length) : Infinity;
  if (movingActive.filter(w => w.groupId !== groupId).length > available) { showToast('目标分组容量不足，请先调整数量上限'); return; }
  const movingIds = new Set(selected.map(w => Number(w.id)));
  const existingNames = new Set(words.filter(w => !movingIds.has(Number(w.id))).map(w => `${group.category}|${String(w.word).toLowerCase()}`));
  let changed = 0, duplicates = 0;
  selected.forEach(w => {
    const key = `${group.category}|${String(w.word).toLowerCase()}`;
    if (existingNames.has(key)) { duplicates++; return; }
    w.category = group.category; w.groupId = groupId; existingNames.add(key); changed++;
  });
  safeSet('wm_words', JSON.stringify(words)); selectedCardIds.clear(); batchDeleteMode = false; batchClassifyMode = false;
  renderCards(); renderGroupManager(); updateStatsUI();
  showToast(`已分类 ${changed} 张${duplicates ? `，${duplicates} 张因目标类别重名未调整` : ''}`);
}
function requestDeleteSelectedCards(){
  const ids = new Set([...selectedCardIds].map(Number).filter(id => words.some(w => Number(w.id) === id)));
  if (!ids.size) { showToast('请先选择要删除的卡片'); return; }
  showAppDialog('删除卡片', `确定删除选中的 ${ids.size} 张卡片吗？此操作无法撤销。`, () => {
    const count = ids.size; words = words.filter(w => !ids.has(Number(w.id)));
    safeSet('wm_words', JSON.stringify(words)); selectedCardIds.clear(); batchDeleteMode = false; batchClassifyMode = false;
    renderCards(); renderGroupManager(); updateStatsUI(); showToast(`已批量删除 ${count} 张卡片`);
  });
}

function openCardDetail(id){

/* =========================================================
   休息记录
========================================================= */
const dayKey = (d = new Date()) =>
  d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const fmtHM = ts => ts ? new Date(ts).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', hour12:false}) : '--:--';
const fmtDur = min => {
  min = Math.max(0, Math.round(min));
  const h = Math.floor(min / 60), m = min % 60;
  return h ? `${h}小时${m}分` : `${m}分钟`;
};
const openBreak = rec => {
  const l = rec && rec.breaks && rec.breaks[rec.breaks.length - 1];
  return l && !l.e ? l : null;
};
function saveAtt(){ if (!safeSet('wm_attendance', JSON.stringify(attendance))) showToast('本地存储空间不足，建议导出备份'); }
function breakTotals(rec, now){
  let n = 0, ms = 0, max = 0;
  (rec.breaks || []).forEach(b => { const d = Math.max(0, (b.e || now) - b.s); n++; ms += d; if (d > max) max = d; });
  return {n, ms, max};
}
function getTodayAttendance(){
  const key = dayKey();
  if (!attendance[key]) attendance[key] = {in:null, out:null, sched:null, late:0, breaks:[]};
  if (!Array.isArray(attendance[key].breaks)) attendance[key].breaks = [];
  return attendance[key];
}
function toggleBreak(){
  const rec = getTodayAttendance(); const active = openBreak(rec);
  if (active) active.e = Date.now(); else rec.breaks.push({s: Date.now()});
  saveAtt(); renderRestUI();
}
function renderRestUI(){
  const status = $('restStatus'); if (!status) return;
  const rec = attendance[dayKey()];
  const now = Date.now(); const breaks = rec && Array.isArray(rec.breaks) ? rec.breaks : [];
  const active = rec ? openBreak(rec) : null;
  let totalMs = 0;
  breaks.forEach(b => { totalMs += Math.max(0, (b.e || now) - b.s); });
  $('restSummary').textContent = `今日 ${breaks.length} 次 · 共 ${fmtDur(totalMs / 60000)}`;
  if (active){
    status.textContent = `正在休息 · 已 ${fmtDur((now - active.s) / 60000)}`;
    $('restButton').textContent = '结束休息'; $('restButton').classList.add('running');
  } else {
    status.textContent = breaks.length ? `最近一次 ${fmtHM(breaks[breaks.length - 1].e || breaks[breaks.length - 1].s)}` : '今天还没有休息记录';
    $('restButton').textContent = '开始休息'; $('restButton').classList.remove('running');
  }
  $('restHistory').textContent = breaks.length ? breaks.map((b, i) => `${i + 1}. ${fmtHM(b.s)} – ${b.e ? fmtHM(b.e) : '进行中'}（${fmtDur(((b.e || now) - b.s) / 60000)}）`).join('　') : '开始休息后，将自动记录每次休息的时间与时长。';
}
function buildAttendanceLines(){
  const keys = Object.keys(attendance).sort().slice(-30); const now = Date.now();
  return keys.map(k => { const rec = attendance[k]; const bt = breakTotals(rec, rec.out || now); return `${k}：休息 ${bt.n} 次，共 ${Math.round(bt.ms / 60000)} 分钟`; });
}
async function analyzeWork(){
  const lines = buildAttendanceLines();
  const restLines = lines.filter(x => !x.endsWith('休息 0 次，共 0 分钟'));
  if (!restLines.length){ showInfo('AI 休息分析', '目前还没有有效休息记录。'); return; }
  showInfo('AI 休息习惯分析', '<div style="text-align:center;padding:20px;color:#888;">正在分析…</div>');
  if (!apiKey){
    const total = Object.keys(attendance).reduce((sum, k) => sum + breakTotals(attendance[k], attendance[k].out || Date.now()).ms, 0);
    showInfo('休息习惯分析', `<p>已记录 ${restLines.length} 天的休息数据。</p><p>累计休息 ${fmtDur(total / 60000)}。</p><p style="color:#999;font-size:12px;">未配置 API Key，以上为本地统计。</p>`); return;
  }
  try{
    const res = await callAI([{role:'user', content:`以下是最近的休息记录：\n${restLines.join('\n')}\n请分析休息频率、时长与规律，并给出简短可执行建议。中文输出，控制在 150 字以内。`}]);
    showInfo('AI 休息习惯分析', esc(res).replace(/\n/g, '<br>'));
