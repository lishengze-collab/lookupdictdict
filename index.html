/* 卡片分组管理 */
function createCardGroup(){
  const category = $('groupCategory').value;
  const name = $('groupName').value.trim();
  const limit = Math.max(0, Number($('groupLimit').value || 0));
  if (!name) { showToast('请填写分组名称'); return; }
  if (cardGroups.some(g => g.category === category && g.name.toLowerCase() === name.toLowerCase())) { showToast('该类别已存在同名分组'); return; }
  cardGroups.push({id:'g-' + Date.now() + '-' + Math.floor(Math.random()*1000),category,name,limit,isDefault:false});
  persistGroups(); $('groupName').value=''; $('groupLimit').value=''; renderGroupManager(); renderCards(); showToast('分组已创建');
}
function removeCardGroup(id){
  const g = getCardGroup(id); if (!g || g.isDefault) return;
  const fallback = defaultGroupId(g.category);
  words.forEach(w => { if (w.groupId === id) w.groupId = fallback; });
  cardGroups = cardGroups.filter(x => x.id !== id);
  persistGroups(); safeSet('wm_words',JSON.stringify(words)); renderGroupManager(); renderCards(); showToast('分组已删除，卡片已移至默认分组');
}
function renderGroupManager(){
  const host = $('groupManagerList'); if (!host) return;
  host.innerHTML = cardGroups.map(g => `<div class="group-manager-row"><strong>${esc(g.category)} · ${esc(g.name)}</strong><span class="group-meta">${countInGroup(g.id)}${g.limit ? '/' + g.limit : ''}</span>${g.isDefault ? '<span class="group-meta">默认</span>' : `<button class="group-remove" type="button" onclick="removeCardGroup('${esc(g.id)}')">删除</button>`}</div>`).join('');
}
function saveWord(data){
  data = normalizeCardData(data, data.category || '单词');
  if (words.find(w => String(w.word).toLowerCase() === String(data.word).toLowerCase() && (w.category || '单词') === data.category)) return false;
  const targetGroup = getCardGroup(data.groupId);
  if (!targetGroup || targetGroup.category !== data.category) { showToast('卡片保存位置无效，请重新选择收藏分组'); return false; }
  if (!groupHasRoom(data.groupId)) { showToast(`“${targetGroup.name}”已达到数量上限`); return false; }
  data.id = Date.now() + Math.floor(Math.random() * 1000);
  data.time = nowStr();
  words.push(data);
  safeSet('wm_words', JSON.stringify(words));
  renderCards();
  return true;
}
function renderCards(){
  const container=$('cardsContainer'); if(!container)return;
  ensureCardGroups();
  selectedCardIds=new Set([...selectedCardIds].filter(id=>words.some(w=>Number(w.id)===Number(id))));
  if(!words.length){container.innerHTML='<div class="empty-state" style="margin-top:48px;">暂无卡片，去录入或语法中生成内容吧</div>';updateBulkDeleteUI();return;}
  container.innerHTML=CARD_CATEGORIES.map(category=>{
    const categoryCards=words.filter(w=>(w.category||'单词')===category);
    if(!categoryCards.length)return '';
    const groupHtml=groupsFor(category).map(group=>{
      const entries=categoryCards.filter(w=>(w.groupId||defaultGroupId(category))===group.id).slice().reverse();
      if(!entries.length)return '';
      return `<div class="card-group"><div class="card-group-head">${esc(group.name)} <span class="card-count">${entries.length}${group.limit?'/'+group.limit:''}</span></div>${entries.map(w=>{
        const id=Number(w.id),checked=selectedCardIds.has(id)?'checked':'';
        const check=batchDeleteMode?`<input class="card-select" type="checkbox" ${checked} aria-label="选择 ${esc(w.word)}" onclick="event.stopPropagation()" onchange="toggleCardSelection(${id},this.checked)">`:'';
        const arrow=batchDeleteMode?'':'<div class="card-directory-arrow">›</div>';
        return `<div class="card-directory-item ${batchDeleteMode?'select-mode':''}" role="button" tabindex="0" onclick="handleCardDirectoryClick(${id})" onkeydown="if(event.key==='Enter')handleCardDirectoryClick(${id})">${check}<div class="card-directory-main"><div class="card-directory-word">${esc(w.word)}</div><div class="card-directory-desc">${esc(w.cn||w.summary||w.collins||w.example||'点击查看卡片内容')}</div></div>${arrow}</div>`;
      }).join('')}</div>`;
    }).join('');
    return `<section class="card-category"><div class="card-category-head">${category}<span>${categoryCards.length} 张</span></div>${groupHtml}</section>`;
  }).join('');
  updateBulkDeleteUI();
}
function handleCardDirectoryClick(id){if(batchDeleteMode)toggleCardSelection(id,!selectedCardIds.has(Number(id)));else openCardDetail(id);}
function toggleBatchDeleteMode(force){batchDeleteMode=typeof force==='boolean'?force:!batchDeleteMode;selectedCardIds.clear();renderCards();}
function toggleCardSelection(id,checked){id=Number(id);if(checked)selectedCardIds.add(id);else selectedCardIds.delete(id);updateBulkDeleteUI();}
function selectAllCards(){selectedCardIds=new Set(words.map(w=>Number(w.id)));renderCards();}
function updateBulkDeleteUI(){
  const actions=$('bulkModeActions'),trigger=$('bulkModeButton'),count=$('bulkSelectedCount'),del=$('bulkDeleteButton');
  if(!actions||!trigger)return;
  trigger.style.display=batchDeleteMode?'none':'';
  actions.style.display=batchDeleteMode?'flex':'none';
  if(count)count.textContent=`已选 ${selectedCardIds.size} 张`;
  if(del)del.disabled=selectedCardIds.size===0;
}
function requestDeleteSelectedCards(){
  const ids=new Set([...selectedCardIds].map(Number).filter(id=>words.some(w=>Number(w.id)===Number(id))));
  if(!ids.size){showToast('请先选择要删除的卡片');return;}
  const count=ids.size;words=words.filter(w=>!ids.has(Number(w.id)));
  safeSet('wm_words',JSON.stringify(words));selectedCardIds.clear();batchDeleteMode=false;
  renderCards();renderGroupManager();updateStatsUI();showToast(`已批量删除 ${count} 张卡片`);
}
function cardDetailHtml(card){
  const category=card.category||'单词',current=card.groupId||defaultGroupId(category);
  const opts=CARD_CATEGORIES.map(cat=>{
    const list=cardGroups.filter(g=>g.category===cat).map(g=>`<option value="${esc(g.id)}" ${g.id===current?'selected':''}>${esc(g.category)} · ${esc(g.name)}${g.limit?` · ${countInGroup(g.id)}/${g.limit}`:''}</option>`).join('');
    return `<optgroup label="${cat}">${list}</optgroup>`;
  }).join('');
  const fields=[['柯林斯释义',card.collins,'en'],['中文释义',card.cn,''],['例句',card.example,'en'],['同义词',card.syn,''],['反义词',card.ant,''],['知识概要',card.summary,''],['结构',card.structure,'en'],['用法',card.usage,''],['注意事项',card.notes,'']].filter(x=>x[1]);
  return `<div class="card-detail-content" data-card-id="${Number(card.id)}">
    <div class="card-header"><div><div class="word-big">${esc(card.word)}</div>${card.phonetic?`<div class="word-phonetic">${esc(card.phonetic)}</div>`:''}${card.syllable?`<div class="word-syllable">${esc(card.syllable)}</div>`:''}${category==='单词'?`<div class="pron-row"><button class="pron-btn" data-word="${esc(card.word)}" onclick="speak(this.dataset.word,2)">美音</button><button class="pron-btn" data-word="${esc(card.word)}" onclick="speak(this.dataset.word,1)">英音</button></div>`:''}</div></div>
    <div class="card-body">${fields.map(([label,value,lang])=>`<div class="sec"><div class="sec-label">${esc(label)}</div><div class="sec-body ${lang}">${esc(value)}</div></div>`).join('')}</div>
    <div class="card-detail-group"><span>分类分组</span><select aria-label="更改卡片分组" onchange="changeCardGroup(${Number(card.id)},this.value)">${opts}</select></div>
    <div class="card-footer">${esc(card.time||'')}</div>
  </div>`;
}
function cardsInSameGroup(card){
  const gid=card.groupId||defaultGroupId(card.category||'单词');
  return words.filter(w=>(w.groupId||defaultGroupId(w.category||'单词'))===gid).slice().reverse();
}
function openCardDetail(id){
  const card=words.find(w=>Number(w.id)===Number(id));if(!card)return;
  currentModalCardId=Number(id);cardSwipeAnimating=false;const body=$('infoBody');
  body.classList.remove('card-detail-mode');body.classList.add('card-detail-mode');
  body.style.transition='';body.style.transform='';body.style.opacity='';body.innerHTML=cardDetailHtml(card);body.scrollTop=0;
  $('infoTitle').textContent=card.word;$('infoModal').classList.add('active');
  $('infoFavorite').style.display='none';$('infoSpeak').style.display='none';$('infoAdd').style.display='none';
}
function navigateCardInGroup(direction){
  if(currentModalCardId==null||cardSwipeAnimating)return;
  const current=words.find(w=>Number(w.id)===Number(currentModalCardId));if(!current)return;
  const list=cardsInSameGroup(current),idx=list.findIndex(w=>Number(w.id)===Number(current.id)),next=list[idx+direction];
  if(!next){showToast(direction>0?'已到本分组最后一张':'已到本分组第一张');return;}
  cardSwipeAnimating=true;const body=$('infoBody');
  body.style.transition='transform .16s ease,opacity .16s ease';body.style.transform=`translateX(${direction>0?-42:42}px)`;body.style.opacity='0';
  setTimeout(()=>{
    currentModalCardId=Number(next.id);$('infoTitle').textContent=next.word;
    body.innerHTML=cardDetailHtml(next);body.scrollTop=0;body.style.transition='none';body.style.transform=`translateX(${direction>0?42:-42}px)`;
    requestAnimationFrame(()=>{body.style.transition='transform .19s ease,opacity .19s ease';body.style.transform='translateX(0)';body.style.opacity='1';});
    setTimeout(()=>{body.style.transition='';body.style.transform='';body.style.opacity='';cardSwipeAnimating=false;},205);
  },165);
}
function changeCardGroup(id,newGroupId){
  const card=words.find(w=>Number(w.id)===Number(id)),group=getCardGroup(newGroupId);if(!card||!group)return;
  if(!groupHasRoom(newGroupId,id)){showToast('目标分组已达到数量上限');return;}
  if(words.some(w=>Number(w.id)!==Number(id)&&(w.category||'单词')===group.category&&String(w.word).toLowerCase()===String(card.word).toLowerCase())){showToast('目标类别中已有同名卡片');return;}
  card.category=group.category;card.groupId=newGroupId;safeSet('wm_words',JSON.stringify(words));
  renderCards();renderGroupManager();openCardDetail(id);showToast('卡片分组已更新');
}
function cancelCardGesture(){cardGesture=null;}
function onCardTouchStart(e){
  if(currentModalCardId==null||cardSwipeAnimating||!$('infoModal').classList.contains('active'))return;
  const blocked=e.target&&e.target.closest?e.target.closest('button,select,input,textarea,a'):null;if(blocked)return;
  const t=e.touches&&e.touches[0];if(!t)return;cardGesture={startX:t.clientX,startY:t.clientY,horizontal:false};
}
function onCardTouchMove(e){
  if(!cardGesture||!e.touches||!e.touches.length)return;
  const t=e.touches[0],dx=t.clientX-cardGesture.startX,dy=t.clientY-cardGesture.startY;
  if(Math.abs(dx)>30&&Math.abs(dx)>Math.abs(dy)*1.2){cardGesture.horizontal=true;if(e.cancelable)e.preventDefault();}
}
function onCardTouchEnd(e){
  if(!cardGesture)return;const g=cardGesture,t=e.changedTouches&&e.changedTouches[0];cardGesture=null;
  if(!t||!g.horizontal)return;const dx=t.clientX-g.startX;if(Math.abs(dx)>48)navigateCardInGroup(dx<0?1:-1);
}
/* 通用信息弹窗，兼容原有单词查询/清单分析 */
function showInfo(title,html,word){
  $('infoBody').classList.remove('card-detail-mode');
  $('infoBody').style.transition='';$('infoBody').style.transform='';$('infoBody').style.opacity='';cardSwipeAnimating=false;
  $('infoTitle').innerText = title;
  $('infoBody').innerHTML = html;
  $('infoModal').classList.add('active');
  $('infoFavorite').style.display = 'none';
  const sp = $('infoSpeak'), ad = $('infoAdd');
  sp.style.display = ad.style.display = word ? '' : 'none';
  sp.dataset.w = ad.dataset.w = word || '';
  if (word && ad.dataset.state !== 'busy') { ad.innerText = '加入卡片'; ad.disabled = false; }
}
function closeInfoModal(){
  $('infoModal').classList.remove('active');
  $('infoBody').classList.remove('card-detail-mode');
  $('infoBody').style.transition='';$('infoBody').style.transform='';$('infoBody').style.opacity='';
  currentModalCardId=null;cardSwipeAnimating=false;
  $('infoFavorite').style.display = 'none';
  stopSpeak();
}

/* 删除卡片完全使用自定义 UI；保留原生 confirm 只用于其他既有操作 */
function updateStatsUI(){
  if ($('stat-api-calls')) $('stat-api-calls').innerText = stats.apiCalls || 0;
  if ($('stat-tokens')) $('stat-tokens').innerText = stats.tokens || 0;
  if ($('stat-words')) $('stat-words').innerText = words.length;
  if ($('stat-checks')) $('stat-checks').innerText = checklist.length;
}

/* 休息记录独立于上下班打卡，可单独开始/结束并持续保存 */
function getTodayAttendance(){
  const key = dayKey();
  if (!attendance[key]) attendance[key] = {in:null,out:null,sched:null,late:0,breaks:[]};
  if (!Array.isArray(attendance[key].breaks)) attendance[key].breaks = [];
  return attendance[key];
}
function toggleBreak(){
  const rec = getTodayAttendance(); const active = openBreak(rec);
  if (active) active.e = Date.now(); else rec.breaks.push({s:Date.now()});
  saveAtt(); renderRestUI();
}
function renderRestUI(){
  const status = $('restStatus'); if (!status) return;
  const rec = attendance[dayKey()];
  const now = Date.now(); const breaks = rec && Array.isArray(rec.breaks) ? rec.breaks : [];
  const active = rec ? openBreak(rec) : null;
  let totalMs = 0;
  breaks.forEach(b => { totalMs += Math.max(0,(b.e || now) - b.s); });
  const mins = Math.floor(totalMs / 60000);
  $('restSummary').textContent = `今日 ${breaks.length} 次 · 共 ${fmtDur(totalMs/60000)}`;
  if (active){
    status.textContent = `正在休息 · 已 ${fmtDur((now-active.s)/60000)}`;
    $('restButton').textContent = '结束休息'; $('restButton').classList.add('running');
  } else {
    status.textContent = breaks.length ? `最近一次 ${fmtHM(breaks[breaks.length-1].e || breaks[breaks.length-1].s)}` : '今天还没有休息记录';
    $('restButton').textContent = '开始休息'; $('restButton').classList.remove('running');
  }
  $('restHistory').textContent = breaks.length ? breaks.map((b,i) => `${i+1}. ${fmtHM(b.s)} – ${b.e ? fmtHM(b.e) : '进行中'}（${fmtDur(((b.e || now)-b.s)/60000)}）`).join('　') : '开始休息后，将自动记录每次休息的时间与时长。';
}
function tick(){renderRestUI();}
function buildAttendanceLines(){
  const keys = Object.keys(attendance).sort().slice(-30); const now = Date.now();
  return keys.map(k => { const rec=attendance[k]; const bt=breakTotals(rec,rec.out||now); return `${k}：休息 ${bt.n} 次，共 ${Math.round(bt.ms/60000)} 分钟`; });
}
async function analyzeWork(){
  const lines = buildAttendanceLines();
  const restLines = lines.filter(x => !x.endsWith('休息 0 次，共 0 分钟'));
  if (!restLines.length){ showInfo('AI 休息分析','目前还没有有效休息记录。'); return; }
  showInfo('AI 休息习惯分析','<div style="text-align:center;padding:20px;color:#888;">正在分析…</div>');
  if (!apiKey){
    const total = Object.keys(attendance).reduce((sum,k)=>sum+breakTotals(attendance[k],attendance[k].out||Date.now()).ms,0);
    showInfo('休息习惯分析',`<p>已记录 ${restLines.length} 天的休息数据。</p><p>累计休息 ${fmtDur(total/60000)}。</p><p style="color:#999;font-size:12px;">未配置 API Key，以上为本地统计。</p>`); return;
  }
  try{
    const res = await callAI([{role:'user',content:`以下是最近的休息记录：\n${restLines.join('\n')}\n请分析休息频率、时长与规律，并给出简短可执行建议。中文输出，控制在 150 字以内。`}]);
    showInfo('AI 休息习惯分析',esc(res).replace(/\n/g,'<br>'));
  }catch(e){ showInfo('AI 休息习惯分析',`<span style="color:red;">分析失败：${esc(e.message)}</span>`); }
}

  deferredInstallPrompt = event;
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;

if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}

/* 导入导出兼容新分组字段；原有数据保持可恢复 */
function exportData(){
  const data = {words,checklist,stats,attendance,workStart,cardGroups,exportTime:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url = URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=`word_memory_backup_${Date.now()}.json`; a.click(); URL.revokeObjectURL(url);
}
function importData(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const data=JSON.parse(e.target.result);
      if(data.words && data.checklist){
        words=Array.isArray(data.words)?data.words:[]; checklist=Array.isArray(data.checklist)?data.checklist:[];
        stats=data.stats||{apiCalls:0,tokens:0}; if(data.attendance) attendance=data.attendance;
        if(data.workStart) workStart=data.workStart;
        cardGroups=Array.isArray(data.cardGroups)?data.cardGroups:cardGroups;
        ensureCardGroups(); safeSet('wm_checklist',JSON.stringify(checklist)); safeSet('wm_stats',JSON.stringify(stats)); safeSet('wm_attendance',JSON.stringify(attendance));
        renderCards();renderGroupManager();renderChecklist();renderRestUI();updateStatsUI();
        showToast('数据恢复成功');
      }else showToast('文件格式不正确');
    }catch(err){showToast('读取文件失败');}
  };
  reader.readAsText(file); event.target.value='';
}
