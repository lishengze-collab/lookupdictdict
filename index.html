<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DICTIONARY">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="./manifest.webmanifest?v=4">
<link rel="icon" type="image/svg+xml" href="./icon.svg?v=4">
<link rel="apple-touch-icon" sizes="192x192" href="./dict-icon-192.png?v=4">
<title>DICTIONARY · 单词记忆助手</title>
<style>
:root{
  --primary:#2c5e4f;
  --primary-dark:#1f4a3d;
  --primary-soft:#e8f0ed;
  --primary-light:#f2f7f5;
  --bg-color:#f5f7f6;
  --card:#ffffff;
  --text-main:#1f2523;
  --text-sub:#5c6662;
  --text-muted:#9aa5a0;
  --line:#e8edeb;
  --white:#ffffff;
  --red:#d93b3b;
  --amber:#d98a1f;
  --amber-soft:#fdf3e1;
  --green:#2f9e6a;
  --radius:18px;
  --shadow:0 2px 12px rgba(31,74,61,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
  background-color:var(--bg-color);color:var(--text-main);
  display:flex;justify-content:center;height:100vh;height:100dvh;overflow:hidden;
}
button{font-family:inherit;}
#app{
  width:100%;max-width:480px;background-color:var(--bg-color);
  position:relative;height:100%;display:flex;flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.06);
}
.header{
  padding:calc(18px + env(safe-area-inset-top)) 20px 12px;font-size:20px;font-weight:700;
  color:var(--primary);text-align:center;letter-spacing:2px;
  background:rgba(245,247,246,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
}
.content{flex:1;overflow-y:auto;padding:4px 18px 110px 18px;display:none;-webkit-overflow-scrolling:touch;}
.content.active{display:block;}

/* ============ 搜索框 ============ */
.search-container{position:relative;display:flex;align-items:center;margin-bottom:14px;}
.search-box{
  width:100%;padding:15px 52px 15px 52px;border-radius:30px;border:1px solid var(--line);
  background-color:var(--white);font-size:15px;outline:none;transition:border-color .2s,box-shadow .2s;
  box-shadow:var(--shadow);color:var(--text-main);
}
.search-box:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(44,94,79,.12);}
.icon-add{
  position:absolute;left:6px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--primary);background:var(--primary-soft);height:40px;width:40px;border-radius:50%;
}
.icon-add:active{background:#d9e6e1;}
.icon-search{
  position:absolute;right:6px;display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:#fff;background:var(--primary);height:40px;width:40px;border-radius:50%;
}
.icon-search:active{background:var(--primary-dark);}

/* ============ 粘贴区 ============ */
.paste-box{
  width:100%;height:120px;padding:14px 16px;border-radius:16px;
  border:1px dashed #c9d8d2;background:var(--white);
  font-size:14px;line-height:1.6;resize:none;overflow-y:auto;outline:none;
  font-family:inherit;color:var(--text-main);transition:border-color .2s;
}
.paste-box:focus{border-color:var(--primary);border-style:solid;}
.paste-box::placeholder{color:#a8b5af;}
.btn-row{display:flex;gap:10px;margin-top:12px;}
.btn-primary{
  flex:1;padding:14px;background:var(--primary);color:#fff;border:none;
  border-radius:14px;font-size:16px;font-weight:600;cursor:pointer;
  box-shadow:0 4px 12px rgba(44,94,79,.22);transition:transform .1s,background .2s;
}
.btn-primary:active{transform:scale(.98);background:var(--primary-dark);}
.btn-primary:disabled{opacity:.5;box-shadow:none;}
.btn-outline{
  padding:14px 20px;background:var(--white);color:var(--primary);
  border:1px solid var(--primary);border-radius:14px;font-size:15px;cursor:pointer;
}
.btn-outline:active{background:var(--primary-light);}
.section-label{
  font-size:12px;color:var(--text-muted);letter-spacing:1.5px;
  margin:26px 0 10px 2px;font-weight:700;
}

/* ============ 识别状态 ============ */
.empty-hint{font-size:13px;color:#b5bfba;text-align:center;padding:24px 0;}
.status-item{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  font-size:13px;background:var(--white);border-radius:14px;margin-bottom:8px;
  box-shadow:var(--shadow);animation:fadeIn .3s ease;
}
.status-item .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:#ccc;}
.status-item .dot.loading{background:var(--primary);animation:pulse 1s infinite;}
.status-item .dot.done{background:#3aab6d;}
.status-item .dot.fail{background:#e05555;}
.status-item .st-word{font-weight:600;color:var(--text-main);}
.status-item .st-msg{margin-left:auto;color:var(--text-muted);font-size:12px;text-align:right;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}

/* ============ 设置折叠 ============ */
.fold{margin-top:28px;background:var(--white);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);}
.fold summary{font-size:14px;color:var(--text-sub);cursor:pointer;outline:none;list-style:none;font-weight:600;}
.fold summary::-webkit-details-marker{display:none;}
.stats-box{background:var(--bg-color);padding:18px;border-radius:14px;margin:14px 0;}
.stats-row{display:flex;justify-content:space-between;margin-bottom:12px;font-size:14px;color:var(--text-sub);}
.stats-row:last-child{margin-bottom:0;}
.stats-val{font-weight:700;color:var(--primary);}
.setting-item{margin-bottom:14px;}
.setting-item label{display:block;font-size:13px;margin-bottom:8px;color:var(--text-muted);}
.setting-item input{
  width:100%;padding:14px;border:1px solid var(--line);background:var(--bg-color);
  border-radius:12px;font-size:15px;outline:none;
}
.setting-item input:focus{border-color:var(--primary);}

/* ============ 单词卡片 ============ */
.flashcard-container{
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:14px;
  padding:8px 0;height:calc(100vh - 170px);height:calc(100dvh - 170px);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
}
.flashcard-container::-webkit-scrollbar{display:none;}
.flashcard{
  flex:0 0 88%;scroll-snap-align:center;background:var(--white);
  border-radius:22px;padding:22px;display:flex;flex-direction:column;
  position:relative;box-shadow:0 4px 20px rgba(31,74,61,.08);
}
.card-header{
  display:flex;justify-content:space-between;align-items:flex-start;
  margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line);
}
.word-big{
  font-size:40px;font-weight:700;color:var(--red);
  letter-spacing:.5px;line-height:1.15;word-break:break-word;
}
.word-phonetic{font-size:16px;color:#777;margin-top:6px;}
.word-syllable{
  font-size:15px;color:var(--primary);margin-top:4px;
  letter-spacing:1.5px;font-weight:500;
}
.delete-btn{
  color:#e0605f;font-size:13px;background:none;border:none;
  cursor:pointer;flex-shrink:0;padding:4px 0 4px 8px;
}
.card-body{flex:1;overflow-y:auto;font-size:16px;line-height:1.65;color:#444;}
.sec{margin-bottom:16px;}
.sec:last-child{margin-bottom:0;}
.sec-label{
  font-size:12px;color:var(--primary);font-weight:700;letter-spacing:1.5px;
  margin-bottom:6px;display:inline-block;background:var(--primary-soft);
  padding:2px 9px;border-radius:20px;
}
.sec-body{font-size:16px;line-height:1.65;color:#333;white-space:pre-line;}
.sec-body.en{font-family:Georgia,"Times New Roman",serif;color:#3a3a3a;}
.card-footer{
  margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
  font-size:12px;color:var(--text-muted);text-align:center;
}
.empty-state{
  width:100%;text-align:center;color:var(--text-muted);
  margin-top:100px;font-size:15px;
}

/* ============ 清单 ============ */
.clock-card{
  background:linear-gradient(135deg,#2c5e4f,#3d7a66);color:#fff;
  border-radius:var(--radius);padding:20px;margin-bottom:14px;
  box-shadow:0 8px 24px rgba(44,94,79,.22);
}
.clock-time{font-size:38px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;}
.clock-date{font-size:13px;opacity:.85;margin-top:4px;}
.clock-log{font-size:12px;opacity:.92;margin-top:12px;line-height:1.7;}
.clock-actions{display:flex;gap:8px;margin-top:14px;}
.clock-actions button{
  flex:1;padding:10px 0;border-radius:12px;border:1px solid rgba(255,255,255,.4);
  background:rgba(255,255,255,.14);color:#fff;font-size:13px;cursor:pointer;
}
.clock-actions button:active{background:rgba(255,255,255,.28);}

/* ---- 上班打卡卡片 ---- */
.work-card{
  background:var(--white);border-radius:var(--radius);padding:18px;
  margin-bottom:18px;box-shadow:var(--shadow);
}
.w-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.w-title{font-size:16px;font-weight:700;color:var(--primary);letter-spacing:1px;}
.w-badge{
  font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;
  background:#eef1f0;color:var(--text-muted);
}
.w-badge.working{background:var(--primary-soft);color:var(--primary);}
.w-badge.break{background:var(--amber-soft);color:var(--amber);}
.w-badge.done{background:#e6f4ec;color:var(--green);}
.w-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.w-cell{background:var(--bg-color);border-radius:14px;padding:12px 8px;text-align:center;}
.w-cell .k{font-size:10px;color:var(--text-muted);letter-spacing:1px;font-weight:700;}
.w-cell .v{font-size:19px;font-weight:700;color:var(--text-main);margin-top:6px;font-variant-numeric:tabular-nums;}
.w-cell .v.sm{font-size:15px;line-height:1.4;padding-top:2px;}
.w-cell .v.late{color:var(--red);}
.w-cell .v.ok{color:var(--green);}
.w-bar{height:8px;background:#e9efec;border-radius:8px;margin-top:16px;overflow:hidden;}
.w-bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3d7a66,#2c5e4f);border-radius:8px;transition:width .6s;}
.w-bar.over > i{background:linear-gradient(90deg,#e8a23a,#d98a1f);}
.w-remain{font-size:12px;color:var(--text-sub);margin-top:8px;text-align:center;}
.w-actions{display:flex;gap:10px;margin-top:14px;}
.w-btn{
  flex:1;padding:13px 0;border-radius:14px;border:none;font-size:15px;font-weight:600;
  cursor:pointer;transition:transform .1s,opacity .2s;
}
.w-btn:active{transform:scale(.98);}
.w-btn:disabled{opacity:.4;}
.w-btn.in{background:var(--primary);color:#fff;box-shadow:0 4px 12px rgba(44,94,79,.22);}
.w-btn.out{background:var(--white);color:var(--primary);border:1px solid var(--primary);}
.w-btn.brk{background:var(--amber-soft);color:var(--amber);width:100%;flex:none;margin-top:10px;display:block;}
.w-btn.brk.running{background:var(--amber);color:#fff;}
.w-stat{
  margin-top:14px;padding:12px 14px;background:var(--bg-color);border-radius:14px;
  font-size:13px;color:var(--text-sub);line-height:1.8;
}
.w-stat b{color:var(--text-main);font-weight:600;}
.w-set{display:flex;align-items:center;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--text-sub);}
.w-set input{
  border:1px solid var(--line);background:var(--bg-color);border-radius:10px;
  padding:8px 10px;font-size:14px;color:var(--text-main);outline:none;font-family:inherit;
}
.w-ai{
  width:100%;margin-top:12px;padding:12px;border-radius:14px;font-size:14px;cursor:pointer;
  background:var(--white);color:var(--primary);border:1px solid var(--primary);font-weight:600;
}
.w-ai:active{background:var(--primary-light);}
.w-reset{display:block;margin:10px auto 0;font-size:12px;color:var(--text-muted);background:none;border:none;cursor:pointer;}

.check-item{
  display:flex;align-items:flex-start;gap:12px;padding:14px;
  background:var(--white);border-radius:16px;margin-bottom:10px;
  box-shadow:var(--shadow);animation:fadeIn .25s ease;
}
.check-box{
  width:24px;height:24px;border-radius:50%;border:2px solid #ccd6d1;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  margin-top:1px;cursor:pointer;transition:all .2s;
}
.check-box.done{background:var(--primary);border-color:var(--primary);color:#fff;}
.check-box svg{opacity:0;transition:opacity .2s;}
.check-box.done svg{opacity:1;}
.check-main{flex:1;min-width:0;}
.check-text{font-size:15px;line-height:1.5;color:var(--text-main);word-break:break-word;}
.check-text.done{color:#b3b3b3;text-decoration:line-through;}
.check-photo{
  width:58px;height:58px;object-fit:cover;border-radius:10px;
  margin-top:8px;display:block;border:1px solid var(--line);
}
.check-meta{font-size:11px;color:#bbb;margin-top:4px;}

.add-check-row{display:flex;gap:10px;margin-bottom:14px;}
.add-check-row input{
  flex:1;min-width:0;padding:14px;border:1px solid var(--line);background:var(--white);
  border-radius:14px;font-size:15px;outline:none;
}
.add-check-row input:focus{border-color:var(--primary);}
.add-check-row button{
  padding:0 22px;border-radius:14px;border:none;background:var(--primary);
  color:#fff;font-size:15px;font-weight:600;cursor:pointer;
}
.check-toolbar{display:flex;gap:10px;margin-bottom:18px;}
.check-toolbar button{
  flex:1;padding:12px;border-radius:14px;font-size:14px;cursor:pointer;
  background:var(--white);color:var(--primary);border:1px solid var(--primary);
}
.check-toolbar button.ghost{color:#888;border-color:#ddd;}

/* ============ 发音 / 选词查询 ============ */
.pron-row{display:flex;gap:6px;margin-top:8px;}
.pron-btn{
  font-size:12px;padding:4px 12px;border-radius:20px;border:1px solid var(--primary);
  background:var(--white);color:var(--primary);cursor:pointer;
}
.pron-btn:active{background:var(--primary-soft);}
.sel-bar{
  position:fixed;z-index:200;display:none;background:var(--primary-dark);
  border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);overflow:hidden;
}
.sel-bar.active{display:flex;}
.sel-bar button{background:none;border:none;color:#fff;font-size:14px;padding:10px 16px;cursor:pointer;}
.sel-bar button + button{border-left:1px solid rgba(255,255,255,.2);}

/* ============ 底部导航 ============ */
.bottom-nav{
  position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  width:84%;height:58px;background:rgba(255,255,255,.94);
  backdrop-filter:blur(15px);-webkit-backdrop-filter:blur(15px);
  border-radius:29px;box-shadow:0 6px 24px rgba(31,74,61,.14);
  display:flex;justify-content:space-around;align-items:center;
  padding:5px;gap:4px;z-index:20;
}
.nav-item{
  color:var(--text-muted);font-size:15px;flex:1;text-align:center;
  height:100%;line-height:48px;cursor:pointer;transition:all .2s;border-radius:24px;
}
.nav-item.active{color:#fff;background:var(--primary);font-weight:600;}

/* ============ 弹窗 ============ */
.modal{
  display:none;position:absolute;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,.4);z-index:100;align-items:center;
  justify-content:center;padding:20px;
}
.modal.active{display:flex;}
.modal-content{
  background:#fff;width:100%;max-height:85vh;border-radius:22px;
  padding:24px;display:flex;flex-direction:column;animation:scaleIn .25s ease;
}
@keyframes scaleIn{from{opacity:0;transform:scale(.95);}to{opacity:1;transform:scale(1);}}
.modal-header{
  display:flex;justify-content:space-between;align-items:center;
  font-weight:700;font-size:18px;color:var(--primary);margin-bottom:15px;
}
.modal-body{
  flex:1;overflow-y:auto;font-size:15px;line-height:1.7;color:#333;
  margin-bottom:18px;
}
.modal-footer{display:flex;gap:10px;}
.modal-footer .btn-primary{flex:1;}
.modal-footer .btn-outline{flex:1;}


/* ============ 新版整体布局 ============ */
#app{padding-top:env(safe-area-inset-top);}
.header{display:none;}
.content{padding:14px 16px 110px;}
.content.active{display:block;}
#tab-input{padding:14px 16px 220px;}
#tab-cards{padding:12px 14px 100px;}
#tab-grammar{padding:14px 16px 100px;}
#tab-checklist{padding:14px 16px 110px;}
.input-dock{
  position:absolute;left:12px;right:12px;bottom:calc(82px + env(safe-area-inset-bottom));
  z-index:25;display:block;
}
.input-dock.hidden{display:none;}
.input-composer{background:rgba(255,255,255,.98);border:1px solid #e4ebe7;border-radius:20px;padding:8px 10px 7px;box-shadow:0 8px 28px rgba(31,74,61,.13);backdrop-filter:blur(16px);}
.paste-box{display:block;width:100%;height:98px;min-height:72px;padding:9px 9px 7px;border:0;border-radius:12px;background:transparent;font-size:15px;line-height:1.55;resize:vertical;box-shadow:none;}
.paste-box:focus{border:0;box-shadow:none;}
.work-toolbar{display:flex;align-items:center;justify-content:space-around;gap:8px;border-top:1px solid #edf1ef;padding:6px 2px 0;margin-top:3px;}
.tool-icon,.modal-icon-action{width:42px;height:38px;display:flex;align-items:center;justify-content:center;border:0;background:transparent;color:#718079;border-radius:12px;cursor:pointer;}
.tool-icon:active,.modal-icon-action:active{background:var(--primary-soft);color:var(--primary);}
.tool-icon.tool-search{background:var(--primary);color:#fff;width:48px;}
.tool-icon.tool-search:active{background:var(--primary-dark);}
.bottom-nav{left:10px;right:10px;transform:none;width:auto;height:58px;bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.94);border-radius:18px;box-shadow:0 4px 20px rgba(31,74,61,.10);padding:4px 8px;gap:4px;}
.nav-item{height:100%;line-height:50px;border-radius:0;background:transparent!important;color:#8d9993;font-size:14px;font-weight:500;}
.nav-item.active{color:var(--primary);font-weight:750;text-shadow:0 0 .01px currentColor;}
.section-label{margin-top:6px;}

/* ============ 语法目录 ============ */
.grammar-intro{padding:7px 2px 16px;}
.grammar-title{font-size:21px;font-weight:750;color:var(--primary);}
.grammar-subtitle{font-size:13px;color:var(--text-muted);line-height:1.6;margin-top:5px;}
.grammar-section{margin:0 0 16px;background:#fff;border-radius:17px;padding:15px 14px;box-shadow:var(--shadow);}
.grammar-section-title{font-size:15px;font-weight:750;color:var(--primary);margin-bottom:10px;}
.grammar-topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grammar-topic{display:flex;align-items:center;justify-content:space-between;gap:5px;text-align:left;border:1px solid #e8efeb;background:#f9fbfa;color:#34443d;border-radius:11px;padding:10px 9px;font-size:13px;line-height:1.35;min-height:42px;cursor:pointer;}
.grammar-topic:after{content:'›';font-size:18px;color:#9aaba2;}
.grammar-topic:active{background:var(--primary-soft);border-color:#cbdcd4;}

/* ============ 卡片目录与分组 ============ */
.group-manager{margin:0 0 16px;padding:14px 14px;border-radius:16px;}
.group-manager summary{color:var(--primary);}
.group-create-row{display:grid;grid-template-columns:78px minmax(0,1fr) 76px 54px;gap:6px;margin-top:13px;}
.group-create-row input,.group-create-row select{min-width:0;width:100%;padding:9px 7px;border:1px solid var(--line);border-radius:10px;background:#fbfcfb;color:var(--text-main);font:inherit;font-size:12px;outline:none;}
.group-create-row button{border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:12px;font-weight:650;}
.group-hint{font-size:11px;color:var(--text-muted);margin-top:8px;}
.group-manager-list{margin-top:8px;}
.group-manager-row{display:flex;align-items:center;gap:7px;padding:8px 0;border-top:1px solid #f0f3f1;font-size:12px;color:var(--text-sub);}
.group-manager-row strong{color:var(--text-main);font-weight:650;}
.group-manager-row .group-meta{margin-left:auto;color:var(--text-muted);white-space:nowrap;}
.group-remove{border:0;background:transparent;color:#bd7774;font-size:12px;padding:4px 2px;}
.card-directory-title{font-size:17px;font-weight:750;color:var(--text-main);margin:4px 2px 12px;}
.card-category{margin:0 0 16px;}

.card-group{margin:0 0 12px;}

.card-directory-item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:13px;padding:13px 13px;margin-bottom:7px;box-shadow:var(--shadow);cursor:pointer;min-height:56px;}

.card-detail-view{background:#fff;border-radius:16px;padding:5px 2px 9px;}

.card-detail-view .word-big{font-size:40px;}
.card-detail-view .word-phonetic{font-size:17px;}
.card-detail-view .word-syllable{font-size:16px;}
.card-detail-view .sec-label{font-size:13px;}
.card-detail-view .sec-body{font-size:17px;line-height:1.7;}
.card-detail-view .card-body{font-size:17px;line-height:1.7;}
.card-detail-view .card-footer{font-size:13px;}
.card-detail-group{display:flex;align-items:center;gap:8px;margin:12px 2px 6px;font-size:13px;color:var(--text-sub);}
.card-detail-group select,.preview-group-select{border:1px solid var(--line);border-radius:9px;background:#fbfcfb;padding:7px 9px;color:var(--text-main);font:inherit;font-size:12px;max-width:70%;}
.swipe-delete-hint{text-align:center;color:#a3ada7;font-size:11px;padding:12px 0 2px;}
.preview-card{border:1px solid #edf1ef;border-radius:14px;padding:13px;margin-bottom:11px;background:#fbfcfb;}
.preview-card-title{font-size:17px;font-weight:750;color:var(--primary);margin-bottom:8px;}
.preview-card .sec{margin-bottom:10px;}
.preview-card .sec-label{font-size:12px;}
.preview-card .sec-body{font-size:15px;line-height:1.6;}
.preview-group-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:9px;border-top:1px solid #edf1ef;font-size:12px;color:var(--text-muted);}

/* ============ 清单中的休息记录 ============ */
.rest-card{background:#fff;border-radius:18px;padding:17px;margin:18px 0;box-shadow:var(--shadow);}
.rest-head{display:flex;align-items:center;justify-content:space-between;}
.rest-title{font-size:16px;font-weight:750;color:var(--primary);}
.rest-sub{font-size:12px;color:var(--text-muted);margin-top:4px;}
.rest-icon{font-size:23px;}
.rest-summary{margin-top:13px;padding:12px;background:var(--bg-color);border-radius:12px;color:var(--text-sub);font-size:14px;font-weight:650;}
.rest-action{width:100%;margin-top:11px;padding:12px;border:0;border-radius:12px;background:var(--amber-soft);color:var(--amber);font-size:14px;font-weight:700;}
.rest-action.running{background:var(--amber);color:#fff;}
.rest-history{font-size:12px;color:var(--text-muted);line-height:1.8;margin-top:8px;}

/* ============ 弹窗、交互提示 ============ */
.modal{padding:16px;}
.modal-content{max-height:86vh;max-height:86dvh;padding:18px 17px 16px;border-radius:20px;min-height:180px;}
.modal-header{font-size:17px;margin-bottom:12px;flex-shrink:0;}
.modal-head-actions{display:flex;align-items:center;gap:5px;}
.modal-icon-action{width:36px;height:36px;color:var(--primary);}
.modal-close{border:0;background:transparent;color:#aab3ae;font-size:26px;line-height:1;padding:0 3px;}
.modal-body{min-height:0;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;font-size:16px;line-height:1.75;margin-bottom:12px;}
.modal-footer{flex-shrink:0;}
.delete-confirm{display:flex;align-items:center;gap:7px;padding:12px;background:#fff;border:1px solid #f0e1df;border-radius:15px;box-shadow:0 8px 28px rgba(31,40,35,.18);}
.delete-confirm-copy{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.delete-confirm-copy strong{font-size:13px;color:#513b39;}
.delete-confirm-copy span{font-size:10px;color:#9c8e8c;}
.delete-cancel,.delete-accept{border:0;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:650;}
.delete-cancel{background:#f2f4f3;color:#68736d;}
.delete-accept{background:#d95b56;color:#fff;}
.app-toast{position:absolute;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);z-index:350;max-width:88%;padding:10px 15px;background:rgba(31,45,39,.91);color:#fff;border-radius:12px;font-size:12px;line-height:1.4;opacity:0;pointer-events:none;transition:all .22s;white-space:normal;text-align:center;}
.app-toast.show{opacity:1;transform:translate(-50%,0);}
/* 收藏分组选择：必须手动选择，不预选默认分组 */
.group-picker-overlay{position:absolute;inset:0;z-index:420;display:flex;align-items:center;justify-content:center;padding:18px;background:rgba(22,31,27,.46);}
.group-picker-dialog{width:min(100%,430px);max-height:82%;display:flex;flex-direction:column;background:#fff;border-radius:21px;padding:17px;box-shadow:0 18px 55px rgba(0,0,0,.22);}
.group-picker-header{display:flex;align-items:center;justify-content:space-between;color:var(--primary);font-size:17px;font-weight:750;}
.group-picker-header button{border:0;background:none;color:#9ba59f;font-size:27px;line-height:1;padding:0 3px;}
.group-picker-desc{font-size:12px;line-height:1.55;color:var(--text-muted);margin:5px 0 12px;}
.group-picker-list{min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;}
.group-picker-item{padding:11px 0;border-top:1px solid #edf1ef;}
.group-picker-item strong{display:block;font-size:14px;color:#293630;margin-bottom:7px;}
.group-picker-item label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:5px;}
.group-picker-select{width:100%;padding:10px 11px;border:1px solid #dce6e0;border-radius:11px;background:#f9fbfa;color:var(--text-main);font:inherit;font-size:13px;outline:none;}
.group-picker-select:focus{border-color:var(--primary);}
.group-picker-actions{display:flex;gap:9px;padding-top:13px;flex-shrink:0;}
.group-picker-actions button{flex:1;}
/* 长按删除的居中提示与居中确认弹窗 */
.delete-hold-indicator{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:410;display:flex;flex-direction:column;align-items:center;gap:7px;width:min(78%,270px);padding:19px 16px;border-radius:19px;background:rgba(35,48,41,.94);color:#fff;box-shadow:0 12px 35px rgba(0,0,0,.24);pointer-events:none;text-align:center;}
.delete-hold-indicator strong{font-size:15px;}
.delete-hold-indicator>span{font-size:11px;color:rgba(255,255,255,.78);}
.delete-hold-ring{width:42px;height:42px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:750;}
.delete-confirm-overlay{position:absolute;inset:0;z-index:430;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(20,29,24,.48);}
.delete-confirm{width:min(100%,330px);display:flex;flex-direction:column;align-items:center;gap:10px;padding:23px 19px 18px;background:#fff;border:1px solid #f0e1df;border-radius:21px;box-shadow:0 16px 48px rgba(0,0,0,.24);text-align:center;}
.delete-confirm-symbol{width:39px;height:39px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:#fff0ef;color:#d95b56;font-size:22px;font-weight:800;}
.delete-confirm-copy{display:flex;flex-direction:column;gap:6px;}
.delete-confirm-copy strong{font-size:16px;color:#513b39;}
.delete-confirm-copy span{font-size:12px;line-height:1.5;color:#9c8e8c;}
.delete-confirm-actions{display:flex;width:100%;gap:9px;margin-top:8px;}
.delete-cancel,.delete-accept{flex:1;border:0;border-radius:11px;padding:11px 12px;font-size:13px;font-weight:700;}
.delete-cancel{background:#f2f4f3;color:#68736d;}
.delete-accept{background:#d95b56;color:#fff;}
/* 主屏幕图标安装入口 */
.install-home-card{display:flex;align-items:center;gap:10px;padding:11px;margin:3px 0 14px;border:1px solid #e6eeea;border-radius:15px;background:#fbfcfb;}
.install-app-icon{width:54px;height:54px;flex:none;display:flex;align-items:center;justify-content:center;border-radius:13px;background:#2c5e4f;color:#fff;box-shadow:0 3px 9px rgba(44,94,79,.22);}
.install-app-icon span{font-size:6.5px;letter-spacing:.15px;font-weight:900;white-space:nowrap;}
.install-home-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:4px;}
.install-home-copy strong{font-size:13px;color:#30443a;}
.install-home-copy span{font-size:10px;color:var(--text-muted);}
.install-home-button{border:0;border-radius:10px;padding:9px 13px;background:var(--primary);color:#fff;font-size:12px;font-weight:700;}
/* 手势区域保留竖向滚动，横向手势切换同组卡片 */
#infoBody{touch-action:pan-y;}
.card-detail-view{touch-action:pan-y;}
@media (max-width:370px){.group-create-row{grid-template-columns:70px minmax(0,1fr) 66px 48px;gap:4px}.group-create-row input,.group-create-row select{font-size:11px;padding:8px 5px}.grammar-topic-grid{grid-template-columns:1fr;}}


#infoModal .modal-content{height:86vh;height:86dvh;}
#infoBody.card-detail-mode{display:flex;flex-direction:row;align-items:stretch;gap:14px;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-padding-inline:6%;padding:8px 6%;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
#infoBody.card-detail-mode::-webkit-scrollbar{display:none;}
.{flex:0 0 88%;width:88%;min-width:0;height:100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;background:#fff;border-radius:18px;box-shadow:0 4px 18px rgba(31,74,61,.07);}
.card-detail-view{min-height:100%;padding:5px 13px 12px;}
.card-detail-view .card-body{overflow:visible;min-height:0;}
.card-detail-view .word-phonetic{font-size:18px;}
.card-detail-view .word-syllable{font-size:17px;}
.card-detail-view .sec-label{font-size:14px;}
.card-detail-view .sec-body{font-size:18px;line-height:1.75;}
.card-detail-view .card-body{font-size:18px;line-height:1.75;}
.card-detail-view .card-footer{font-size:14px;}
.card-detail-group{font-size:14px;}
.card-detail-group select{font-size:13px;}
.card-directory-word{font-size:16px;}
.card-directory-desc{font-size:13px;}
.cards-bulk-toolbar{display:flex;align-items:center;justify-content:flex-end;min-height:38px;margin:-4px 0 10px;}
.cards-bulk-toolbar>button,#bulkModeActions button{border:1px solid #d7e4dd;border-radius:10px;background:#fff;color:var(--primary);font-size:12px;font-weight:700;padding:8px 12px;}
#bulkModeActions{width:100%;display:flex;align-items:center;gap:7px;}
#bulkSelectedCount{margin-right:auto;font-size:12px;color:var(--text-sub);}
#bulkModeActions button:disabled{opacity:.4;}
#bulkModeActions button.bulk-cancel{color:#8a9690;border-color:#e4e9e6;}
.card-select{width:19px;height:19px;flex:none;accent-color:var(--primary);margin:0 2px 0 0;}
.card-directory-item.select-mode{cursor:default;}
.card-directory-item.select-mode .card-directory-main{pointer-events:none;}
#deleteHoldIndicator{position:fixed!important;left:50%!important;top:50%!important;right:auto!important;bottom:auto!important;transform:translate(-50%,-50%)!important;z-index:1200!important;}
#deleteConfirm{position:fixed!important;inset:0!important;z-index:1300!important;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(20,29,24,.48);}
#deleteConfirm .delete-confirm{position:relative!important;left:auto!important;right:auto!important;top:auto!important;bottom:auto!important;z-index:auto!important;width:min(100%,330px);margin:0;}
.check-photo{cursor:zoom-in;}
.photo-preview-overlay{position:fixed;inset:0;z-index:1400;display:flex;align-items:center;justify-content:center;padding:22px;background:rgba(12,18,15,.92);}
.photo-preview-overlay img{display:block;max-width:96vw;max-height:86vh;object-fit:contain;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.32);}
.photo-preview-close{position:absolute;top:calc(16px + env(safe-area-inset-top));right:18px;width:42px;height:42px;border:0;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:30px;line-height:1;}
.group-choice-caption{font-size:12px;color:var(--text-muted);margin:5px 0 8px;}
.group-choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.group-choice{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-height:70px;padding:10px;border:1px solid #e3ebe6;border-radius:12px;background:#fbfcfb;color:#33443a;text-align:left;}
.group-choice.selected{border:2px solid var(--primary);background:#edf5f1;padding:9px;}
.group-choice:disabled{opacity:.4;}
.group-choice-category{font-size:10px;color:var(--primary);font-weight:750;}
.group-choice strong{font-size:13px;}
.group-choice small{font-size:10px;color:var(--text-muted);}
.group-picker-empty{font-size:12px;line-height:1.6;color:var(--text-muted);padding:10px 0;}
.group-picker-create{padding:10px 14px;border:0;border-radius:10px;background:var(--primary);color:#fff;font-size:13px;font-weight:700;}


/* V5 input status + inline preview */
#tab-input{display:flex;flex-direction:column;min-height:0;overflow-y:auto;}
#tab-input .recognize-status-bar{position:sticky;top:0;z-index:12;flex:0 0 48px;height:48px;min-height:48px;display:flex;align-items:center;gap:9px;padding:0 12px;margin:0 -2px 10px;border:1px solid #e6ede9;border-radius:13px;background:rgba(245,247,246,.97);box-shadow:0 3px 12px rgba(31,74,61,.05);backdrop-filter:blur(12px);}
.recognize-dot{width:8px;height:8px;flex:none;border-radius:50%;background:#aab5af;}
.recognize-dot.loading{background:#d99a36;box-shadow:0 0 0 4px rgba(217,154,54,.12);animation:pulse 1s infinite;}
.recognize-dot.done{background:#35a36d;}.recognize-dot.fail{background:#d95b56;}
#recognizeTitle{flex:none;font-size:13px;font-weight:750;color:var(--primary);}
#recognizeMessage{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;color:var(--text-muted);text-align:right;}
.recognition-preview{flex:1;min-height:0;padding:2px 0 18px;overflow:visible;}
.recognition-preview .preview-card{background:#fff;border:1px solid #e9efec;box-shadow:var(--shadow);}
.recognition-preview .preview-card-title{font-size:18px;}
.preview-group-row{display:flex;align-items:center;gap:9px;justify-content:space-between;flex-wrap:wrap;}
.preview-group-row label{font-size:12px;font-weight:700;color:var(--primary);white-space:nowrap;}
.preview-group-select{flex:1;min-width:0;max-width:78%;padding:8px 10px;border:1px solid #dce6e0;border-radius:10px;background:#f9fbfa;color:var(--text-main);font:inherit;font-size:12px;}
/* Modal itself is the card. Horizontal swipe animates its single content layer. */
#infoModal .modal-content{width:100%;height:86vh;height:86dvh;max-height:86vh;max-height:86dvh;padding:18px 17px 15px;overflow:hidden;}
#infoBody.card-detail-mode{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;}
#infoBody .card-detail-content{min-height:100%;display:flex;flex-direction:column;background:transparent;border:0;border-radius:0;box-shadow:none;padding:0;}
#infoBody .card-detail-content .card-header{flex:none;}
#infoBody .card-detail-content .card-body{flex:none;overflow:visible;font-size:18px;line-height:1.75;}
#infoBody .card-detail-content .sec-label{font-size:14px;}
#infoBody .card-detail-content .sec-body{font-size:18px;line-height:1.75;}
#infoBody .card-detail-content .word-big{font-size:40px;}
#infoBody .card-detail-content .word-phonetic{font-size:18px;}
#infoBody .card-detail-content .word-syllable{font-size:17px;}
#infoBody .card-detail-content .card-footer{font-size:14px;}
@media(max-width:370px){#recognizeMessage{font-size:10px;}}

</style>
</head>
<body>
<div id="app">

  <!-- ================= TAB 1 录入 ================= -->
  <div class="content active" id="tab-input">
    <div class="recognize-status-bar" id="recognizeStatus" role="status" aria-live="polite">
      <span class="recognize-dot" id="recognizeDot"></span><strong id="recognizeTitle">等待识别</strong>
      <span id="recognizeMessage">粘贴内容后，点击放大镜进行 AI 识别</span>
    </div>
    <div class="recognition-preview" id="recognitionPreview"><div class="empty-hint">AI 识别结果会显示在这里</div></div>
  </div>

  <!-- 固定底部录入区：输入框与工作条一体化 -->
  <div class="input-dock" id="inputDock">
    <div class="input-composer">
      <textarea class="paste-box" id="batchInput" placeholder="粘贴或输入英语单词、短语及学习材料…
支持多行、逗号分隔与图片识别"></textarea>
      <div class="work-toolbar" aria-label="录入工具">
        <button class="tool-icon" type="button" title="清空" aria-label="清空" onclick="clearBatch()">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M10 11v6m4-6v6M6 7l1 14h10l1-14M9 7V4h6v3"/></svg>
        </button>
        <button class="tool-icon" type="button" title="相机识别" aria-label="相机识别" onclick="document.getElementById('imageInput').click()">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8.5A2.5 2.5 0 0 1 5.5 6H8l1.5-2h5L16 6h2.5A2.5 2.5 0 0 1 21 8.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5z"/><circle cx="12" cy="13" r="4"/></svg>
        </button>
        <button class="tool-icon" type="button" title="收藏并创建卡片" aria-label="收藏并创建卡片" onclick="favoriteFromToolbar()">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m12 3 2.7 5.5 6.1.9-4.4 4.3 1 6.1-5.4-2.9-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/></svg>
        </button>
        <button class="tool-icon tool-search" type="button" title="AI 识别" aria-label="AI 识别" onclick="triggerSearch()">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.2 16.2 4.3 4.3"/></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- ================= TAB 2 语法 ================= -->
  <div class="content" id="tab-grammar">
    <div id="grammarTopics"></div>
  </div>

  <!-- ================= TAB 3 卡片 ================= -->
  <div class="content" id="tab-cards">
    <details class="fold group-manager">
      <summary>卡片分组管理</summary>
      <div class="group-create-row">
        <select id="groupCategory" aria-label="分组类别"><option>单词</option><option>语法</option><option>其它</option></select>
        <input id="groupName" type="text" placeholder="分组名称">
        <input id="groupLimit" type="number" min="0" placeholder="数量不限" aria-label="数量上限">
        <button type="button" onclick="createCardGroup()">创建</button>
      </div>
      <div class="group-hint">数量上限填 0 表示不限；同一类别可建立多个分组。</div>
      <div id="groupManagerList"></div>
    </details>
    <div class="card-directory-title">卡片目录</div>
    <div class="cards-bulk-toolbar" id="cardsBulkToolbar">
      <button type="button" id="bulkModeButton" onclick="toggleBatchDeleteMode()">批量删除</button>
      <div id="bulkModeActions" style="display:none;">
        <span id="bulkSelectedCount">已选 0 张</span>
        <button type="button" onclick="selectAllCards()">全选</button>
        <button type="button" id="bulkDeleteButton" onclick="requestDeleteSelectedCards()" disabled>删除选中</button>
        <button type="button" class="bulk-cancel" onclick="toggleBatchDeleteMode(false)">取消</button>
      </div>
    </div>
    <div id="cardsContainer"></div>
  </div>

  <!-- ================= TAB 4 清单 ================= -->
  <div class="content" id="tab-checklist">
    <div class="rest-card">
      <div class="rest-head"><div><div class="rest-title">休息记录</div><div class="rest-sub" id="restStatus">今天还没有休息记录</div></div><span class="rest-icon">☕</span></div>
      <div class="rest-summary" id="restSummary">今日 0 次 · 共 0 分钟</div>
      <button class="rest-action" id="restButton" onclick="toggleBreak()">开始休息</button>

<script>
/* =========================================================
   基础工具
========================================================= */
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nowStr = () => new Date().toLocaleString('zh-CN',
  {month:'numeric', day:'numeric', hour:'2-digit', minute:'2-digit'});
const THREE_DAYS = 3 * 24 * 60 * 60 * 1000;
const WORK_MIN = 510; // 8.5 小时

function load(key, fallback){
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
  catch(e){ return fallback; }
}
function safeSet(key, val){
  try { localStorage.setItem(key, val); return true; }
  catch(e){ return false; }
}

/* =========================================================
   状态
========================================================= */
let words      = load('wm_words', []);
let checklist  = load('wm_checklist', []);
let stats      = load('wm_stats', {apiCalls:0, tokens:0});
let attendance = load('wm_attendance', {});
let workStart  = localStorage.getItem('wm_work_start') || '09:00';
let apiKey     = localStorage.getItem('wm_api_key') || '';
let outTs      = Number(localStorage.getItem('wm_out_ts') || 0);
let homeTs     = Number(localStorage.getItem('wm_home_ts') || 0);
let batchQueue = [];
let batchRunning = false;
let pendingCheckId = null;

/* =========================================================
   初始化
========================================================= */
function init(){
  $('apiKeyInput').value = apiKey;
  $('workStartInput').value = workStart;
  cleanupPhotos();
  renderCards();
  renderChecklist();
  updateStatsUI();
  tick();
  setInterval(tick, 1000);
  setInterval(() => { cleanupPhotos(); renderChecklist(); }, 60000);

  $('searchInput').addEventListener('keypress', e => {
    if (e.key === 'Enter') triggerSearch();
  });
}

/* =========================================================
   Tab 切换
========================================================= */
function switchTab(tabId){
  document.querySelectorAll('.content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
  $('tab-' + tabId).classList.add('active');

  const navs = document.querySelectorAll('.nav-item');
  const map = {input:0, cards:1, checklist:2};
  navs[map[tabId]].classList.add('active');

  const titles = {input:'单词录入', cards:'记忆卡片', checklist:'出行清单'};
  $('header-title').innerText = titles[tabId];

  if (tabId === 'cards') renderCards();
  if (tabId === 'checklist') { cleanupPhotos(); renderChecklist(); updateWork(); }
  if (tabId === 'input') updateStatsUI();
}

/* =========================================================
   通用 API 调用
========================================================= */
async function callAI(messages){
  if(!apiKey)throw new Error('请先在“设置与统计”中填写 DeepSeek API Key');
  const controller=new AbortController(),timeout=setTimeout(()=>controller.abort(),90000);
  try{
    const response=await fetch('https://api.deepseek.com/v1/chat/completions',{
      method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+apiKey},
      body:JSON.stringify({model:'deepseek-chat',messages,temperature:0.25}),signal:controller.signal
    });
    const text=await response.text();let data;
    try{data=text?JSON.parse(text):null;}catch(e){throw new Error(`API 返回的不是有效 JSON（HTTP ${response.status}）`);}
    if(!response.ok){const msg=data&&data.error&&data.error.message;throw new Error(msg||`API 请求失败（HTTP ${response.status}）`);}
    if(!data||!Array.isArray(data.choices)||!data.choices.length){const msg=data&&data.error&&data.error.message;throw new Error(msg||'API 没有返回 choices，请检查 Key、额度或模型权限');}
    let content=data.choices[0].message&&data.choices[0].message.content;
    if(Array.isArray(content))content=content.map(x=>x.text||'').join('');
    if(typeof content!=='string'||!content.trim())throw new Error('AI 返回内容为空，请重新识别');
    stats.apiCalls++;stats.tokens+=Math.round(JSON.stringify(messages).length/2)+300;saveStats();return content.trim();
  }catch(e){
    if(e&&e.name==='AbortError')throw new Error('AI 请求超过 90 秒仍未完成，请检查网络后重试');
    if(e instanceof TypeError)throw new Error('网络连接失败，无法访问 DeepSeek API');
    throw e;
  }finally{clearTimeout(timeout);}
}

/* =========================================================
   图片识别：OCR 提取文字 → AI 提取单词 → 自动生成卡片
========================================================= */
let tessLoading = null;
function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    if (tessLoading) return tessLoading;
    tessLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.onload = resolve;
        s.onerror = () => { tessLoading = null; reject(new Error('OCR 组件加载失败，请检查网络')); };
        document.head.appendChild(s);
    });
    return tessLoading;
}

async function ocrImage(dataUrl, onProgress) {
    await loadTesseract();
    const r = await Tesseract.recognize(dataUrl, 'eng', {
        logger: m => { if (m.status === 'recognizing text') onProgress(Math.round(m.progress * 100)); }
    });
    return (r && r.data && r.data.text) || '';
}

async function extractWordsAI(text) {
    const prompt = `下面是 OCR 从图片中识别出的文字（可能含错字、乱码、中文释义、序号、音标等噪声）。请提取其中需要学习的英文单词或短语：保持图片中的原样，仅修正明显的 OCR 拼写错误，去重，最多 60 个。只输出 JSON 数组，例如 ["abandon","cognitive"]，不要输出任何其他内容。

${text.slice(0, 4000)}`;
    const res = await callAI([{role: 'user', content: prompt}]);
    const m = res.match(/\[[\s\S]*\]/);
    if (!m) throw new Error('AI 提取失败');
    let arr;
    try { arr = JSON.parse(m[0]); } catch (e) { throw new Error('AI 提取失败'); }
    return [...new Set(arr.map(w => String(w).trim()).filter(w => /^[A-Za-z][A-Za-z\s'-]*$/.test(w)))].slice(0, 60);
}

async function handleImageUpload(event) {
    const file = event.target.files[0];
    event.target.value = '';
    if (!file) return;
    if (batchRunning) { alert('正在生成中，请稍候'); return; }
    if (!apiKey) { alert('请先在“设置与统计”中填写 API Key：图片识别后需要 AI 提取单词并生成卡片'); return; }

    $('recognizeStatus').innerHTML = '';
    const el = addStatusItem('图片识别', 'loading', '读取图片...');
    batchRunning = true;
    $('batchBtn').disabled = true;
    let words_ = [];
    try {
        const dataUrl = await compressImage(file, 1600, 0.85);
        setStatus(el, 'loading', '文字识别中 0%');
        const text = await ocrImage(dataUrl, p => setStatus(el, 'loading', '文字识别中 ' + p + '%'));
        if (!text.trim()) throw new Error('未识别到文字');
        setStatus(el, 'loading', 'AI 提取单词中...');
        words_ = await extractWordsAI(text);
        if (!words_.length) throw new Error('未提取到单词');
        setStatus(el, 'done', '提取 ' + words_.length + ' 个单词');
    } catch (e) {
        setStatus(el, 'fail', e.message || '识别失败');
    }
    batchRunning = false;
    $('batchBtn').disabled = false;
    if (words_.length) {
        $('batchInput').value = words_.join(', ');
        processBatch(true); // 自动写入：直接生成卡片
    }
}

/* =========================================================
   发音（联网音频，失败时回退到浏览器语音）
========================================================= */
let curAudio = null;
function stopSpeak() {
    if (curAudio) { try { curAudio.pause(); } catch (e) {} curAudio = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
}

function speak(word, type) { // type: 1 英音, 2 美音
    word = String(word || '').trim();
    if (!word) return;
    stopSpeak();
    let fell = false;
    const fallback = () => {
        if (fell) return;
        fell = true;
        if (!('speechSynthesis' in window)) { alert('发音失败：网络不可用且浏览器不支持语音'); return; }
        const u = new SpeechSynthesisUtterance(word);
        u.lang = type === 1 ? 'en-GB' : 'en-US';
        u.rate = 0.9;
        speechSynthesis.speak(u);
    };
    const a = new Audio('https://dict.youdao.com/dictvoice?audio=' + encodeURIComponent(word) + '&type=' + type);
    curAudio = a;
    a.onerror = fallback;
    const p = a.play();
    if (p && p.catch) p.catch(fallback);
}

/* =========================================================
   选中单词查询
========================================================= */
let selWord = '';
let selTimer = null;
const hideSelBar = () => $('selBar').classList.remove('active');

function updateSelBar() {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || sel.rangeCount === 0) { hideSelBar(); return; }
    const text = sel.toString().trim();
    const n = sel.anchorNode;
    const el = n && (n.nodeType === 1 ? n : n.parentElement);
    if (!el || !el.closest('#cardsContainer, #infoBody')) { hideSelBar(); return; }
    if (!/^[A-Za-z][A-Za-z\s'’-]{0,38}$/.test(text)) { hideSelBar(); return; }
    selWord = text.replace(/’/g, "'");

    const r = sel.getRangeAt(0).getBoundingClientRect();
    const bar = $('selBar');
    bar.classList.add('active');
    const bw = bar.offsetWidth, bh = bar.offsetHeight;
    const left = Math.max(8, Math.min(window.innerWidth - bw - 8, r.left + r.width / 2 - bw / 2));
    let top = r.bottom + 10;
    if (top + bh > window.innerHeight - 8) top = Math.max(8, r.top - bh - 10);
    bar.style.left = left + 'px';
    bar.style.top = top + 'px';
}

document.addEventListener('selectionchange', () => {
    clearTimeout(selTimer);
    selTimer = setTimeout(updateSelBar, 250);
});
document.addEventListener('scroll', hideSelBar, true);

async function lookupFree(w) {
    const r = await fetch('https://api.dictionaryapi.dev/v2/entries/en/' + encodeURIComponent(w));
    if (!r.ok) throw new Error('未查到该词（短语请配置 API Key 后查询）');
    const e = (await r.json())[0];
    let html = `<p><strong>${esc(e.word)}</strong> ${esc(e.phonetic || '')}</p>`;
    (e.meanings || []).slice(0, 3).forEach(m => {
        html += `<p><b>${esc(m.partOfSpeech)}</b> ${esc((m.definitions || []).slice(0, 2).map(x => x.definition).join('；'))}</p>`;
    });
    return html + '<p style="color:#999;font-size:12px;margin-top:10px;">(未配置 API Key，使用在线英文词典)</p>';
}

async function lookupWord(word) {
    const w = String(word || selWord || '').trim();
    hideSelBar();
    if (!w) return;
    try { window.getSelection().removeAllRanges(); } catch (e) {}
    showInfo(w, '<div style="text-align:center;padding:20px;color:#888;">查询中...</div>', w);
    let html;
    try {
        if (apiKey) {
            const res = await callAI([{role: 'user', content:
                `请简明解释英文单词/短语 "${w}"：1）音标；2）词性与中文释义（不超过 3 条）；3）一句英文例句并附中文翻译。纯文本输出，每项一行，不使用 Markdown。`}]);
            html = esc(res).replace(/\n/g, '<br>');
        } else {
            html = await lookupFree(w);
        }
    } catch (e) {
        html = `<span style="color:red;">查询失败：${esc(e.message)}</span>`;
    }
    if ($('infoModal').classList.contains('active') && $('infoSpeak').dataset.w === w) showInfo(w, html, w);
}

async function addLookupWord() {
    const btn = $('infoAdd');
    const w = btn.dataset.w;
    if (!w) return;
    if (!apiKey) { showToast('生成卡片需要先填写 API Key'); return; }
    btn.dataset.state = 'busy';
    btn.disabled = true;
    btn.innerText = '生成中...';
    try {
        const generated = await generateWordCard(w);
        pendingPreviewCards = [normalizeCardData(generated, '单词')];
        btn.dataset.state = '';
        showGeneratedPreview('单词预览 · ' + w, pendingPreviewCards);
        updateStatsUI();
    } catch (e) {
        btn.innerText = '加入卡片';
        btn.disabled = false;
        btn.dataset.state = '';
        showToast(e.message || '生成失败');
    }
}
/* =========================================================
   批量处理
========================================================= */
function triggerSearch() {
    const val = $('searchInput').value.trim();
    if (!val) return;
    if (batchRunning) { alert('正在生成中，请稍候'); return; }
    $('searchInput').value = '';
    $('searchInput').blur();
    $('batchInput').value = val;
    processBatch();
}

function clearBatch() {
    $('batchInput').value = '';
    $('batchInput').focus();
}

function processBatch(keepStatus) {
    if (batchRunning) { alert('正在生成中，请稍候'); return; }
    const text = $('batchInput').value.trim();
    if (!text) { alert('请先输入或粘贴单词'); return; }
    const wordsArr = text.split(/[\n,，、;；]+/).map(w => w.trim()).filter(w => w);
    const uniqueWords = [...new Set(wordsArr)];
    if (uniqueWords.length === 0) return;

    $('batchInput').value = '';
    if (keepStatus !== true) $('recognizeStatus').innerHTML = '';

    batchQueue = [...uniqueWords];
    batchRunning = true;
    $('batchBtn').disabled = true;
    processNextInQueue();
}

function processNextInQueue() {
    if (batchQueue.length === 0) {
        batchRunning = false;
        $('batchBtn').disabled = false;
        updateStatsUI();
        return;
    }
    const word = batchQueue.shift();
    const el = addStatusItem(word, 'loading', '生成中...');
    generateWordCard(word).then(isNew => {
        setStatus(el, 'done', isNew ? '已完成' : '已存在');
        processNextInQueue();
    }).catch(err => {
        setStatus(el, 'fail', err.message || '失败');
        processNextInQueue();
    });
}

function addStatusItem(word, type, msg) {
    const container = $('recognizeStatus');
    if (container.querySelector('.empty-hint')) container.innerHTML = '';
    const div = document.createElement('div');
    div.className = 'status-item';
    div.innerHTML = `
        <div class="dot ${type}"></div>
        <div class="st-word">${esc(word)}</div>
        <div class="st-msg">${esc(msg)}</div>
    `;
    container.prepend(div);
    return div;
}

function setStatus(el, type, msg) {
    el.querySelector('.dot').className = 'dot ' + type;
    el.querySelector('.st-msg').innerText = msg;
}

/* =========================================================
   单词卡生成
========================================================= */
async function generateWordCard(word) {
    const prompt = `请为我生成单词 "${word}" 的详细记忆卡片，严格按照以下JSON格式输出，不要输出任何其他多余内容：
{
"word": "${word}",
"phonetic": "音标",
"syllable": "音节拆分（用点连接）",
"collins": "柯林斯英文释义",
"cn": "中文释义",
"example": "英文例句（附带中文翻译）",
"syn": "同义词",
"ant": "反义词"
}`;

    const res = await callAI([{role: 'user', content: prompt}]);
    let data;
    try {
        const m = res.match(/\{[\s\S]*\}/);
        data = JSON.parse(m ? m[0] : res);
    } catch (e) {
        throw new Error('AI 解析失败');
    }
    if (!data.word) data.word = word;
    return data;
}

function saveWord(data) {
    if (words.find(w => String(w.word).toLowerCase() === String(data.word).toLowerCase())) return false;
    data.id = Date.now() + Math.floor(Math.random() * 1000);
    data.time = nowStr();
    words.push(data);
    safeSet('wm_words', JSON.stringify(words));
    renderCards();
    return true;
}

/* =========================================================
   渲染单词卡
========================================================= */
function renderCards() {
    const container = $('cardsContainer');
    if (words.length === 0) {
        container.innerHTML = '<div class="empty-state">暂无卡片，快去录入单词吧~</div>';
        return;
    }

    const sorted = [...words].reverse();
    container.innerHTML = sorted.map(w => {
        return `
        <div class="flashcard">
            <div class="card-header">
                <div>
                    <div class="word-big">${esc(w.word)}</div>
                    ${w.phonetic ? `<div class="word-phonetic">${esc(w.phonetic)}</div>` : ''}
                    ${w.syllable ? `<div class="word-syllable">${esc(w.syllable)}</div>` : ''}
                    <div class="pron-row">
                        <button class="pron-btn" data-w="${esc(w.word)}" onclick="speak(this.dataset.w,2)">美音</button>
                        <button class="pron-btn" data-w="${esc(w.word)}" onclick="speak(this.dataset.w,1)">英音</button>
                    </div>
                </div>
                <button class="delete-btn" onclick="deleteWord(${w.id})">删除</button>
            </div>

function compressImage(file, maxW = 800, quality = 0.7) {
    return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
            const scale = Math.min(1, maxW / img.width);
            const c = document.createElement('canvas');
            c.width = Math.round(img.width * scale);
            c.height = Math.round(img.height * scale);
            c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
            URL.revokeObjectURL(url);
            resolve(c.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('图片读取失败')); };
        img.src = url;
    });
}

async function handleChecklistPhoto(event) {

/* =========================================================
   上班打卡 / 休息 / 迟到统计
========================================================= */
const dayKey = (d = new Date()) =>
    d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const fmtHM = ts => ts ? new Date(ts).toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit', hour12:false}) : '--:--';
const fmtDur = min => {
    min = Math.max(0, Math.round(min));
    const h = Math.floor(min / 60), m = min % 60;
    return h ? `${h}小时${m}分` : `${m}分钟`;
};
const openBreak = rec => {
    const l = rec && rec.breaks && rec.breaks[rec.breaks.length - 1];
    return l && !l.e ? l : null;
};

function schedTs(key) {
    const [y, m, d] = key.split('-').map(Number);
    const [hh, mm] = (workStart || '09:00').split(':').map(Number);
    return new Date(y, m - 1, d, hh, mm, 0, 0).getTime();
}

function saveAtt() {
    if (!safeSet('wm_attendance', JSON.stringify(attendance))) alert('本地存储空间不足');
}

function breakTotals(rec, now) {
    let n = 0, ms = 0, max = 0;
    (rec.breaks || []).forEach(b => {
        const d = Math.max(0, (b.e || now) - b.s);
        n++; ms += d; if (d > max) max = d;
    });
    return {n, ms, max};
}

function saveWorkStart() {
    const v = $('workStartInput').value;
    if (!v) { $('workStartInput').value = workStart; return; }
    workStart = v;
    safeSet('wm_work_start', workStart);
}

function clockIn() {
    const key = dayKey();
    if (attendance[key]) return;
    const now = Date.now();
    const sched = schedTs(key);
    attendance[key] = {
        in: now,
        sched,
        late: Math.max(0, Math.floor((now - sched) / 60000)),
        breaks: []
    };
    saveAtt();
    updateWork();
}

function clockOut() {
    const rec = attendance[dayKey()];
    if (!rec || rec.out) return;
    if (!confirm('确定下班打卡吗？')) return;
    const now = Date.now();
    const ob = openBreak(rec);
    if (ob) ob.e = now;
    rec.out = now;
    saveAtt();
    updateWork();
}

function toggleBreak() {
    const rec = attendance[dayKey()];
    if (!rec || rec.out) return;
    const ob = openBreak(rec);
    if (ob) ob.e = Date.now();
    else rec.breaks.push({s: Date.now()});
    saveAtt();
    updateWork();
}

function resetToday() {
    const key = dayKey();
    if (!attendance[key]) return;
    if (!confirm('确定清空今日考勤记录吗？')) return;
    delete attendance[key];
    saveAtt();
    updateWork();
}

function updateWork() {
    const now = Date.now();
    const key = dayKey();
    const rec = attendance[key];
    const ob = openBreak(rec);
    const state = !rec ? 'idle' : rec.out ? 'done' : ob ? 'break' : 'working';

    // 状态徽章
    const badge = $('w-badge');
    badge.className = 'w-badge ' + (state === 'idle' ? '' : state);
    badge.innerText = {idle:'未打卡', working:'工作中', break:'休息中', done:'已下班'}[state];

    // 三格数据
    const lateEl = $('w-late');
    lateEl.className = 'v sm';
    if (!rec) {
        $('w-in').innerText = '--:--';
        $('w-off').innerText = '--:--';
        lateEl.innerText = '--';
    } else {
        const off = rec.in + WORK_MIN * 60000;
        $('w-in').innerText = fmtHM(rec.in);
        $('w-off').innerText = (new Date(off).getDate() !== new Date(rec.in).getDate() ? '次日 ' : '') + fmtHM(off);
        if (rec.late > 0) { lateEl.innerText = fmtDur(rec.late); lateEl.classList.add('late'); }
        else { lateEl.innerText = '准时'; lateEl.classList.add('ok'); }
    }

    // 进度与剩余
    const bar = $('w-bar'), wrap = $('w-barwrap'), remain = $('w-remain');
    if (!rec) {
        bar.style.width = '0%';
        wrap.classList.remove('over');
        remain.innerText = '点击「上班打卡」开始计时（工时 8.5 小时）';
    } else {
        const off = rec.in + WORK_MIN * 60000;
        const end = rec.out || now;
        const pct = Math.min(100, Math.max(0, (end - rec.in) / (WORK_MIN * 60000) * 100));
        bar.style.width = pct.toFixed(1) + '%';
        wrap.classList.toggle('over', !rec.out && now > off);
        if (rec.out) {
            const bt = breakTotals(rec, rec.out);
            remain.innerText = `在岗 ${fmtDur((rec.out - rec.in) / 60000)}，扣除休息净工作 ${fmtDur((rec.out - rec.in - bt.ms) / 60000)}`;
        } else if (now < off) {
            remain.innerText = `距预计下班还有 ${fmtDur((off - now) / 60000)}`;
        } else {
            remain.innerText = `已超出预计下班 ${fmtDur((now - off) / 60000)}`;
        }
    }

    // 按钮状态
    $('w-btn-in').disabled = !!rec;
    $('w-btn-out').disabled = state !== 'working' && state !== 'break';
    const brk = $('w-btn-brk');
    brk.disabled = state !== 'working' && state !== 'break';
    brk.classList.toggle('running', state === 'break');
    if (state === 'break') {
        const sec = Math.floor((now - ob.s) / 1000);
        brk.innerText = `结束休息 ${Math.floor(sec / 60)}:${String(sec % 60).padStart(2, '0')}`;
    } else {
        brk.innerText = '开始休息';
    }

    // 今日休息统计
    if (rec) {
        const bt = breakTotals(rec, now);
        $('w-stat-today').innerHTML = bt.n === 0
            ? '今日暂无休息记录'
            : `今日休息 <b>${bt.n}</b> 次 · 共 <b>${fmtDur(bt.ms / 60000)}</b> · 最长 <b>${fmtDur(bt.max / 60000)}</b>`;
    } else {
        $('w-stat-today').innerHTML = '今日暂无休息记录';
    }

    // 本月统计
    const pre = key.slice(0, 7);
    let days = 0, lateN = 0, lateM = 0, brkMs = 0;
    Object.keys(attendance).forEach(k => {
        if (!k.startsWith(pre)) return;
        const r = attendance[k];
        days++;
        if (r.late > 0) { lateN++; lateM += r.late; }
        brkMs += breakTotals(r, r.out || now).ms;
    });
    $('w-stat-month').innerHTML = days === 0
        ? '本月暂无考勤记录'
        : `本月出勤 <b>${days}</b> 天 · 迟到 <b>${lateN}</b> 次，累计 <b>${fmtDur(lateM)}</b> · 日均休息 <b>${fmtDur(brkMs / 60000 / days)}</b>`;
}

function buildAttendanceLines() {
    const keys = Object.keys(attendance).sort().slice(-14);
    const now = Date.now();
    return keys.map(k => {
        const r = attendance[k];
        const bt = breakTotals(r, r.out || now);
        return `${k}：上班${fmtHM(r.in)}，下班${r.out ? fmtHM(r.out) : '未打卡'}，迟到${r.late || 0}分钟，休息${bt.n}次共${Math.round(bt.ms / 60000)}分钟`;
    });
}

async function analyzeWork() {
    const lines = buildAttendanceLines();
    if (lines.length === 0) { alert('暂无考勤记录，请先上班打卡'); return; }

    showInfo('AI 考勤分析', '<div style="text-align:center;padding:20px;color:#888;">正在分析...</div>');

    if (!apiKey) {
        // 本地统计兜底
        const now = Date.now();
        const keys = Object.keys(attendance).sort().slice(-14);
        let lateN = 0, lateM = 0, brkMs = 0, brkN = 0;
        keys.forEach(k => {
            const r = attendance[k];
            if (r.late > 0) { lateN++; lateM += r.late; }
            const bt = breakTotals(r, r.out || now);
            brkMs += bt.ms; brkN += bt.n;
        });
        showInfo('AI 考勤分析', `
            <p><strong>本地统计（最近 ${keys.length} 天）：</strong></p>
            <p>迟到 ${lateN} 次，累计 ${fmtDur(lateM)}${lateN ? `，平均每次 ${fmtDur(lateM / lateN)}` : ''}。</p>
            <p>休息共 ${brkN} 次，累计 ${fmtDur(brkMs / 60000)}，日均 ${fmtDur(brkMs / 60000 / keys.length)}。</p>
            <p style="color:#999;font-size:12px;margin-top:10px;">(未配置 API Key，未调用 AI)</p>`);
        return;
    }

    const prompt = `我的规定上班时间是 ${workStart}，每天工时按 8.5 小时计算（含休息）。以下是我最近的考勤与休息记录：
${lines.join('\n')}
请用中文做一段 100-200 字的分析：1）迟到规律；2）休息习惯是否合理（次数、时长、时间段）；3）给出 2 条可执行的改进建议。纯文本输出，不要使用 Markdown。`;

    try {
        const res = await callAI([{role: 'user', content: prompt}]);
        showInfo('AI 考勤分析', esc(res).replace(/\n/g, '<br>'));
    } catch (e) {
        showInfo('AI 考勤分析', `<span style="color:red;">分析失败：${esc(e.message)}</span>`);
    }
}

            } else {

        } catch (err) {

    reader.readAsText(file);
    event.target.value = '';
}


/* =========================================================
   新版功能层：录入预览、语法目录、卡片分类/分组、休息记录
   继续使用原有 wm_words / wm_checklist / wm_stats / wm_attendance 数据键。
========================================================= */
let cardGroups = load('wm_card_groups', []);
let pendingPreviewCards = [];
let pendingDeleteCardIds = [];
let currentModalCardId = null;
let batchDeleteMode = false;
let selectedCardIds = new Set();
let cardSwipeAnimating = false;
let toastTimer = null;
let cardGesture = null;
let deleteHoldTimer = null;
let deleteHoldTicker = null;
let deferredInstallPrompt = null;

const CARD_CATEGORIES = ['单词','语法','其它'];
const DEFAULT_GROUPS = [
  {id:'default-word', category:'单词', name:'默认单词', limit:0, isDefault:true},
  {id:'default-grammar', category:'语法', name:'默认语法', limit:0, isDefault:true},
  {id:'default-other', category:'其它', name:'默认其它', limit:0, isDefault:true}
];

function persistGroups(){ safeSet('wm_card_groups', JSON.stringify(cardGroups)); }
function ensureCardGroups(){
  if (!Array.isArray(cardGroups)) cardGroups = [];
  DEFAULT_GROUPS.forEach(g => { if (!cardGroups.some(x => x.id === g.id)) cardGroups.unshift({...g}); });
  words.forEach(w => {
    if (!w.category || !CARD_CATEGORIES.includes(w.category)) w.category = '单词';
    if (!w.groupId || !cardGroups.some(g => g.id === w.groupId)) w.groupId = defaultGroupId(w.category);
  });
  persistGroups();
  safeSet('wm_words', JSON.stringify(words));
}
function defaultGroupId(category){
  return category === '语法' ? 'default-grammar' : category === '其它' ? 'default-other' : 'default-word';
}
function getCardGroup(id){ return cardGroups.find(g => g.id === id); }
function groupsFor(category){ return cardGroups.filter(g => g.category === category); }
function countInGroup(id){ return words.filter(w => (w.groupId || defaultGroupId(w.category || '单词')) === id).length; }
function groupHasRoom(id, excludingId){
  const g = getCardGroup(id);
  if (!g || !g.limit || g.limit <= 0) return true;
  const count = words.filter(w => (w.groupId || defaultGroupId(w.category || '单词')) === id && w.id !== excludingId).length;
  return count < g.limit;
}

function parseAIJson(raw){
  const cleaned=String(raw||'').replace(/^\uFEFF/,'').replace(/```(?:json)?/gi,'').replace(/```/g,'').trim();
  if(!cleaned)throw new Error('AI 返回内容为空，请重新识别');
  const parse=s=>{try{return JSON.parse(s);}catch(e){return null;}};
  let obj=parse(cleaned);
  if(!obj){const a=(cleaned.match(/\[[\s\S]*\]/)||[])[0],o=(cleaned.match(/\{[\s\S]*\}/)||[])[0];obj=(a&&parse(a))||(o&&parse(o));}
  if(Array.isArray(obj))return obj;
  if(obj&&typeof obj==='object'){
    const nested=obj.cards||obj.items||obj.results||obj.data||obj.words;
    if(Array.isArray(nested))return nested;
    if(obj.word||obj.title||obj.topic)return [obj];
  }
  throw new Error('AI 返回格式无法解析，请再次点击搜索');
}
function normalizeCardData(data,fallback){
  const d={...data};d.word=String(d.word||d.title||d.topic||'').trim();
  if(!d.word)throw new Error('AI 返回了没有标题的内容，请重新识别');
  let cat=String(d.category||fallback||'单词').trim();if(cat==='其他')cat='其它';
  d.category=CARD_CATEGORIES.includes(cat)?cat:(fallback||'单词');
  const g=d.groupId?getCardGroup(d.groupId):null;if(!g||g.category!==d.category)d.groupId=defaultGroupId(d.category);
  return d;
}

  batchRunning=true;pendingPreviewCards=[];
  $('recognitionPreview').innerHTML='<div class="empty-hint">正在分析内容，请稍候…</div>';
  renderRecognitionStatus('正在调用 AI，整理单词、语法及其它知识点','loading');
  try{
    ensureCardGroups();
    const prompt=`你是一名专业英语词汇、语法与学习卡片整理助手。请从用户材料提取独立学习知识点。

3. 其它字段可包括 phonetic、syllable、collins、cn、example、syn、ant、summary、structure、usage、notes；没有内容时用空字符串。
4. 只返回合法 JSON 数组，不要 Markdown 或说明。
示例：[{"word":"abandon","category":"单词","phonetic":"","syllable":"","collins":"to leave behind","cn":"放弃","example":"","syn":"","ant":""}]
材料：
${input.slice(0,9000)}`;
    const raw=await callAI([{role:'user',content:prompt}]);
    const parsed=parseAIJson(raw),items=Array.isArray(parsed)?parsed:[parsed];
    pendingPreviewCards=items.filter(x=>x&&typeof x==='object').slice(0,20).map(x=>normalizeCardData(x,'单词'));
    if(!pendingPreviewCards.length)throw new Error('没有识别到可创建的内容，请补充英文单词或学习材料');

    renderRecognitionStatus(e.message||'AI 识别失败，请重试',true);showToast(e.message||'AI 识别失败');
  }finally{batchRunning=false;}
}
function renderRecognitionStatus(message,state){
  const dot=$('recognizeDot'),title=$('recognizeTitle'),detail=$('recognizeMessage');if(!dot||!title||!detail)return;
  dot.className='recognize-dot'+(state==='loading'?' loading':state===true?' fail':state==='done'?' done':'');
  title.textContent=state==='loading'?'AI 识别中':state===true?'识别未完成':state==='done'?'识别完成':'识别状态';
  detail.textContent=message||'';
}
function renderPreviewBody(card){
  const fields=[['音标',card.phonetic],['音节',card.syllable],['英文释义',card.collins],['中文释义',card.cn],['例句',card.example],['同义词',card.syn],['反义词',card.ant],['知识概要',card.summary],['结构',card.structure],['用法',card.usage],['注意事项',card.notes]].filter(x=>x[1]);
  return fields.map(([label,value])=>`<div class="sec"><div class="sec-label">${esc(label)}</div><div class="sec-body">${esc(value)}</div></div>`).join('');
}
function renderPreviewGroupOptions(card){
  const wanted=card.groupId||defaultGroupId(card.category||'单词');
  return CARD_CATEGORIES.map(category=>{
    const options=cardGroups.filter(g=>g.category===category).map(g=>{
      const selected=g.id===wanted?'selected':'',full=g.limit>0&&!groupHasRoom(g.id),count=g.limit?`${countInGroup(g.id)}/${g.limit}`:`${countInGroup(g.id)} 张`;
      return `<option value="${esc(g.id)}" ${selected} ${full&&!selected?'disabled':''}>${esc(g.name)} · ${count}${full?' · 已满':''}</option>`;
    }).join('');
    return `<optgroup label="${category}">${options}</optgroup>`;
  }).join('');
}

function savePendingCards(){
  if(!pendingPreviewCards.length){showToast('没有待收藏的识别结果');return;}
  ensureCardGroups();
  const selections=pendingPreviewCards.map((card,i)=>{
    const control=$('previewGroup'+i);return control&&control.value?control.value:(card.groupId||defaultGroupId(card.category||'单词'));
  });
  const projected={},seen=new Set();
  for(let i=0;i<pendingPreviewCards.length;i++){
    const card=pendingPreviewCards[i],group=getCardGroup(selections[i]);
    if(!group){showToast(`「${card.word}」的收藏分组不存在，请重新识别`);return;}
    const key=group.category+'::'+card.word.toLowerCase();
    if(seen.has(key)||words.some(w=>String(w.word).toLowerCase()===card.word.toLowerCase()&&(w.category||'单词')===group.category))continue;
    seen.add(key);projected[group.id]=(Object.prototype.hasOwnProperty.call(projected,group.id)?projected[group.id]:countInGroup(group.id))+1;
    if(group.limit>0&&projected[group.id]>group.limit){showToast(`「${group.name}」已达到数量上限，请更换收藏分组`);return;}
  }
  let saved=0,skipped=0;
  pendingPreviewCards.forEach((item,i)=>{
    const group=getCardGroup(selections[i]);if(!group){skipped++;return;}
    const data=normalizeCardData(item,item.category||'单词');data.category=group.category;data.groupId=group.id;
    if(saveWord(data))saved++;else skipped++;
  });
  if(saved){
    renderCards();renderGroupManager();updateStatsUI();renderRecognitionStatus(`已收藏 ${saved} 项${skipped?` · ${skipped} 项重复或跳过`:''}`,'done');
    showToast(`已收藏 ${saved} 张卡片${skipped?`，${skipped} 项重复或跳过`:''}`);
    pendingPreviewCards=[];document.querySelectorAll('.preview-group-select').forEach(x=>x.disabled=true);
    const fav=$('infoFavorite');if(fav&&$('infoModal').classList.contains('active')){fav.disabled=true;fav.style.opacity='.45';}
  }else showToast(skipped?'识别内容已存在，没有重复创建':'没有可收藏的内容');
}
