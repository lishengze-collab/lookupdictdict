    const res = await callAI([{role:'user', content:prompt}]);
    showInfo('AI 睡眠与休息分析', esc(res).replace(/\n/g, '<br>'));
  }catch(e){ showInfo('AI 睡眠与休息分析', `<span style="color:red;">分析失败：${esc(e.message)}</span>`); }
}

/* =========================================================
   设置、安装与导入导出
========================================================= */
function saveApiKey(){
  apiKey = $('apiKeyInput').value.trim();
  safeSet('wm_api_key', apiKey);
  showToast('API Key 已保存');
}
function saveStats(){ safeSet('wm_stats', JSON.stringify(stats)); updateStatsUI(); }
function updateStatsUI(){
  if ($('stat-api-calls')) $('stat-api-calls').innerText = stats.apiCalls || 0;
  if ($('stat-tokens')) $('stat-tokens').innerText = stats.tokens || 0;
  if ($('stat-words')) $('stat-words').innerText = words.length;
  if ($('stat-checks')) $('stat-checks').innerText = checklist.length;
}

window.addEventListener('beforeinstallprompt', event => { event.preventDefault(); deferredInstallPrompt = event; });
window.addEventListener('appinstalled', () => { deferredInstallPrompt = null; showToast('DICTIONARY 已添加到主屏幕'); });
async function addToHomeScreen(){
  if (deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    try{
      const choice = await deferredInstallPrompt.userChoice;
      showToast(choice && choice.outcome === 'accepted' ? '正在添加 DICTIONARY' : '已取消添加');
    }catch(e){ showToast('暂时无法打开安装窗口'); }
    deferredInstallPrompt = null;
    return;
  }
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  if (location.protocol === 'file:'){
    showInfo('添加 DICTIONARY 到主屏幕', '<p>请先将应用文件夹部署到支持 HTTPS 的静态网站，再使用浏览器打开。</p><p>部署时请同时保留 index.html、manifest.webmanifest、sw.js 和 icon-192.png / icon-512.png。</p>');
  } else if (isIOS){
    showInfo('添加 DICTIONARY 到主屏幕', '<p>请使用 Safari 打开本应用。</p><p>1. 点击底部或顶部的<strong>分享</strong>图标。</p><p>2. 在分享菜单中选择<strong>添加到主屏幕</strong>。</p><p>3. 确认名称为 <strong>DICTIONARY</strong>，点击添加。</p><p>主屏幕将使用绿色底色、白色 DICTIONARY 字样图标。</p>');
  } else {
    showInfo('添加 DICTIONARY 到主屏幕', '<p>请打开浏览器右上角菜单，选择<strong>安装应用</strong>或<strong>添加到主屏幕</strong>。</p><p>如未显示安装选项，请确认应用通过 HTTPS 访问，并且 PWA 文件与 HTML 位于同一目录。</p>');
  }
}
async function refreshAppPage(){
  const url = new URL(location.href);
  url.searchParams.set('_app_refresh', String(Date.now()));
  try{
    if ('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations){
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(reg => reg.update().catch(() => {})));
    }
  }catch(e){}
  location.replace(url.toString());
}
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}

function exportData(){
  const data = {words, checklist, stats, attendance, sleepRecords, workStart, cardGroups, exportTime:new Date().toISOString()};
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob); const a = document.createElement('a');
  a.href = url; a.download = `word_memory_backup_${Date.now()}.json`; a.click(); URL.revokeObjectURL(url);
}
function importData(event){
  const file = event.target.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if (data.words && data.checklist){
        words = Array.isArray(data.words) ? data.words : []; checklist = Array.isArray(data.checklist) ? data.checklist : [];
        stats = data.stats || {apiCalls:0, tokens:0}; if (data.attendance) attendance = data.attendance;
        if (data.workStart) { workStart = data.workStart; safeSet('wm_work_start', workStart); }
        sleepRecords = Array.isArray(data.sleepRecords) ? data.sleepRecords : sleepRecords;
        cardGroups = Array.isArray(data.cardGroups) ? data.cardGroups : cardGroups;
        ensureCardGroups(); cleanupPhotos(); archiveExpiredCards();
        safeSet('wm_checklist', JSON.stringify(checklist)); safeSet('wm_stats', JSON.stringify(stats)); safeSet('wm_attendance', JSON.stringify(attendance)); safeSet('wm_sleep_records', JSON.stringify(sleepRecords));
        renderCards(); renderGroupManager(); renderChecklist(); renderRestUI(); renderSleepUI(); updateStatsUI();
        showToast('数据恢复成功');
      } else showToast('文件格式不正确');
    }catch(err){ showToast('读取文件失败'); }
  };
  reader.readAsText(file); event.target.value = '';
}

/* 启动 */
init();
</script>
