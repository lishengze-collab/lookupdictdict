<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=yes">
<meta name="theme-color" content="#eef2ee">
<meta name="description" content="英文阅读辅助工具">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png?v=1">
<meta name="apple-mobile-web-app-title" content="阅读助手">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>英文阅读助手</title>
<style>
:root{
  --bg:#e9f1ee;--bg2:#dfeae6;--glass:rgba(255,255,255,.70);--glass-strong:rgba(255,255,255,.88);
  --line:rgba(7,63,54,.17);--text:#15322d;--muted:#637b76;--green:#0a5e4f;--green2:#07483d;
  --green3:#0d7662;--mint:#dff4ed;--focus:#fff1a8;--mark:#ffd34d;--ok:#16764d;--bad:#bd3d46;
  --shadow:0 18px 50px rgba(8,43,37,.13);--radius:22px;--reader-size:18px;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:radial-gradient(circle at 12% -10%,rgba(255,255,255,.95),transparent 38%),linear-gradient(145deg,var(--bg),var(--bg2));line-height:1.6}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(120deg,rgba(255,255,255,.24),transparent 35%,rgba(11,101,84,.05));z-index:-1}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
header{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:rgba(7,63,54,.90);backdrop-filter:blur(24px) saturate(155%);-webkit-backdrop-filter:blur(24px) saturate(155%);border-top:1px solid rgba(255,255,255,.18);box-shadow:0 -8px 30px rgba(4,40,34,.14)}
.header-row{display:none}
h1{margin:0;color:#fff;font-size:18px;letter-spacing:.2px}.device-badge{color:#d8f3eb;font-size:11px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.10);padding:4px 8px;border-radius:999px}
.tabs{max-width:960px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.tab-btn{min-height:40px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.09);color:#d9eee9;border-radius:13px;cursor:pointer;font-size:13px;padding:7px 8px;transition:.18s}
.tab-btn.active{background:rgba(255,255,255,.94);color:var(--green2);border-color:#fff;box-shadow:0 8px 22px rgba(0,0,0,.12)}
.tab-btn:focus-visible,.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(255,211,77,.62);outline-offset:2px}
main{max-width:960px;margin:auto;padding:18px 14px calc(88px + env(safe-area-inset-bottom))}.tab-panel{display:none}.tab-panel.active{display:block}
.card{background:var(--glass);backdrop-filter:blur(24px) saturate(150%);-webkit-backdrop-filter:blur(24px) saturate(150%);border:1px solid rgba(255,255,255,.76);box-shadow:var(--shadow);border-radius:var(--radius);padding:16px;margin-bottom:15px}
h2{font-size:16px;margin:0 0 10px;color:var(--green2)}
.hint{color:var(--muted);font-size:13px;margin:5px 0 10px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
textarea,input,select{width:100%;border:1px solid var(--line);border-radius:14px;padding:11px 12px;background:rgba(255,255,255,.82);color:var(--text);box-shadow:inset 0 1px 2px rgba(9,51,44,.05)}
textarea{resize:vertical;min-height:140px}.btn{border:1px solid var(--line);border-radius:13px;min-height:42px;padding:9px 14px;cursor:pointer;color:var(--green2);background:rgba(255,255,255,.80);font-weight:700;transition:transform .12s,background .15s,box-shadow .15s}.btn:active{transform:scale(.98)}
.btn.primary{color:#fff;background:linear-gradient(180deg,var(--green3),var(--green2));border-color:rgba(4,65,53,.65);box-shadow:0 8px 18px rgba(6,78,64,.19)}.btn.danger{color:#992f38;background:#fff0f1;border-color:#edc4c8}.btn:disabled{opacity:.52;cursor:not-allowed}
.status{font-size:13px;color:var(--muted)}.status.ok{color:var(--ok)}.status.bad{color:var(--bad)}
.reader-card{padding:0;overflow:hidden}.reader-toolbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line);background:rgba(248,252,250,.84);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px)}
.reader-tools{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.size-group{display:flex;background:rgba(7,63,54,.06);padding:3px;border-radius:12px}.size-btn{border:0;background:transparent;color:var(--green2);min-width:34px;height:34px;border-radius:9px;font-weight:800}.size-btn.active{background:#fff;box-shadow:0 3px 10px rgba(6,57,48,.12)}
.reader-note{padding:10px 15px 0}.article-shell{position:relative}
#article-body{max-width:740px;margin:0 auto;padding:18px 22px 34px;font-family:Georgia,"Times New Roman",serif;font-size:var(--reader-size);line-height:1.9;letter-spacing:.1px;min-height:260px;color:#182d29;overflow-wrap:anywhere}
.sentence{margin:0;padding:5px 9px;border-radius:9px;transition:background-color .13s,box-shadow .13s;box-decoration-break:clone;-webkit-box-decoration-break:clone}
/* Desktop and pointer devices: sentence hover focus */
@media (hover:hover) and (pointer:fine){.sentence:hover,.sentence.keyboard-focus{background:rgba(255,241,168,.72);box-shadow:inset 3px 0 0 #e9bf35}}
.sentence.reading-focus{background:rgba(255,241,168,.78);box-shadow:inset 3px 0 0 #d9ad1f}
#article-body mark{background:var(--mark);color:inherit;padding:1px 2px;border-radius:3px}
.focus-guide{display:none;pointer-events:none;position:absolute;left:10px;right:10px;top:38%;height:2.15em;transform:translateY(-50%);border-top:1px solid rgba(218,173,31,.26);border-bottom:1px solid rgba(218,173,31,.26);background:linear-gradient(90deg,transparent,rgba(255,241,168,.22) 8%,rgba(255,241,168,.22) 92%,transparent);z-index:2}
.reader-card.fullscreen{position:fixed;inset:0;z-index:250;margin:0;border:0;border-radius:0;background:rgba(241,248,245,.96);overflow:hidden;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.reader-card.fullscreen .reader-toolbar{flex:0 0 auto}.reader-card.fullscreen .reader-note{display:none}.reader-card.fullscreen .article-shell{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}.reader-card.fullscreen #article-body{padding-top:38vh;padding-bottom:48vh;max-width:760px}
.mobile-device .reader-card.fullscreen .focus-guide,.tablet-device .reader-card.fullscreen .focus-guide{display:block}
.mobile-device .sentence,.tablet-device .sentence{transition:background-color .18s}.no-scroll{overflow:hidden}
.q-item{border-top:1px solid var(--line);padding:14px 0}.q-item:first-child{border-top:0}.q-text{font-weight:750;margin-bottom:7px}.q-item textarea{min-height:82px}.result-ok{color:var(--ok);font-size:13px}.result-bad{color:var(--bad);font-size:13px}
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:rgba(228,242,237,.72);border:1px solid rgba(7,63,54,.08);border-radius:16px;padding:11px}.stat .num{font-size:20px;font-weight:800;color:var(--green2)}.stat .lbl{font-size:11px;color:var(--muted)}
.word-box{background:rgba(229,241,237,.75);border:1px solid var(--line);border-radius:14px;padding:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;word-break:break-word}
#selection-popup{position:fixed;display:none;z-index:400;width:min(330px,calc(100vw - 24px));padding:10px;border:1px solid rgba(255,255,255,.24);border-radius:18px;color:#fff;background:rgba(5,52,44,.92);backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 16px 38px rgba(0,0,0,.25)}
.popup-actions{display:flex;gap:7px}.popup-actions button{flex:1;color:#fff;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.22);border-radius:11px;padding:8px}.meaning{display:none;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,.18);font-size:13px;white-space:pre-wrap}
/* Custom modal, never native alert/confirm */
.modal-layer{position:fixed;inset:0;z-index:500;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(2,32,27,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}.modal-layer.open{display:flex}.modal-card{width:min(430px,100%);max-height:min(78vh,650px);overflow:auto;background:rgba(250,253,252,.94);border:1px solid rgba(255,255,255,.86);border-radius:24px;box-shadow:0 24px 70px rgba(2,35,29,.28);padding:18px}.modal-title{margin:0 0 6px;color:var(--green2);font-size:18px}.modal-message{color:#49645f;font-size:14px;white-space:pre-wrap}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
@media(max-width:700px){
  :root{--reader-size:20px}.device-badge{display:none}header{padding-left:10px;padding-right:10px}.header-row{display:none}.tabs{gap:5px}.tab-btn{font-size:12px;padding:6px 4px;border-radius:11px}main{padding:12px 9px calc(86px + env(safe-area-inset-bottom))}.card{border-radius:19px;padding:13px}.reader-card{padding:0}.reader-toolbar{padding:10px;align-items:flex-start}.reader-tools{justify-content:flex-end}.reader-toolbar h2{padding-top:7px}.reader-note{padding:9px 12px 0}.stat-grid{grid-template-columns:repeat(2,1fr)}#article-body{font-size:20px;line-height:1.82;padding:16px 14px 30px}.sentence{padding:5px 7px;border-radius:7px}.btn{min-height:44px}.modal-layer{align-items:flex-end;padding:10px 10px calc(10px + env(safe-area-inset-bottom))}.modal-card{width:100%;border-radius:24px 24px 18px 18px;max-height:82vh}.modal-actions .btn{flex:1}.reader-card.fullscreen .reader-toolbar{padding-top:10px}.reader-card.fullscreen #article-body{font-size:20px;line-height:1.82;padding-left:15px;padding-right:15px}}
@media(min-width:701px) and (max-width:1024px){:root{--reader-size:19px}#article-body{font-size:19px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}

/* Muted sage theme and text-only navigation */
:root{--bg:#f0f3f0;--bg2:#e7ece8;--glass:rgba(255,255,255,.86);--glass-strong:rgba(255,255,255,.96);--line:rgba(77,99,87,.14);--text:#263931;--muted:#78847d;--green:#7b9083;--green2:#596f63;--green3:#879b8f;--mint:#e9efea;--focus:#f7f0d9;--mark:#e9d89a;--ok:#718a78;--bad:#b7797e;--shadow:0 12px 30px rgba(44,65,54,.07);--radius:22px}
html{background:#edf1ed}
body{background:radial-gradient(ellipse at 12% 0%,rgba(255,255,255,.94),transparent 34%),radial-gradient(ellipse at 94% 18%,rgba(201,214,204,.23),transparent 32%),linear-gradient(145deg,#f0f3f0,#e8ede9)}
body::before{background:linear-gradient(120deg,rgba(255,255,255,.18),transparent 42%,rgba(87,111,96,.025))}
header{width:min(760px,calc(100% - 28px));left:50%;right:auto;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));padding:7px 10px;border:1px solid rgba(91,112,98,.13);border-radius:19px;background:rgba(249,251,249,.96);box-shadow:0 8px 26px rgba(43,63,51,.10);backdrop-filter:blur(22px) saturate(120%);-webkit-backdrop-filter:blur(22px) saturate(120%)}
.tabs{max-width:none;gap:0}
.tab-btn{display:flex;align-items:center;justify-content:center;gap:0;min-height:44px;border:0;border-radius:0;background:transparent;color:#849088;font-size:13px;font-weight:600;padding:8px 10px;box-shadow:none;flex-direction:row}
.tab-btn::before{display:none!important;content:none!important}
.tab-btn.active{background:transparent;color:var(--green2);border-color:transparent;box-shadow:none;font-weight:800}
.tab-btn:focus-visible{outline:2px solid rgba(116,142,125,.38);outline-offset:-2px;border-radius:10px}
main{max-width:920px;padding:18px 18px calc(104px + env(safe-area-inset-bottom))}
.card{background:rgba(255,255,255,.86);border:1px solid rgba(255,255,255,.94);box-shadow:0 9px 25px rgba(44,65,54,.065);border-radius:22px;padding:19px}
h2{font-size:16px;font-weight:800;letter-spacing:.1px;color:var(--green2)}
.hint{line-height:1.65;color:#7b8780}
textarea,input,select{border:1px solid rgba(91,112,98,.17);border-radius:14px;background:rgba(252,253,252,.96);transition:border-color .18s,box-shadow .18s}
textarea:focus,input:focus,select:focus{border-color:rgba(111,139,120,.55);box-shadow:0 0 0 4px rgba(125,151,133,.10);outline:none}
textarea{line-height:1.75}
#raw-input{min-height:220px;padding:16px;font-size:14px}
.btn{border-radius:13px;font-size:13px;font-weight:750;letter-spacing:.1px}
.btn.primary{background:linear-gradient(145deg,#879b8f,#6e8578);border-color:rgba(86,111,95,.32);box-shadow:0 6px 14px rgba(73,96,81,.13)}
.btn.primary:hover{filter:brightness(1.025)}
.status{font-size:12px}
#clean-status{display:inline-flex;align-items:center;gap:6px}
#clean-status.ok::before{content:"";width:7px;height:7px;border-radius:50%;background:#7b9a83}
#clean-status.bad::before{content:"";width:7px;height:7px;border-radius:50%;background:#ba7a80}
#clean-stats{margin-top:10px}
.reader-card{border-radius:22px}
.reader-toolbar{background:rgba(249,251,249,.96);padding:14px 17px}
.reader-toolbar h2{margin:0}
.size-group{border:1px solid rgba(91,112,98,.09);background:#eef2ee}
.size-btn{cursor:pointer}
#article-body{color:#293c33}
.q-item{padding:16px 0}
.q-text{line-height:1.65;color:#344b3e}
.q-item textarea{background:#fcfdfc}
.stat{background:linear-gradient(145deg,#f0f4f0,#e9efea);border-radius:16px;padding:14px}
.stat .num{font-variant-numeric:tabular-nums;color:var(--green2)}
.word-box{background:#f1f4f1;line-height:1.85}
.modal-card{border-radius:22px}
#selection-popup{border:1px solid rgba(255,255,255,.3)}
@media(max-width:700px){header{width:calc(100% - 22px);bottom:calc(8px + env(safe-area-inset-bottom));border-radius:18px}.tab-btn{min-height:44px;font-size:13px;padding:7px 3px;flex-direction:row}main{padding:12px 10px calc(100px + env(safe-area-inset-bottom))}.card{padding:15px;border-radius:19px}#raw-input{min-height:205px;padding:13px}.reader-toolbar{padding:11px 12px}}

/* Safari touch feedback: keep tab navigation text-only in every pointer state */
*{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}
.tabs .tab-btn,
.tabs .tab-btn:hover,
.tabs .tab-btn:active,
.tabs .tab-btn:focus,
.tabs .tab-btn:focus-visible,
.tabs .tab-btn.active{
  -webkit-appearance:none!important;appearance:none!important;
  -webkit-tap-highlight-color:transparent!important;
  background:transparent!important;background-color:transparent!important;
  border-color:transparent!important;box-shadow:none!important;
}
.tabs .tab-btn:focus{outline:none!important}
.tabs .tab-btn:focus-visible{outline:2px solid rgba(116,142,125,.34)!important;outline-offset:-3px}
.tabs .tab-btn.active{color:var(--green2)!important;font-weight:800}
.tabs .tab-btn:not(.active){color:#849088!important}
#tab-4 .stat-grid{margin-top:16px}
#tab-4 .word-box{margin-top:16px}
</style>
</head>
<body>
<header>
<nav class="tabs" aria-label="主要功能">
    <button class="tab-btn active" data-tab="1">粘贴</button><button class="tab-btn" data-tab="2">阅读</button><button class="tab-btn" data-tab="3">问题</button><button class="tab-btn" data-tab="4">设置</button>
  </nav>
</header>
<main>
 <section id="tab-1" class="tab-panel active">
  <div class="card">
    <h2>导入英文原文</h2>
    <textarea id="raw-input" aria-label="英文原文输入框" maxlength="120000" placeholder="在此粘贴英文文章…&#10;&#10;Paste your article here."></textarea>
    <div class="row" style="justify-content:space-between;margin-top:8px">
      <span class="status" id="input-counter">0 / 120,000</span>
     </div>
    <div class="row" style="margin-top:12px">
      <button class="btn primary" id="btn-clean">✦ 识别并去噪</button>
      <button class="btn" id="btn-clear-input">清空</button>
      <button class="btn" id="btn-goto-reader" hidden>前往阅读区 →</button>
      <span class="status" id="clean-status" role="status" aria-live="polite"></span>
    </div>
    <div id="clean-stats" class="hint"></div>
  </div>
</section>
<section id="tab-2" class="tab-panel">
  <div class="card reader-card" id="reader-card">
    <div class="reader-toolbar"><h2>阅读区</h2><div class="reader-tools"><div class="size-group" aria-label="字号"><button class="size-btn" data-size="17">A−</button><button class="size-btn active" data-size="20">A</button><button class="size-btn" data-size="22">A+</button></div><button class="btn" id="btn-clear-marks">清除高亮</button><button class="btn primary" id="btn-fullscreen">专注阅读</button></div></div>
       <div class="article-shell" id="article-shell"><div class="focus-guide" aria-hidden="true"></div><article id="article-body"></article></div>
  </div>
</section>
<section id="tab-3" class="tab-panel">
  <div class="card"><div class="row"><label class="hint" for="q-count">题目数量</label><input type="number" id="q-count" value="12" min="5" max="20" style="width:84px"><button class="btn primary" id="btn-gen-q">生成问题</button><span class="status" id="q-status"></span></div> </div><div id="questions" aria-live="polite"></div>
</section>
<section id="tab-4" class="tab-panel">
  <div class="card"><h2>API 设置</h2><label class="hint" for="api-key">API Key，仅保存在当前浏览器</label><input type="password" id="api-key" placeholder="sk-..."><div class="row" style="margin-top:10px"><div style="flex:1;min-width:210px"><label class="hint" for="base-url">接口地址</label><input id="base-url" value="https://api.deepseek.com"></div><div style="flex:1;min-width:170px"><label class="hint" for="model">模型</label><select id="model"><option value="deepseek-v4-flash">deepseek-v4-flash · 推荐</option><option value="deepseek-v4-pro">deepseek-v4-pro · 高质量</option></select></div></div><div class="row" style="margin-top:10px"><button class="btn primary" id="btn-save-settings">保存设置</button><span class="status" id="save-status"></span></div><p class="hint">API Key 保存在本机浏览器；请勿在公共设备使用。</p></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>Token 统计</h2><button class="btn danger" id="btn-reset-stats">重置</button></div><div class="stat-grid"><div class="stat"><div class="num" id="stat-calls">0</div><div class="lbl">调用次数</div></div><div class="stat"><div class="num" id="stat-prompt">0</div><div class="lbl">输入 tokens</div></div><div class="stat"><div class="num" id="stat-completion">0</div><div class="lbl">输出 tokens</div></div><div class="stat"><div class="num" id="stat-total">0</div><div class="lbl">总计 tokens</div></div></div></div>
  <div class="card"><div class="row" style="justify-content:space-between"><h2>生词本</h2><button class="btn" id="btn-copy-words">复制</button></div><div class="word-box" id="word-box">（暂无生词）</div></div>
</section>
</main>
<div id="selection-popup" role="dialog" aria-label="选词工具"><div class="popup-actions"><button id="pop-lookup">查词</button><button id="pop-add">加生词</button><button id="pop-close">关闭</button></div><div class="meaning" id="pop-meaning"></div></div>
<div class="modal-layer" id="app-modal" aria-hidden="true"><div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title"><h3 class="modal-title" id="modal-title">提示</h3><div class="modal-message" id="modal-message"></div><div class="modal-actions" id="modal-actions"></div></div></div>
<script>
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function readStored(k,fallback=''){try{const value=localStorage.getItem(k);return value===null?fallback:value}catch{return fallback}}
function readJSON(k,fallback){try{const value=readStored(k,'');return value?JSON.parse(value):fallback}catch{return fallback}}
const save=(k,v)=>{try{localStorage.setItem(k,typeof v==='string'?v:JSON.stringify(v));return true}catch(error){console.warn('Local storage unavailable:',error);return false}};
const rawStats=readJSON('rds_stats',{});
const state={
 apiKey:readStored('rds_apiKey',''),
 baseUrl:readStored('rds_baseUrl','https://api.deepseek.com'),
 model:readStored('rds_model','deepseek-v4-flash'),
 article:readStored('rds_article',''),
 words:Array.isArray(readJSON('rds_words',[]))?readJSON('rds_words',[]).filter(w=>typeof w==='string'):[],
 questions:Array.isArray(readJSON('rds_questions',[]))?readJSON('rds_questions',[]).filter(q=>q&&typeof q.question==='string'&&typeof q.answer==='string').map(q=>({question:q.question,answer:q.answer,userAnswer:typeof q.userAnswer==='string'?q.userAnswer:'',result:q.result&&typeof q.result==='object'?q.result:null})):[],
 highlights:Array.isArray(readJSON('rds_highlights',[]))?readJSON('rds_highlights',[]).filter(h=>typeof h==='string'):[],
 stats:{calls:0,prompt:0,completion:0,total:0,...(rawStats&&typeof rawStats==='object'?rawStats:{})},
 fontSize:Number(readStored('rds_fontSize','20'))||20
};
['calls','prompt','completion','total'].forEach(k=>state.stats[k]=Math.max(0,Number(state.stats[k])||0));
if(!['deepseek-v4-flash','deepseek-v4-pro'].includes(state.model))state.model='deepseek-v4-flash';

function escapeHtml(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function parseJSON(text){let t=String(text||'').trim().replace(/^```(?:json)?\s*/i,'').replace(/\s*```$/,'');if(!t)throw new Error('AI 返回内容为空，请重试');try{return JSON.parse(t)}catch{}const start=t.indexOf('{'),end=t.lastIndexOf('}');if(start>=0&&end>start)return JSON.parse(t.slice(start,end+1));throw new Error('无法解析 AI 返回的 JSON')}
const device=(()=>{const touch=navigator.maxTouchPoints>0,ua=navigator.userAgent;const phone=touch&&(/iPhone|Android.*Mobile/i.test(ua)||Math.min(innerWidth,innerHeight)<600);const tablet=touch&&!phone;return phone?'mobile':tablet?'tablet':'desktop'})();
document.body.classList.add(device+'-device');
function modal({title='提示',message='',confirmText='确定',cancelText='',danger=false}={}){return new Promise(resolve=>{const layer=$('#app-modal'),actions=$('#modal-actions');$('#modal-title').textContent=title;$('#modal-message').textContent=message;actions.innerHTML='';if(cancelText){const b=document.createElement('button');b.className='btn';b.textContent=cancelText;b.onclick=()=>close(false);actions.appendChild(b)}const ok=document.createElement('button');ok.className='btn '+(danger?'danger':'primary');ok.textContent=confirmText;ok.onclick=()=>close(true);actions.appendChild(ok);function close(v){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');resolve(v)}layer.classList.add('open');layer.setAttribute('aria-hidden','false');setTimeout(()=>ok.focus(),40)})}
$$('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(Number(b.dataset.tab))));
function switchTab(n){$$('.tab-btn').forEach(b=>b.classList.toggle('active',Number(b.dataset.tab)===n));$$('.tab-panel').forEach(p=>p.classList.toggle('active',p.id==='tab-'+n));window.scrollTo({top:0,behavior:'smooth'})}
function splitSentences(text){const out=[];for(const block of text.split(/\n+/).map(s=>s.trim()).filter(Boolean)){const parts=block.match(/[^.!?]+[.!?]+["')\]]*|[^.!?]+$/g)||[block];for(const part of parts){const t=part.trim();if(t)out.push(t)}}return out}
async function callAI(messages,{json=false,temperature=.3,maxTokens=8192}={}){
 if(!state.apiKey)throw new Error('请先在设置页填写 API Key');
 let base;
 try{base=new URL(state.baseUrl.trim())}catch{throw new Error('接口地址格式不正确，请检查设置页中的 URL')}
 if(!['https:','http:'].includes(base.protocol))throw new Error('接口地址只支持 HTTP 或 HTTPS');
 const url=base.toString().replace(/\/+$/,'')+'/chat/completions';
 const body={model:state.model,messages,temperature,max_tokens:maxTokens};
 if(json)body.response_format={type:'json_object'};
 const controller=new AbortController();
 const timeout=setTimeout(()=>controller.abort(),90000);
 let res,data;
 try{
   res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+state.apiKey},body:JSON.stringify(body),signal:controller.signal});
   const raw=await res.text();
   try{data=JSON.parse(raw)}catch{data=null}
   if(!res.ok){
     const detail=data?.error?.message||data?.message||raw.slice(0,240)||'未知错误';
     throw new Error(`API ${res.status}：${detail}`);
   }
   if(!data)throw new Error('接口返回的不是有效 JSON，请检查接口地址或代理设置');
 }catch(error){
   if(error.name==='AbortError')throw new Error('请求超时（90 秒），请缩短文章或稍后重试');
   if(error instanceof TypeError)throw new Error('网络请求失败：请检查网络、接口地址和 API 跨域设置');
   throw error;
 }finally{clearTimeout(timeout)}
 const choice=data.choices?.[0],content=choice?.message?.content;
 if(choice?.finish_reason==='length')throw new Error('模型输出达到长度上限，结果可能不完整。请缩短原文后重试');
 if(typeof content!=='string'||!content.trim())throw new Error('模型返回内容为空，请重试或更换模型');
 if(data.usage){
   state.stats.calls++;
   state.stats.prompt+=Number(data.usage.prompt_tokens)||0;
   state.stats.completion+=Number(data.usage.completion_tokens)||0;
   state.stats.total+=Number(data.usage.total_tokens)||0;
   save('rds_stats',state.stats);renderStats();
 }
 return content.trim();
}
$('#btn-clean').onclick=async()=>{const text=$('#raw-input').value.trim();if(text.length>120000){await modal({title:'内容过长',message:'单次最多支持 120,000 个字符，请分段导入。'});return}if(!text){await modal({message:'请先粘贴英文内容。'});return}const b=$('#btn-clean');b.disabled=true;$('#clean-status').textContent='识别中…';$('#btn-goto-reader').hidden=true;try{const result=await callAI([{role:'system',content:'你是网页正文提取助手。去除导航、菜单、广告、推荐、版权声明、评论和作者栏等噪声，只保留英文正文。保持原文，不翻译、不改写、不总结，段落之间保留空行，只输出正文。'},{role:'user',content:text}]);state.article=result.trim();state.highlights=[];save('rds_article',state.article);save('rds_highlights',state.highlights);renderArticle();const wc=state.article.split(/\s+/).filter(Boolean).length;$('#clean-status').className='status ok';$('#clean-status').textContent='识别完成';$('#clean-stats').textContent=`${wc.toLocaleString()} 个单词 · ${state.article.length.toLocaleString()} 个字符`;$('#btn-goto-reader').hidden=false}catch(e){$('#clean-status').className='status bad';$('#clean-status').textContent='失败：'+e.message}finally{b.disabled=false}};
$('#btn-goto-reader').onclick=()=>switchTab(2);
$('#raw-input').addEventListener('input',()=>{$('#input-counter').textContent=`${$('#raw-input').value.length.toLocaleString()} / 120,000`});
$('#btn-clear-input').onclick=()=>{$('#raw-input').value='';$('#input-counter').textContent='0 / 120,000';$('#clean-status').textContent='';$('#clean-stats').textContent='';$('#btn-goto-reader').hidden=true;};
function highlighted(sentence){let source=sentence,tokens=[];state.highlights.filter(Boolean).forEach((m,i)=>{if(source.includes(m)){const token=`___RDS_${i}_${Math.random().toString(36).slice(2)}___`;source=source.split(m).join(token);tokens.push({token,m})}});let h=escapeHtml(source);tokens.forEach(x=>h=h.split(x.token).join(`<mark>${escapeHtml(x.m)}</mark>`));return h}
function renderArticle(){const el=$('#article-body');if(!state.article){el.innerHTML='<p class="hint">暂无文章，请先在粘贴区识别正文。</p>';return}el.innerHTML=splitSentences(state.article).map((s,i)=>`<p class="sentence" tabindex="0" data-index="${i}">${highlighted(s)}</p>`).join('');setupReadingFocus()}
function applyFontSize(n){n=Math.max(17,Math.min(22,n));state.fontSize=n;save('rds_fontSize',n);document.documentElement.style.setProperty('--reader-size',n+'px');$$('.size-btn').forEach(b=>b.classList.toggle('active',Number(b.dataset.size)===n))}
$$('.size-btn').forEach(b=>b.onclick=()=>applyFontSize(Number(b.dataset.size)));
let focusRaf=0;
function setupReadingFocus(){const shell=$('#article-shell');shell.onscroll=()=>{if(focusRaf)return;focusRaf=requestAnimationFrame(()=>{focusRaf=0;updateFixedFocus()})};$$('.sentence').forEach(s=>{s.addEventListener('focus',()=>s.classList.add('keyboard-focus'));s.addEventListener('blur',()=>s.classList.remove('keyboard-focus'))});setTimeout(updateFixedFocus,60)}
function updateFixedFocus(){const card=$('#reader-card');if(device==='desktop'||!card.classList.contains('fullscreen'))return;const target=innerHeight*.38;let best=null,dist=Infinity;$$('.sentence').forEach(s=>{const r=s.getBoundingClientRect();const d=target<r.top?r.top-target:target>r.bottom?target-r.bottom:0;if(d<dist){dist=d;best=s}});$$('.sentence').forEach(s=>s.classList.toggle('reading-focus',s===best))}
$('#btn-fullscreen').onclick=()=>{const c=$('#reader-card'),on=c.classList.toggle('fullscreen');document.body.classList.toggle('no-scroll',on);$('#btn-fullscreen').textContent=on?'退出专注':'专注阅读';setTimeout(updateFixedFocus,100)};
$('#btn-clear-marks').onclick=async()=>{if(!state.highlights.length)return;const ok=await modal({title:'清除答案高亮',message:'清除所有“显示原文”产生的持续高亮吗？',confirmText:'清除',cancelText:'取消',danger:true});if(ok){state.highlights=[];save('rds_highlights',state.highlights);renderArticle()}};
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#reader-card').classList.contains('fullscreen'))$('#btn-fullscreen').click()});
let pendingSelection='';const popup=$('#selection-popup');
function hidePopup(){popup.style.display='none';pendingSelection=''}
function showPopup(rect,text){pendingSelection=text;popup.style.display='block';$('#pop-meaning').style.display='none';requestAnimationFrame(()=>{const w=popup.offsetWidth,h=popup.offsetHeight;let left=Math.max(12,Math.min(rect.left,innerWidth-w-12));let top=Math.max(12,rect.top-h-10);if(top<12)top=Math.min(innerHeight-h-12,rect.bottom+10);popup.style.left=left+'px';popup.style.top=top+'px'})}
function selectedText(){setTimeout(()=>{const sel=getSelection(),text=sel.toString().trim();if(!text||text.length>80||!sel.rangeCount){hidePopup();return}const range=sel.getRangeAt(0);if(!$('#article-body').contains(range.commonAncestorContainer)){hidePopup();return}showPopup(range.getBoundingClientRect(),text)},30)}
$('#article-body').addEventListener('mouseup',selectedText);$('#article-body').addEventListener('touchend',selectedText);$('#pop-close').onclick=hidePopup;
$('#pop-lookup').onclick=async()=>{if(!pendingSelection)return;const m=$('#pop-meaning');m.style.display='block';m.textContent='查询中…';try{m.textContent=(await callAI([{role:'system',content:'你是英汉词典。根据阅读语境解释英文单词或短语。输出：原形、音标、词性、简洁中文释义。不要超过80个汉字。'},{role:'user',content:pendingSelection}],{temperature:0})).trim()}catch(e){m.textContent='查询失败：'+e.message}};
$('#pop-add').onclick=()=>{const w=pendingSelection.trim();if(w&&!state.words.some(x=>x.toLowerCase()===w.toLowerCase())){state.words.push(w);save('rds_words',state.words);renderWords()}hidePopup()};
document.addEventListener('pointerdown',e=>{if(!popup.contains(e.target)&&!$('#article-body').contains(e.target))hidePopup()});
$('#btn-gen-q').onclick=async()=>{if(!state.article){await modal({message:'请先准备文章。'});return}const count=Math.min(20,Math.max(5,parseInt($('#q-count').value)||12)),b=$('#btn-gen-q');b.disabled=true;$('#q-status').textContent='生成中…';try{const raw=await callAI([{role:'system',content:`根据文章生成 ${count} 道英文阅读理解题，覆盖主旨、细节、推断和词义。每题提供简短英文参考答案。只输出 JSON：{"questions":[{"question":"...","answer":"..."}]}`},{role:'user',content:state.article}],{json:true});const data=parseJSON(raw);
const incoming=Array.isArray(data.questions)?data.questions:[];
state.questions=incoming.filter(q=>q&&typeof q.question==='string'&&q.question.trim()&&typeof q.answer==='string'&&q.answer.trim()).slice(0,count).map(q=>({question:q.question.trim(),answer:q.answer.trim(),userAnswer:'',result:null}));
if(!state.questions.length)throw new Error('模型没有返回有效题目，请重试');
save('rds_questions',state.questions);renderQuestions();$('#q-status').textContent=`已生成 ${state.questions.length} 题`}catch(e){$('#q-status').textContent='失败：'+e.message}finally{b.disabled=false}};
function renderQuestions(){const box=$('#questions');if(!state.questions.length){box.innerHTML='<div class="card"><p class="hint">暂无问题。</p></div>';return}box.innerHTML=`<div class="card">${state.questions.map((q,i)=>`<div class="q-item"><div class="q-text">${i+1}. ${escapeHtml(q.question)}</div><textarea class="q-answer" data-i="${i}" placeholder="Your answer…">${escapeHtml(q.userAnswer||'')}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-grade="${i}">校对答案</button><button class="btn" data-locate="${i}">显示原文</button>${q.result?`<span class="${q.result.correct?'result-ok':'result-bad'}">${q.result.correct?'✔ 正确':'✘ 有误'}：${escapeHtml(q.result.comment||'')}</span>`:''}</div></div>`).join('')}</div>`;$$('.q-answer').forEach(t=>t.oninput=e=>{state.questions[Number(e.target.dataset.i)].userAnswer=e.target.value;save('rds_questions',state.questions)});$$('[data-grade]').forEach(b=>b.onclick=()=>grade(Number(b.dataset.grade),b));$$('[data-locate]').forEach(b=>b.onclick=()=>locate(Number(b.dataset.locate),b))}
async function grade(i,b){const q=state.questions[i];if(!q.userAnswer.trim()){await modal({message:'请先填写答案。'});return}b.disabled=true;b.textContent='校对中…';try{const r=parseJSON(await callAI([{role:'system',content:'判断学生答案是否与参考答案语义一致，允许不同表达。用简短中文点评。只输出 JSON：{"correct":true,"comment":"..."}'},{role:'user',content:JSON.stringify({question:q.question,reference_answer:q.answer,user_answer:q.userAnswer})}],{json:true,temperature:0}));q.result={correct:r.correct===true,comment:typeof r.comment==='string'?r.comment:'已完成判断'};save('rds_questions',state.questions);renderQuestions()}catch(e){await modal({title:'校对失败',message:e.message})}finally{b.disabled=false}}
async function locate(i,b){const q=state.questions[i];b.disabled=true;b.textContent='定位中…';try{const raw=await callAI([{role:'system',content:'在英文原文中找出能回答问题的一句。必须逐字复制完整原句，保持大小写和标点一致，不改写、不翻译、不拼接。只输出 JSON：{"snippet":"..."}，找不到则为空字符串。'},{role:'user',content:`原文：\n${state.article}\n\n问题：${q.question}`}],{json:true});const snippet=(parseJSON(raw).snippet||'').trim();if(!snippet||!state.article.includes(snippet)){await modal({title:'无法定位',message:'没有找到与原文完全一致的答案句子，请重试。'});return}state.highlights.push(snippet);save('rds_highlights',state.highlights);renderArticle();switchTab(2)}catch(e){await modal({title:'定位失败',message:e.message})}finally{b.disabled=false;b.textContent='显示原文'}}
$('#api-key').value=state.apiKey;$('#base-url').value=state.baseUrl;$('#model').value=state.model;
$('#btn-save-settings').onclick=()=>{
 const key=$('#api-key').value.trim(),base=$('#base-url').value.trim()||'https://api.deepseek.com';
 try{const parsed=new URL(base);if(!['https:','http:'].includes(parsed.protocol))throw new Error();}catch{$('#save-status').className='status bad';$('#save-status').textContent='接口地址无效';return}
 state.apiKey=key;state.baseUrl=base.replace(/\/+$/,'');state.model=$('#model').value;
 const ok1=save('rds_apiKey',state.apiKey),ok2=save('rds_baseUrl',state.baseUrl),ok3=save('rds_model',state.model);
 $('#save-status').className='status '+(ok1&&ok2&&ok3?'ok':'bad');
 $('#save-status').textContent=ok1&&ok2&&ok3?'设置已保存在本机':'保存失败，请检查浏览器存储权限';
};
function renderStats(){$('#stat-calls').textContent=state.stats.calls;$('#stat-prompt').textContent=state.stats.prompt.toLocaleString();$('#stat-completion').textContent=state.stats.completion.toLocaleString();$('#stat-total').textContent=state.stats.total.toLocaleString()}
$('#btn-reset-stats').onclick=async()=>{const ok=await modal({title:'重置统计',message:'确定清空全部 Token 使用统计吗？',confirmText:'重置',cancelText:'取消',danger:true});if(ok){state.stats={calls:0,prompt:0,completion:0,total:0};save('rds_stats',state.stats);renderStats()}};
function renderWords(){$('#word-box').textContent=state.words.length?state.words.join(', '):'（暂无生词）'}
$('#btn-copy-words').onclick=async()=>{const text=state.words.join(', ');if(!text){await modal({message:'生词本目前为空。'});return}try{await navigator.clipboard.writeText(text)}catch{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}const b=$('#btn-copy-words');b.textContent='已复制';setTimeout(()=>b.textContent='复制',1300)};
applyFontSize(device==='mobile'?20:device==='tablet'?20:(state.fontSize||20));renderArticle();renderQuestions();renderStats();renderWords();
</script>
